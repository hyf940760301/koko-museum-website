<script>
'use strict';
/* =====================================================================================
   WGSL — shared header
   ===================================================================================== */
const WGSL_COMMON = /* wgsl */`
struct U {
  camPos: vec4f,    // xyz, w = time
  camRight: vec4f,  // xyz, w = tan(fov/2) * aspect
  camUp: vec4f,     // xyz, w = tan(fov/2)
  camFwd: vec4f,    // xyz, w = frame index
  pPos: vec4f, pRight: vec4f, pUp: vec4f, pFwd: vec4f,   // previous frame camera
  res: vec4f,       // render w, h, 1/w, 1/h
  jitter: vec4f,    // xy sub-pixel jitter, z history blend, w neighbourhood clamp on/off
  quality: vec4f,   // x march steps, y volume samples, z shadow steps, w exposure
  smap: vec4f,      // xz centre, extent, 1/extent
  misc: vec4f,      // x shadow map size, yz canvas size, w cinema mode
};
@group(0) @binding(0) var<uniform> u: U;

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}
`;

/* =====================================================================================
   WGSL — the world: noise, signed distance modelling, water optics, shading
   ===================================================================================== */
const WGSL_SCENE = /* wgsl */`
@group(0) @binding(1) var smapTex: texture_2d<f32>;
@group(0) @binding(2) var lin: sampler;
@group(0) @binding(3) var sdfTex: texture_3d<f32>;    // baked distance to everything but the sea bed
@group(0) @binding(4) var hTex: texture_2d<f32>;      // baked sea bed: height above FLOOR, slope x, slope z, step factor
@group(0) @binding(5) var nTex: texture_3d<f32>;      // tiling fractal noise and its gradient
@group(0) @binding(6) var rep: sampler;
@group(0) @binding(7) var rockTex: texture_3d<f32>;
@group(0) @binding(8) var cauTex: texture_2d<f32>;    // this frame's caustic pattern
@group(0) @binding(9) var cauLo: texture_2d<f32>;     // the same, blurred
@group(0) @binding(10) var auxTex: texture_2d<f32>;   // height of the boulders above the bare sea bed (and the bakes' scratch input)   // baked distance to the natural rock (arch, cave massif), half-metre voxels

const PI = 3.14159265;
const VOX = 1.25;                                 // the baked distance volume: 384 x 96 x 384 voxels
const VMIN = vec3f(-240.0, -118.0, -240.0);
const VSIZE = vec3f(480.0, 120.0, 480.0);
const RMIN = vec3f(-172.0, -54.0, -36.0);         // the rock volume: 284 x 88 x 260 voxels
const RSIZE = vec3f(142.0, 44.0, 130.0);
const TAU = 6.2831853;
const FLOOR = -50.0;
const TMAX = 320.0;
const SUN = vec3f(0.4389, 0.8778, 0.1931);         // towards the sun, under water
const SUNAIR = vec3f(0.5837, 0.7703, 0.2568);    // the same ray above the surface
const EXT = vec3f(0.0265, 0.0088, 0.0052);        // spectral beam extinction: warm colours fade fast, deep cobalt carries far
const SIG_S = vec3f(0.00058, 0.00155, 0.00265);   // wavelength-selective Rayleigh + Mie scattering per metre
const KD = vec3f(0.0245, 0.0090, 0.0060);         // diffuse downwelling attenuation per metre
const SUNE = vec3f(8.2, 7.5, 6.6);
const AMBE = vec3f(0.38, 0.86, 1.34);
const RUNE = vec3f(0.30, 1.00, 0.86);
const OB_A = vec3f(0.0, -45.0, 0.0);              // obelisk axis (glow)
const OB_B = vec3f(0.0, -34.0, 0.0);
const PURPLE = vec3f(0.62, 0.22, 1.0);
const ZNEAR = 0.1;
const ZA = 1.0001667;                             // far / (far - near), far = 600
const CAVE_C = vec3f(-125.0, -44.0, 5.0);         // heart of the glowing cave

// ---------- hashes and noise ----------
fn hash21(p: vec2f) -> f32 {
  var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
fn hash31(p: vec3f) -> f32 {
  var p3 = fract(p * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
fn mod289v3(x: vec3f) -> vec3f { return x - floor(x * (1.0 / 289.0)) * 289.0; }
fn mod289v2(x: vec2f) -> vec2f { return x - floor(x * (1.0 / 289.0)) * 289.0; }
fn permute(x: vec3f) -> vec3f { return mod289v3(((x * 34.0) + 1.0) * x); }
// 2D simplex noise, -1..1
fn snoise(v: vec2f) -> f32 {
  let C = vec4f(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  var i = floor(v + dot(v, C.yy));
  let x0 = v - i + dot(i, C.xx);
  let i1 = select(vec2f(0.0, 1.0), vec2f(1.0, 0.0), x0.x > x0.y);
  let x1 = x0 + C.xx - i1;
  let x2 = x0 + C.zz;
  i = mod289v2(i);
  let p = permute(permute(i.y + vec3f(0.0, i1.y, 1.0)) + i.x + vec3f(0.0, i1.x, 1.0));
  var m = max(vec3f(0.5) - vec3f(dot(x0, x0), dot(x1, x1), dot(x2, x2)), vec3f(0.0));
  m = m * m; m = m * m;
  let x = 2.0 * fract(p * C.www) - 1.0;
  let h = abs(x) - 0.5;
  let a0 = x - floor(x + 0.5);
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  let g = vec3f(a0.x * x0.x + h.x * x0.y, a0.y * x1.x + h.y * x1.y, a0.z * x2.x + h.z * x2.y);
  return 130.0 * dot(m, g);
}
fn vnoise3(p: vec3f) -> f32 {
  let i = floor(p); let f = fract(p);
  let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash31(i), hash31(i + vec3f(1, 0, 0)), w.x), mix(hash31(i + vec3f(0, 1, 0)), hash31(i + vec3f(1, 1, 0)), w.x), w.y),
             mix(mix(hash31(i + vec3f(0, 0, 1)), hash31(i + vec3f(1, 0, 1)), w.x), mix(hash31(i + vec3f(0, 1, 1)), hash31(i + vec3f(1, 1, 1)), w.x), w.y), w.z);
}
// four octaves of value noise with a period of 16; baked once into nTex together with its gradient
fn vnoiseP(p: vec3f, per: f32) -> f32 {
  let i = floor(p); let f = fract(p);
  let w = f * f * (3.0 - 2.0 * f);
  let a = i - floor(i / per) * per;
  let b = (i + 1.0) - floor((i + 1.0) / per) * per;
  return mix(mix(mix(hash31(vec3f(a.x, a.y, a.z)), hash31(vec3f(b.x, a.y, a.z)), w.x), mix(hash31(vec3f(a.x, b.y, a.z)), hash31(vec3f(b.x, b.y, a.z)), w.x), w.y),
             mix(mix(hash31(vec3f(a.x, a.y, b.z)), hash31(vec3f(b.x, a.y, b.z)), w.x), mix(hash31(vec3f(a.x, b.y, b.z)), hash31(vec3f(b.x, b.y, b.z)), w.x), w.y), w.z);
}
fn fbmP(p: vec3f) -> f32 {
  var f = 0.0; var a = 0.5; var q = p; var per = 16.0;
  for (var i = 0; i < 4; i++) { f += a * vnoiseP(q, per); q = q * 2.0 + vec3f(3.0, 9.0, 5.0); per *= 2.0; a *= 0.5; }
  return f;
}
@fragment fn fsNoise(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let q = vec3f(fc.xy, u.camPos.y) * 0.125;
  let e = 0.03;
  return vec4f(fbmP(q), (fbmP(q + vec3f(e, 0.0, 0.0)) - fbmP(q - vec3f(e, 0.0, 0.0))) / (2.0 * e),
               (fbmP(q + vec3f(0.0, e, 0.0)) - fbmP(q - vec3f(0.0, e, 0.0))) / (2.0 * e), (fbmP(q + vec3f(0.0, 0.0, e)) - fbmP(q - vec3f(0.0, 0.0, e))) / (2.0 * e));
}
fn fbm3(p: vec3f) -> f32 { return textureSampleLevel(nTex, rep, p * 0.0625, 0.0).r; }

// ---------- distance primitives ----------
fn rot(a: f32) -> mat2x2f { let c = cos(a); let s = sin(a); return mat2x2f(c, s, -s, c); }
fn sdBox(p: vec3f, b: vec3f) -> f32 { let q = abs(p) - b; return length(max(q, vec3f(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0); }
fn sdBox2(p: vec2f, b: vec2f) -> f32 { let q = abs(p) - b; return length(max(q, vec2f(0.0))) + min(max(q.x, q.y), 0.0); }
fn sdCyl(p: vec3f, r: f32, h: f32) -> f32 { let d = vec2f(length(p.xz) - r, abs(p.y) - h); return min(max(d.x, d.y), 0.0) + length(max(d, vec2f(0.0))); }
fn sdCapsule(p: vec3f, a: vec3f, b: vec3f, r: f32) -> f32 { let pa = p - a; let ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)) - r; }
fn sdEll(p: vec3f, r: vec3f) -> f32 { let k0 = length(p / r); let k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
fn smin(a: f32, b: f32, k: f32) -> f32 { let h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
fn smax(a: f32, b: f32, k: f32) -> f32 { return -smin(-a, -b, k); }
fn opU(a: vec2f, b: vec2f) -> vec2f { if (a.x < b.x) { return a; } return b; }

// ---------- sea bed ----------
// 0 where the sea bed is kept open and sandy, 1 where the reef ridges rise
fn zoneMask(q: vec2f) -> f32 {
  var f = smoothstep(55.0, 140.0, length(q));
  f *= mix(1.0, smoothstep(15.0, 46.0, abs(q.x)), smoothstep(-25.0, 25.0, q.y));
  f *= smoothstep(34.0, 62.0, length(q - vec2f(112.0, 28.0)));     // kelp forest
  f *= smoothstep(22.0, 46.0, length(q - vec2f(66.0, -70.0)));     // wreck
  f *= smoothstep(16.0, 38.0, length(q - vec2f(100.0, -30.0)));    // whale tail
  f *= smoothstep(14.0, 34.0, length(q - vec2f(22.0, -98.0)));     // fallen head
  f *= smoothstep(22.0, 46.0, length(q - vec2f(-62.0, 62.0)));     // rock arch
  f *= smoothstep(46.0, 78.0, length(q - vec2f(-125.0, 5.0)));     // cave
  return f;
}
fn trench(q: vec2f) -> f32 {
  let w = 172.0 + 16.0 * sin(q.y * 0.017) + 5.5 * snoise(vec2f(q.y * 0.045, 2.3));
  let d = abs(q.x - w) / 21.0;
  return exp(-d * d);
}
fn terrainH(q: vec2f) -> f32 {
  let farM = zoneMask(q);
  let dunes = snoise(q * 0.012) * 2.8 + snoise(q * 0.036 + 7.3) * 0.95;
  // current-sculpted asymmetric sandbars (gentle stoss, steeper lee) softened near the monuments
  let qw = q + 9.5 * vec2f(snoise(q * 0.017 + 1.7), snoise(q * 0.017 - 4.3));
  let ph = qw.x * 0.19 + qw.y * 0.085;
  let bar = (sin(ph) + 0.28 * sin(2.0 * ph - 0.5)) * (0.32 + 0.85 * smoothstep(26.0, 65.0, length(q)));
  // domain-warped submarine reef plateaus & tabular escarpments (no spiky cones!)
  let rw = q + 22.0 * vec2f(snoise(q * 0.009 - 2.1), snoise(q * 0.009 + 6.4));
  let nBase = 0.5 + 0.5 * snoise(rw * 0.0062 + 3.1);
  let mesa = smoothstep(0.22, 0.78, nBase) * 19.0 + smoothstep(0.55, 0.88, nBase) * 7.0;
  let rg2 = 1.0 - abs(snoise(rw * 0.022 - 5.4));
  let rawReef = (mesa + 3.2 * farM + (rg2 * rg2 - 0.3) * 3.2 * smoothstep(0.25, 0.7, nBase)) * farM;
  let stepped = rawReef + 0.34 * sin(rawReef * 1.85);
  // winding sandy surge channels cutting naturally across the reef shelves
  let ch = abs(snoise(rw * 0.019 + 8.7));
  let channel = (1.0 - smoothstep(0.0, 0.18, ch)) * farM * smoothstep(0.3, 0.7, nBase) * 4.2;
  var h = FLOOR + dunes * (0.20 + 0.80 * farM) + bar * (0.35 + 0.65 * farM) + stepped - channel;
  h += snoise(q * 0.085) * 1.1 * farM * smoothstep(0.25, 0.75, nBase);
  // faulted canyon benches along the abyssal trench walls
  let tr = trench(q);
  let wall = tr * (1.0 - tr) * 4.0;
  let bench = (0.42 * sin(q.y * 0.14 + 2.0 * snoise(q * 0.05)) + 0.32 * (1.0 - abs(snoise(q * 0.10 + 9.0)))) * wall * 5.0;
  return h - 64.0 * tr + bench;
}
// (distance, height above the sea bed)
fn sdTerrain(p: vec3f) -> vec2f {
  if (p.y > -11.0) { return vec2f(p.y + 12.0, 50.0); }
  let ha = p.y - terrainH(p.xz);
  return vec2f(ha * mix(0.50, 0.30, trench(p.xz)), ha);
}

// the baked copy of the same sea bed: one fetch instead of noise evaluations
fn terrA(p: vec3f) -> vec2f {
  if (p.y > -11.0) { return vec2f(p.y + 12.0, 50.0); }
  let s = textureSampleLevel(hTex, lin, p.xz / 480.0 + 0.5, 0.0);
  let ha = p.y - FLOOR - s.r;
  return vec2f(ha * s.a, ha);
}
// The bake runs in three passes. Reef outcrops & boulders are drawn as quads into auxTex (max-blended):
// .r = total elevation above bare sand (rock + drifted sand apron), .g = exposed rock mask, .b = rubble/shell scree apron
struct RIn { @builtin(vertex_index) vi: u32, @location(3) ia: vec4f, @location(4) ib: vec4f };
struct ROut { @builtin(position) clip: vec4f, @location(0) lp: vec2f, @location(1) hs: vec3f };
@vertex fn vsRockH(v: RIn) -> ROut {
  let c = array<vec2f, 6>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0))[v.vi] * 1.55;
  let q = v.ia.xy + c * v.ia.z;
  var o: ROut;
  o.clip = vec4f(q.x / 240.0, -q.y / 240.0, 0.0, 1.0);
  o.lp = c; o.hs = vec3f(v.ia.w, v.ib.x, v.ib.y);
  return o;
}
@fragment fn fsRockH(i: ROut) -> @location(0) vec4f {
  let sd = i.hs.y; let kind = i.hs.z;
  let ca = cos(sd * TAU); let sa = sin(sd * TAU);
  // stretch and orient each outcrop so reefs form natural strike ridges instead of round buns
  let p = mat2x2f(ca, sa, -sa, ca) * i.lp * vec2f(1.0, 1.0 + 0.34 * fract(sd * 13.7));
  let n1 = snoise(p * 1.55 + sd * 17.0);
  let n2 = snoise(p * 3.8 + sd * 31.0);
  let ridge = 1.0 - abs(snoise(p * 2.4 - sd * 23.0));
  let rr = length(p) * (1.0 + 0.24 * n1 - 0.10 * (ridge - 0.5));
  // angular reef core vs flat-topped carbonate shelf (kind > 0.5)
  let base = 1.0 - smoothstep(0.32, 0.98, rr);
  let crown = select(pow(max(1.0 - rr * 0.96, 0.0), 0.62) * (0.68 + 0.34 * ridge * ridge + 0.14 * n2),
                     smoothstep(0.0, 0.26, 1.0 - rr) * (0.82 + 0.12 * ridge + 0.08 * n2), kind > 0.5);
  var rk = i.hs.x * max(base * 0.35, crown) * (1.0 - smoothstep(0.86, 1.04, rr));
  // subtle sedimentary bedding ledges (strictly monotonic so no inverted steps)
  rk += 0.055 * sin(rk * 6.5 + sd * 9.0) * smoothstep(0.05, 0.35, rk);
  // windward/current-drifted sand collar burying the foot of the rock
  let drift = 1.0 + 0.18 * (i.lp.x * 0.85 + i.lp.y * 0.52);
  let skirt = i.hs.x * 0.24 * (1.0 - smoothstep(0.38, 1.38, rr / drift)) * (0.85 + 0.15 * n1);
  let hTot = max(rk, skirt);
  let expose = smoothstep(0.015, 0.14, rk - skirt * 0.92);
  let scree = (1.0 - smoothstep(0.62, 1.46, rr)) * smoothstep(0.34, 0.72, rr) * (0.45 + 0.55 * max(n2, 0.0)) * clamp(i.hs.x * 0.45, 0.15, 1.0);
  return vec4f(max(hTot, 0.0), expose, scree, 1.0);
}
// then the sea bed is added (the sum is stored as a coarse part and a fine remainder, to keep full precision in half floats);
@fragment fn fsHeightRaw(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let h = terrainH((fc.xy / 2048.0 - 0.5) * 480.0) - FLOOR + textureLoad(auxTex, vec2i(fc.xy), 0).r;
  let c = floor(h * 8.0 + 0.5) / 8.0;
  return vec4f(c, h - c, 0.0, 1.0);
}
fn hraw(ip: vec2i) -> f32 { let s = textureLoad(auxTex, clamp(ip, vec2i(0), vec2i(2047)), 0); return s.r + s.g; }
// and last the slopes and the step factor: how much of the height above the bed is safe to march at once
@fragment fn fsHeight(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let ip = vec2i(fc.xy);
  let d = 480.0 / 2048.0;
  let h = hraw(ip);
  let sx = (hraw(ip + vec2i(1, 0)) - hraw(ip - vec2i(1, 0))) / (2.0 * d);
  let sz = (hraw(ip + vec2i(0, 1)) - hraw(ip - vec2i(0, 1))) / (2.0 * d);
  var s2 = sx * sx + sz * sz;
  let offs = array<vec2i, 8>(vec2i(2, 0), vec2i(-2, 0), vec2i(0, 2), vec2i(0, -2), vec2i(4, 0), vec2i(-4, 0), vec2i(0, 4), vec2i(0, -4));
  for (var k = 0; k < 8; k++) {
    let st = f32(abs(offs[k].x + offs[k].y));
    let g = (hraw(ip + offs[k]) - h) / (st * d);
    s2 = max(s2, g * g);
  }
  let q = (fc.xy / 2048.0 - 0.5) * 480.0;
  let k0 = mix(mix(0.82, 0.50, min(zoneMask(q) * 4.0, 1.0)), 0.30, trench(q));
  return vec4f(h, sx, sz, min(k0, 0.90 / sqrt(1.0 + s2)));
}

// ---------- natural rock ----------
fn rockDisp(p: vec3f) -> f32 {
  let r1 = 1.0 - abs(vnoise3(p * 0.16) * 2.0 - 1.0);
  let r2 = 1.0 - abs(vnoise3(p * 0.48 + 7.3) * 2.0 - 1.0);
  let r3 = 1.0 - abs(vnoise3(p * 1.25 - 4.1) * 2.0 - 1.0);
  // tilted sedimentary bedding ledges & angular joint facets
  let strata = p.y * 1.65 + p.x * 0.22 - p.z * 0.14 + 2.1 * vnoise3(p * 0.20);
  let ledge = 0.34 * sin(strata + 0.35 * sin(strata)) + 0.11 * sin(strata * 3.1);
  return (vnoise3(p * 0.13 + 3.1) - 0.52) * 3.4 + (r1 * r1 - 0.42) * 2.6 + (r2 * r2 - 0.40) * 1.15 + (r3 - 0.5) * 0.38 + ledge;
}
fn sdArch(p0: vec3f) -> f32 {
  var p = p0 - vec3f(-62.0, 0.0, 62.0);
  let bd = length(p - vec3f(0.0, 8.0, 0.0)) - 31.0;
  if (bd > 3.0) { return bd; }
  let r2 = rot(-0.785) * p.xz; p = vec3f(r2.x, p.y, r2.y);
  let a = atan2(p.y - 1.0, p.x);
  // angular rectangular-arch cross-section rather than a smooth inner tube
  let c = vec2f(length(p.xy - vec2f(0.0, 1.0)) - 15.0, p.z * 0.78);
  var d = sdBox2(c, vec2f(3.8 + 1.1 * sin(a * 3.0 + 1.0), 3.4 + 0.8 * cos(a * 2.0))) - 0.65;
  d = smin(d, sdBox(p - vec3f(-17.5, 1.2, 2.5), vec3f(7.5, 5.8, 6.8)) - 1.2, 1.6);
  d = smin(d, sdBox(p - vec3f(18.5, 0.5, -3.5), vec3f(8.5, 5.2, 7.5)) - 1.2, 1.6);
  return (d + rockDisp(p0)) * 0.55;
}
fn caveVoid(p: vec3f) -> f32 {
  var c = length((p - vec3f(0.0, 6.0, 0.0)) * vec3f(1.0, 1.3, 1.0)) - 15.0;
  c = smin(c, sdCapsule(p, vec3f(8.0, 4.5, 0.0), vec3f(52.0, 4.0, 5.0), 6.0), 4.0);
  return smin(c, sdCapsule(p, vec3f(-3.0, 13.0, -2.0), vec3f(11.5, 42.0, 4.3), 5.0), 3.0);
}
// a rock massif with a chamber, a tunnel towards the ruins and a skylight aligned with the sun
fn sdCaveRock(p0: vec3f) -> f32 {
  let p = p0 - vec3f(-125.0, 0.0, 5.0);
  let bd = sdEll(p - vec3f(4.0, 4.0, 3.0), vec3f(50.0, 34.0, 44.0));
  if (bd > 3.0) { return bd; }
  var d = sdEll(p - vec3f(0.0, 3.0, 0.0), vec3f(40.0, 27.0, 34.0));
  d = smin(d, sdEll(p - vec3f(26.0, 1.0, 20.0), vec3f(18.0, 13.0, 16.0)), 6.0);
  let nd = rockDisp(p0);
  d += nd;
  return smax(d, -(caveVoid(p) - nd * 0.35), 2.5) * 0.6;
}
// how much open-water light reaches a point in or near the cave (1 outside)
fn caveSky(pos: vec3f) -> f32 {
  let p = pos - vec3f(-125.0, FLOOR, 5.0);
  if (dot(p, p) > 3600.0 || caveVoid(p) > 6.0) { return 1.0; }
  return mix(0.06, 1.0, max(smoothstep(18.0, 46.0, p.x), smoothstep(18.0, 32.0, p.y)));
}
fn sdCrystal(p: vec3f, r: f32, h: f32) -> f32 {
  let q = abs(p.xz);
  let hex = max(q.x * 0.866025 + q.y * 0.5, q.y) - r + 0.012 * r * sin(p.y * 16.0);
  // asymmetric rhombohedral quartz termination facets
  let tip = max((q.x * 0.866 + q.y * 0.5) * 0.62 + (p.y - (h - r * 1.35)) * 0.78,
                q.y * 0.58 + (p.y - (h - r * 1.15)) * 0.81) - r * 0.62;
  return max(max(hex, tip), -p.y - 2.0) * 0.58;
}
fn sdCrystals(p0: vec3f) -> f32 {
  let p = p0 - vec3f(-125.0, 0.0, 5.0);
  let bd = length(p - vec3f(0.0, 5.0, 0.0)) - 18.0;
  if (bd > 2.0) { return bd; }
  let sec = TAU / 7.0;
  let id = round((atan2(p.z, p.x) - sec * 0.5) / sec);
  let ang = id * sec + sec * 0.5;
  let h = hash21(vec2f(id, 5.0));
  let ca = cos(ang); let sa = sin(ang);
  let pc = vec3f(ca * p.x + sa * p.z - (9.5 + 2.5 * h), p.y + 0.5, -sa * p.x + ca * p.z);
  var q = pc;
  var r2 = rot(0.3 - 0.5 * h) * q.xy; q = vec3f(r2.x, r2.y, q.z);
  var d = sdCrystal(q, 0.82 + 0.5 * h, 4.6 + 4.0 * h);
  q = pc - vec3f(0.9, 0.0, 1.1);
  r2 = rot(-0.5) * q.xy; q = vec3f(r2.x, r2.y, q.z);
  r2 = rot(0.4) * q.yz; q = vec3f(q.x, r2.x, r2.y);
  d = min(d, sdCrystal(q, 0.52, 3.1 + 2.0 * h));
  q = pc - vec3f(-0.5, 0.0, -1.2);
  r2 = rot(-0.45) * q.yz; q = vec3f(q.x, r2.x, r2.y);
  d = min(d, sdCrystal(q, 0.46, 2.7));
  q = p - vec3f(-2.0, -0.5, 1.5);
  r2 = rot(0.15) * q.xy; q = vec3f(r2.x, r2.y, q.z);
  d = min(d, sdCrystal(q, 1.52, 8.6));
  q = p - vec3f(-1.0, -0.5, 3.0);
  r2 = rot(-0.55) * q.yz; q = vec3f(q.x, r2.x, r2.y);
  d = min(d, sdCrystal(q, 0.92, 5.6));
  return d;
}
// diverse reef coral colonies (brain, tiered table acropora, branching staghorn, hollow barrel sponges)
fn reefZone(c: vec2f) -> f32 {
  var dz = min(length(c - vec2f(-62.0, 62.0)) - 46.0, length(c - vec2f(66.0, -70.0)) - 44.0);
  dz = min(dz, min(length(c - vec2f(100.0, -30.0)) - 34.0, length(c - vec2f(118.0, 30.0)) - 54.0));
  dz = min(dz, min(length(c - vec2f(-78.0, 8.0)) - 28.0, length(c - vec2f(34.0, 62.0)) - 26.0));
  return min(dz, length(c - vec2f(-34.0, -26.0)) - 24.0);
}
fn coralAt(p: vec3f, ha: f32, id: vec2f) -> f32 {
  let CELL = 4.2;
  let c = (id + 0.5) * CELL;
  let h = hash21(id + 3.0);
  if (h > 0.46 || reefZone(c) > 0.0) { return 9.0; }
  let f = p.xz - c;
  if (dot(f, f) > 9.5) { return 2.9; }
  let r = 0.42 + 1.18 * fract(h * 37.0) * fract(h * 37.0);
  let o = (vec2f(fract(h * 113.0), fract(h * 271.0)) - 0.5) * (1.7 - r * 0.85) * 1.3;
  let q = vec3f(f.x - o.x, ha - r * 0.25, f.y - o.y);
  let sp = fract(h * 53.0);
  if (sp < 0.28) {
    // 1) Diploria brain coral: dome carved with meandering labyrinthine gyri and valleys
    let u = q / r;
    let fold = abs(sin(u.x * 11.5 + 1.7 * sin(u.z * 8.2 + 1.3 * sin(u.y * 6.0 + h * 19.0))));
    let dome = length(q * vec3f(1.0, 1.28, 1.0)) - r;
    return (dome + 0.065 * r * (1.0 - fold)) * 0.56;
  } else if (sp < 0.55) {
    // 2) Tiered table Acropora: central stalk supporting scalloped horizontal reef plates
    let rq = length(q.xz);
    let ang = atan2(q.z, q.x);
    let rad1 = r * (1.28 + 0.14 * sin(ang * 7.0 + h * 20.0) + 0.05 * sin(ang * 19.0));
    let p1 = length(vec2f(max(rq - rad1, 0.0), q.y - r * 0.58)) - 0.075 * r - 0.018 * r * sin(rq * 26.0 / r);
    let rad2 = r * (0.86 + 0.12 * sin(ang * 6.0 + 2.0));
    let p2 = length(vec2f(max(rq - rad2, 0.0), q.y - r * 0.96)) - 0.065 * r;
    let stem = sdCyl(q - vec3f(0.0, r * 0.35, 0.0), r * 0.26, r * 0.55);
    return smin(stem, min(p1, p2), 0.12 * r) * 0.58;
  } else if (sp < 0.82) {
    // 3) Bifurcating staghorn coral: 7-fold primary antlers with secondary tines
    let sec = TAU / 7.0;
    let ia = round(atan2(q.z, q.x) / sec) * sec;
    let cs = cos(ia); let sn = sin(ia);
    let pk = vec3f(cs * q.x + sn * q.z, q.y + r * 0.25, -sn * q.x + cs * q.z);
    var d = min(sdCapsule(pk, vec3f(0.14 * r, 0.0, 0.0), vec3f(0.88 * r, 1.52 * r, 0.0), 0.14 * r),
                sdCapsule(pk, vec3f(0.0), vec3f(0.08 * r, 1.82 * r, 0.0), 0.16 * r));
    d = smin(d, sdCapsule(pk, vec3f(0.48 * r, 0.78 * r, 0.0), vec3f(0.55 * r, 1.48 * r, 0.34 * r), 0.10 * r), 0.06 * r);
    d = smin(d, sdCapsule(pk, vec3f(0.62 * r, 1.05 * r, 0.0), vec3f(1.06 * r, 1.32 * r, -0.22 * r), 0.09 * r), 0.05 * r);
    return d * 0.56;
  }
  // 4) Cluster of ribbed barrel / tube sponges with hollow osculum craters
  var d = 9.0;
  for (var k = 0; k < 3; k++) {
    let fk = f32(k);
    let ak = fk * 2.18 + h * 11.0;
    let sh = r * (0.85 + 0.35 * fract(h * (13.0 + fk * 7.0)));
    let sr = r * (0.28 + 0.07 * fk);
    let sq = q - vec3f(cos(ak) * r * 0.36, sh * 0.45 - r * 0.15, sin(ak) * r * 0.36);
    let rib = 0.025 * r * sin(sq.y * 22.0 / r);
    let outer = sdCyl(sq, sr * (1.0 - 0.12 * sq.y / sh) + rib, sh * 0.55);
    let inner = sdCyl(sq - vec3f(0.0, sh * 0.22, 0.0), sr * 0.56, sh * 0.48);
    d = min(d, smax(outer, -inner, 0.035 * r));
  }
  return d * 0.58;
}
// the four nearest cells are evaluated so that the field stays a true distance (ambient occlusion relies on it)
fn sdCoral(p: vec3f, ha: f32) -> f32 {
  if (ha > 4.5) { return ha * 0.5; }
  let dz = reefZone(p.xz);
  if (dz > 4.2) { return dz - 2.0; }
  let i0 = floor(p.xz / 4.2 - 0.5);
  var d = min(coralAt(p, ha, i0), coralAt(p, ha, i0 + vec2f(1.0, 0.0)));
  d = min(d, min(coralAt(p, ha, i0 + vec2f(0.0, 1.0)), coralAt(p, ha, i0 + vec2f(1.0, 1.0))));
  return min(d, 3.0);
}

// ---------- wreck ----------
fn wreckLocal(p0: vec3f) -> vec3f {
  var p = p0 - vec3f(66.0, -0.8, -70.0);
  let r1 = rot(0.9) * p.xz; p = vec3f(r1.x, p.y, r1.y);
  let r2 = rot(0.28) * p.yz;
  return vec3f(p.x, r2.x, r2.y);
}
fn sdWreck(p0: vec3f) -> f32 {
  let p = wreckLocal(p0);
  let bd = sdBox(p - vec3f(-2.0, 10.0, 2.0), vec3f(25.5, 14.2, 11.2));
  if (bd > 2.0) { return bd; }
  let k = clamp(1.0 - p.x * p.x / 324.0, 0.0, 1.0);
  let wx = max(4.4 * sqrt(k) * (0.75 + 0.25 * k), 0.35);
  let deckY = 5.4 + 0.010 * p.x * p.x + 2.4 * smoothstep(8.0, 10.0, p.x);
  let dh = (length(vec2f(p.z / wx, min(p.y - 5.6, 0.0) / 5.6)) - 1.0) * min(wx, 4.4);
  let ends = abs(p.x) - 17.9;
  let hole = sin(p.x * 0.55 + 1.3) * sin(p.y * 0.8 + 0.5) * sin(p.z * 0.3 + p.x * 0.21);
  // carvel hull planking strakes & heavy gunwale wales
  let strake = 0.024 * (1.0 - smoothstep(0.0, 0.14, abs(fract(p.y * 2.4 + 0.012 * p.x * p.x) - 0.5)));
  let wale = 0.06 * exp(-pow((p.y - deckY + 0.65) * 3.0, 2.0));
  var d = max(max(max(abs(dh) - 0.14 - wale + strake, p.y - deckY - 0.35), (hole - 0.25) * 1.5), ends);
  // exposed curved timber ribs (frames) that stand intact even across hull breaches
  let rx = abs(p.x - round(p.x / 1.45) * 1.45) - 0.13;
  d = min(d, max(max(max(abs(dh + 0.20) - 0.18, rx), p.y - deckY - 0.15 + 0.35 * sin(p.x * 1.9)), ends + 0.6));
  // keel, stempost & sternpost + rudder blade
  d = min(d, sdBox(p - vec3f(0.0, 0.05, 0.0), vec3f(18.1, 0.52, 0.28)));
  let pr = rot(0.35) * (p.xz - vec2f(18.3, 0.0));
  d = min(d, sdBox(vec3f(pr.x - 0.6, p.y - 2.8, pr.y), vec3f(0.7, 2.4, 0.12)));
  // breached planked deck + deck beams + cargo hatch coaming
  let hole2 = sin(p.x * 0.4 + 2.0) * sin(p.z * 0.9 + 1.0);
  let plankZ = 0.018 * (1.0 - smoothstep(0.0, 0.14, abs(fract(p.z * 3.2) - 0.5)));
  var dk = max(max(max(dh, abs(p.y - deckY + 0.5) - 0.11 + plankZ), (hole2 - 0.42) * 1.5), ends);
  dk = max(dk, -sdBox(p - vec3f(-2.5, deckY - 0.5, 0.0), vec3f(2.4, 0.6, 1.6)));
  d = min(d, dk);
  d = min(d, max(max(dh + 0.15, max(rx - 0.02, abs(p.y - deckY + 0.72) - 0.16)), ends + 0.9));
  // stern cabin gallery window frames
  let stWin = min(abs(fract(p.z * 0.9) - 0.5), abs(fract(p.y * 0.85) - 0.5));
  let transom = max(sdBox(p - vec3f(17.5, 6.4, 0.0), vec3f(0.22, 1.6, 2.8)), 0.14 - stWin);
  d = min(d, transom);
  // masts, crosstrees, crow's nest, fallen yardarm, bowsprit & slack catenary rigging
  d = min(d, sdCapsule(p, vec3f(1.5, 0.8, 0.0), vec3f(2.2, 21.0, 0.0), 0.42 - 0.14 * clamp(p.y / 21.0, 0.0, 1.0)));
  d = min(d, sdCapsule(p, vec3f(2.0, 15.5, -5.2), vec3f(2.0, 15.0, 5.2), 0.20 - 0.06 * clamp(abs(p.z) / 5.2, 0.0, 1.0)));
  d = min(d, smax(sdCyl(p - vec3f(2.05, 17.3, 0.0), 1.02, 0.38), -sdCyl(p - vec3f(2.05, 17.45, 0.0), 0.84, 0.40), 0.04));
  d = min(d, sdCapsule(p, vec3f(-8.5, 0.8, 0.0), vec3f(-8.8, 12.5, 0.0), 0.36 - 0.10 * clamp(p.y / 12.5, 0.0, 1.0)));
  d = min(d, sdCapsule(p, vec3f(-8.7, 9.4, -3.4), vec3f(-8.7, 9.1, 3.4), 0.16));
  d = min(d, sdCapsule(p, vec3f(9.0, 7.5, 0.5), vec3f(20.0, 5.5, 10.5), 0.28));
  d = min(d, sdCapsule(p, vec3f(-17.0, 6.2, 0.0), vec3f(-24.5, 9.2, 0.0), 0.24 - 0.08 * clamp((-17.0 - p.x) / 7.5, 0.0, 1.0)));
  // sagging shroud cable between foremast and mainmast
  let tc = clamp((p.x + 8.7) / 10.7, 0.0, 1.0);
  let cab = vec3f(-8.7 + 10.7 * tc, mix(11.2, 16.8, tc) - 1.5 * tc * (1.0 - tc), 0.0);
  d = min(d, length(p - cab) - 0.07);
  // iron anchor hanging off the starboard bow
  let pa = p - vec3f(-15.2, 3.6, 2.65);
  var anc = min(sdCapsule(pa, vec3f(0.0, -1.1, 0.0), vec3f(0.0, 1.1, 0.0), 0.10), sdCapsule(pa, vec3f(0.0, 0.85, -0.7), vec3f(0.0, 0.85, 0.7), 0.09));
  anc = min(anc, sdCapsule(vec3f(abs(pa.x), pa.y, pa.z), vec3f(0.0, -1.1, 0.0), vec3f(0.85, -0.55, 0.0), 0.11));
  d = min(d, anc);
  return d * 0.58;
}

// ---------- colossal sculpture ----------
// a 26 m whale fluke of dressed basalt rising from an octagonal plinth on the sand
fn sdWhaleTail(p0: vec3f) -> f32 {
  var p = p0 - vec3f(100.0, 0.0, -30.0);
  let bd = length(p - vec3f(0.0, 12.0, 0.0)) - 20.5;
  if (bd > 2.0) { return bd; }
  let r1 = rot(-0.5) * p.xz;
  let q = vec3f(r1.x, p.y, r1.y - 0.012 * p.y * p.y);
  let ty = clamp(q.y / 19.0, 0.0, 1.0);
  // carved basalt peduncle with dorsal/ventral hydrodynamic keels
  let rped = mix(4.6, 1.05, pow(ty, 0.62));
  var d = max(length(vec2f(q.x * 1.38, q.z * (1.0 - 0.22 * ty))) - rped, q.y - 20.2) * 0.7;
  // stepped octagonal plinth at the base
  let ao = abs(p.xz);
  let oct = max(max(ao.x, ao.y), (ao.x + ao.y) * 0.7071);
  d = min(d, max(oct - 6.2, abs(p.y - 0.8) - 0.9) - 0.06);
  d = min(d, max(oct - 5.1, abs(p.y - 2.0) - 0.55) - 0.05);
  // twin fluke blades with swept leading edge, central notch and humpback scalloped trailing edge
  let rf = rot(-0.42) * (vec2f(abs(q.x), q.y - 20.2) - vec2f(5.6, 1.2));
  let scal = 0.18 * sin(rf.x * 2.6) * smoothstep(-0.2, 1.6, rf.y) * (1.0 - smoothstep(5.4, 6.6, abs(rf.x)));
  let blade = sdEll(vec3f(rf.x, rf.y + scal, q.z + 0.02 * rf.x * rf.x), vec3f(6.7, 2.55, 0.48));
  d = smin(d, blade, 1.5);
  d = smax(d, -(length(vec3f(q.x * 1.4, q.y - 23.6, q.z * 0.6)) - 1.35), 0.55);
  // dressed ashlar course seams and subtle longitudinal fluting
  let seam = 0.032 * (1.0 - smoothstep(0.0, 0.07, abs(fract(q.y * 0.58) - 0.5)));
  let flute = 0.022 * sin(atan2(q.z, q.x) * 18.0) * (1.0 - ty);
  return d + seam + flute;
}
// head of a bearded god: sculpted brow ridge, eyelids & pupils, classical nose, lips, curled beard & hair locks
fn sdHead(q: vec3f) -> f32 {
  let sx = abs(q.x);
  var hd = sdEll(q - vec3f(0.0, 0.02, 0.07), vec3f(0.51, 0.65, 0.59));
  // cheekbones & temples
  hd = smin(hd, sdEll(vec3f(sx - 0.24, q.y + 0.04, q.z - 0.44), vec3f(0.20, 0.16, 0.18)), 0.12);
  // brow ridge & nose bridge + nostrils
  hd = smin(hd, sdCapsule(q, vec3f(-0.31, 0.21, 0.55), vec3f(0.31, 0.21, 0.55), 0.075), 0.08);
  hd = smin(hd, sdCapsule(q, vec3f(0.0, 0.21, 0.62), vec3f(0.0, -0.09, 0.79), 0.062 - 0.015 * clamp((0.21 - q.y) * 3.0, 0.0, 1.0)), 0.055);
  hd = smin(hd, length(vec3f(sx - 0.065, q.y + 0.095, q.z - 0.71)) - 0.048, 0.035);
  // eye sockets, eyeballs & upper eyelids
  hd = smax(hd, -sdEll(vec3f(sx - 0.20, q.y - 0.08, q.z - 0.63), vec3f(0.135, 0.075, 0.11)), 0.04);
  let eye = length(vec3f(sx - 0.20, q.y - 0.08, q.z - 0.585)) - 0.072;
  let lid = max(abs(length(vec3f(sx - 0.20, q.y - 0.08, q.z - 0.585)) - 0.080) - 0.012, -(q.y - 0.085));
  hd = min(hd, min(eye, lid));
  // moustache & parted lips
  hd = smin(hd, sdCapsule(vec3f(sx, q.y, q.z), vec3f(0.02, -0.17, 0.69), vec3f(0.24, -0.26, 0.56), 0.055), 0.045);
  hd = smin(hd, sdCapsule(q, vec3f(-0.11, -0.245, 0.65), vec3f(0.11, -0.245, 0.65), 0.036), 0.025);
  // tiered curled beard & flowing hair locks
  var brd = sdEll(q - vec3f(0.0, -0.52, 0.39), vec3f(0.37, 0.53, 0.31));
  brd -= 0.022 * sin(q.x * 26.0 + 1.4 * sin(q.y * 14.0)) * smoothstep(-0.95, -0.15, q.y);
  hd = smin(hd, brd, 0.14);
  var hair = sdEll(q - vec3f(0.0, -0.14, -0.20), vec3f(0.64, 0.86, 0.60));
  hair = smin(hair, sdEll(vec3f(sx - 0.44, q.y + 0.05, q.z - 0.08), vec3f(0.18, 0.52, 0.36)), 0.12);
  hair -= 0.018 * sin(atan2(q.x, -q.z) * 22.0 + 1.6 * sin(q.y * 12.0));
  hd = smin(hd, hair, 0.12);
  return hd;
}
fn sdFallenHead(p0: vec3f) -> f32 {
  var p = p0 - vec3f(22.0, 2.5, -98.0);
  let S = 10.0;
  let bd = length(p) - 1.18 * S;
  if (bd > 2.0) { return bd; }
  var r2 = rot(0.3) * p.xz; p = vec3f(r2.x, p.y, r2.y);
  r2 = rot(0.35) * p.xy; p = vec3f(r2.x, r2.y, p.z);
  r2 = rot(0.85) * p.yz; p = vec3f(p.x, r2.x, r2.y);
  let q = p / S;
  var d = sdHead(q);
  var neck = sdCapsule(q, vec3f(0.0, -0.5, -0.05), vec3f(0.0, -1.12, -0.1), 0.36);
  neck = max(neck, -q.y - 1.05 + 0.06 * sin(q.x * 13.0) * sin(q.z * 11.0));
  d = smin(d, neck, 0.14);
  // weathered fracture chip on the left brow
  d = smax(d, -(length(q - vec3f(-0.42, 0.36, 0.46)) - 0.18 + 0.025 * sin(q.x * 29.0) * sin(q.y * 31.0)), 0.03);
  return d * S * 0.82;
}

// ---------- architecture ----------
// classical fluted column with Attic base, entasis, drum joints, weathered chips, necking rings, echinus & abacus
fn sdColumn(p: vec3f, r: f32, h: f32, cutY: f32) -> f32 {
  let rr = length(p.xz);
  let a = atan2(p.z, p.x);
  let hs = h - r * 0.92;
  let ty = clamp((p.y - r * 0.62) / max(hs - r * 0.62, 0.1), 0.0, 1.0);
  // classical entasis curve (slight swelling at 1/3 height, tapering upward) + 20 sharp-arrised flutes
  let ent = 1.0 + 0.025 * sin(ty * PI) - 0.165 * ty * ty;
  let fl = pow(0.5 + 0.5 * cos(a * 20.0), 0.68);
  let rs = r * ent - 0.058 * r * fl;
  // drum joints & subtle weathered edge chips along drum rims
  let drum = abs(fract(p.y / (r * 1.85)) - 0.5);
  let joint = 0.026 * r * (1.0 - smoothstep(0.0, 0.035, drum));
  let chip = 0.035 * r * max(sin(a * 7.0 + floor(p.y / (r * 1.85)) * 4.3) * sin(a * 13.0) - 0.55, 0.0) * (1.0 - smoothstep(0.0, 0.09, drum));
  let neck = 0.022 * r * (1.0 - smoothstep(0.0, 0.05, abs(p.y - (hs - r * 0.16)))) + 0.018 * r * (1.0 - smoothstep(0.0, 0.04, abs(p.y - (hs - r * 0.28))));
  var d = max(rr - rs + joint + chip + neck, abs(p.y - hs * 0.5) - hs * 0.5);
  // square plinth + Attic double-torus & scotia mouldings
  d = min(d, sdBox(p - vec3f(0.0, r * 0.14, 0.0), vec3f(r * 1.38, r * 0.14, r * 1.38)) - 0.02 * r);
  d = min(d, length(vec2f(rr - r * 1.20, p.y - r * 0.36)) - r * 0.11);
  d = min(d, sdCyl(p - vec3f(0.0, r * 0.49, 0.0), r * 1.08, r * 0.07));
  d = min(d, length(vec2f(rr - r * 1.12, p.y - r * 0.60)) - r * 0.085);
  // echinus cushion & moulded abacus slab
  let ey = p.y - hs;
  let et = clamp(ey / (r * 0.46), 0.0, 1.0);
  let er = r * (0.84 + 0.50 * sin(et * 1.5708));
  d = min(d, max(rr - er, abs(ey - r * 0.23) - r * 0.23));
  var ab = sdBox(p - vec3f(0.0, hs + r * 0.66, 0.0), vec3f(r * 1.40, r * 0.20, r * 1.40)) - 0.02 * r;
  ab = min(ab, sdBox(p - vec3f(0.0, hs + r * 0.84, 0.0), vec3f(r * 1.48, r * 0.05, r * 1.48)) - 0.01 * r);
  d = min(d, ab);
  let jag = 0.36 * sin(p.x * 3.1 + 1.0) * sin(p.z * 2.7) + 0.12 * sin(p.x * 8.3 - p.z * 7.1) + p.x * 0.28;
  return max(d, p.y + jag - cutY);
}

fn ruinMask(a: f32) -> f32 { return sin(a + 0.9) + 0.6 * sin(a * 2.0 + 4.0) + 0.45; }

// round sanctuary: moulded krepidoma steps, ring of columns, triglyph-and-dentil entablature, altar & pyramidion obelisk
fn sdTholos(p: vec3f) -> vec2f {
  let rr = length(p.xz);
  let bd = max(rr - 29.0, p.y - 22.0);
  if (bd > 2.0) { return vec2f(bd, 3.0); }
  let a = atan2(p.z, p.x);
  let q = vec2f(rr, p.y);
  // 3-stepped stylobate with radial block joints & lip mouldings
  let rjoint = 0.025 * (1.0 - smoothstep(0.0, 0.025, abs(fract(a * 48.0 / TAU) - 0.5)));
  var d = sdBox2(q - vec2f(0.0, 0.2), vec2f(27.0, 0.5));
  d = min(d, sdBox2(q - vec2f(0.0, 0.9), vec2f(25.0, 0.5)));
  d = min(d, sdBox2(q - vec2f(0.0, 1.6), vec2f(23.0, 0.5)));
  // central circular paving medallion groove
  d = max(d, -sdBox2(vec2f(abs(rr - 11.5), p.y - 2.1), vec2f(0.18, 0.06)));
  d = d - 0.04 + rjoint;
  // 20 columns
  let sector = TAU / 20.0;
  let id = round(a / sector);
  let ang = id * sector;
  let ca = cos(ang); let sa = sin(ang);
  let pc = vec3f(ca * p.x + sa * p.z - 19.0, p.y - 2.1, -sa * p.x + ca * p.z);
  var cutY = 100.0;
  let mk = ruinMask(ang);
  if (mk < 0.12) { cutY = 1.5 + 9.0 * hash21(vec2f(id, 3.7)); }
  d = min(d, sdColumn(pc, 1.05, 14.0, cutY));
  // entablature: architrave, frieze with Doric triglyphs, dentil band & projecting cornice
  let q2 = vec2f(rr - 19.0, p.y - 17.3);
  var de = sdBox2(q2, vec2f(1.42, 1.08)) - 0.05;
  de = min(de, sdBox2(q2 - vec2f(0.0, -0.45), vec2f(1.52, 0.08)) - 0.02);     // taenia band
  // triglyphs (40 around the ring, each with vertical glyph channels)
  let ta = fract(a * 40.0 / TAU) - 0.5;
  if (abs(ta) < 0.18 && abs(q2.y - 0.18) < 0.48) {
    let ch = 0.03 * cos(ta * 95.0);
    de = min(de, sdBox2(q2 - vec2f(0.0, 0.18), vec2f(1.54 + ch, 0.45)) - 0.02);
  }
  // cornice & dentil teeth underneath
  de = min(de, sdBox2(q2 - vec2f(0.0, 1.36), vec2f(2.02, 0.22)) - 0.04);
  let dent = abs(fract(a * 160.0 / TAU) - 0.5);
  if (dent < 0.28) { de = min(de, sdBox2(q2 - vec2f(0.0, 1.08), vec2f(1.74, 0.10)) - 0.015); }
  de = max(de, -sdBox2(vec2f(abs(q2.x) - 1.5, q2.y + 0.25), vec2f(0.10, 0.10)));
  let jag = 0.6 * sin(p.y * 2.3 + a * 40.0) + 0.2 * sin(a * 95.0);
  de = max(de, -(ruinMask(a) * 8.0 + jag));
  d = min(d, de);
  // fallen blocks of the entablature
  var pb = p - vec3f(-21.5, 2.7, 5.0);
  var pr = rot(0.5) * pb.xz; pb = vec3f(pr.x, pb.y, pr.y);
  pr = rot(0.22) * pb.xy; pb = vec3f(pr.x, pr.y, pb.z);
  d = min(d, sdBox(pb, vec3f(2.6, 1.0, 1.4)) - 0.05);
  pb = p - vec3f(-15.0, 2.6, -8.5);
  pr = rot(-0.9) * pb.xz; pb = vec3f(pr.x, pb.y, pr.y);
  pr = rot(-0.3) * pb.yz; pb = vec3f(pb.x, pr.x, pr.y);
  d = min(d, sdBox(pb, vec3f(2.2, 1.0, 1.3)) - 0.05);
  var res = vec2f(d, 3.0);
  // carved stepped altar
  var da = sdCyl(p - vec3f(0.0, 2.5, 0.0), 4.25, 0.4) - 0.04;
  da = min(da, sdCyl(p - vec3f(0.0, 3.2, 0.0), 3.25, 0.4) - 0.04);
  da = min(da, length(vec2f(rr - 3.3, p.y - 3.55)) - 0.11);
  res = opU(res, vec2f(da, 3.0));
  // tapered obelisk with recessed inscription cartouche panels & sharp pyramidion apex
  let po = p - vec3f(0.0, 3.6, 0.0);
  let pq = rot(0.7854) * po.xz;
  let apq = abs(pq);
  let wy = mix(1.16, 0.72, clamp(po.y / 10.4, 0.0, 1.0)) - max(po.y - 10.4, 0.0) * 0.46;
  var dob = max(max(apq.x, apq.y) - wy, abs(po.y - 6.0) - 6.0);
  let panel = max(min(apq.x, apq.y) - (wy - 0.24), abs(po.y - 5.2) - 4.4);
  if (panel < 0.0 && po.y < 10.0) { dob = max(dob, max(apq.x, apq.y) - (wy - 0.055)); }
  res = opU(res, vec2f(dob * 0.78, 5.0));
  return res;
}

// processional avenue: moulded pedestals supporting fluted columns
fn sdAvenue(p: vec3f) -> f32 {
  let bd = max(max(abs(p.z - 86.0) - 34.0, abs(abs(p.x) - 11.0) - 2.6), p.y - 14.5);
  if (bd > 2.0) { return bd; }
  let iz = clamp(round((p.z - 56.0) / 8.5), 0.0, 7.0);
  let sx = sign(p.x);
  let h = hash21(vec2f(iz * 1.7 + 0.3, sx * 3.0 + 7.0));
  var cutY = 100.0;
  if (h < 0.42) { cutY = 1.6 + h * 19.0; }
  let pc = vec3f(abs(p.x) - 11.0, p.y, p.z - (56.0 + iz * 8.5));
  var d = sdBox(pc, vec3f(1.68, 0.96, 1.68)) - 0.04;
  d = min(d, sdBox(pc - vec3f(0.0, -0.82, 0.0), vec3f(1.92, 0.16, 1.92)) - 0.03);
  d = min(d, sdBox(pc - vec3f(0.0, 0.92, 0.0), vec3f(1.84, 0.11, 1.84)) - 0.025);
  // recessed dado panels on pedestal faces
  let apc = abs(pc);
  d = max(d, -sdBox(vec3f(apc.x - 1.68, pc.y - 0.05, pc.z), vec3f(0.06, 0.52, 1.15)));
  d = max(d, -sdBox(vec3f(pc.x, pc.y - 0.05, apc.z - 1.68), vec3f(1.15, 0.52, 0.06)));
  d = min(d, sdColumn(pc - vec3f(0.0, 1.02, 0.0), 0.95, 11.5, cutY));
  return d;
}

// the Tide Gate: a colossal double-ringed astrolabe portal of wedge-cut voussoirs, half sunk into the sand
fn gateLocal(p: vec3f) -> vec3f {
  var q = p - vec3f(0.0, 11.5, 40.0);
  let r = rot(0.06) * q.xy;
  return vec3f(r.x, r.y, q.z);
}
fn sdGate(p: vec3f) -> f32 {
  let q = gateLocal(p);
  let bd = length(q) - 19.8;
  if (bd > 2.0) { return bd; }
  let rxy = length(q.xy);
  let c = vec2f(rxy - 15.5, q.z);
  // stepped inner and outer moulded rings + keystone rim
  var d = sdBox2(c, vec2f(1.72, 1.36)) - 0.12;
  d = min(d, sdBox2(c - vec2f(1.35, 0.0), vec2f(0.55, 1.62)) - 0.08);
  d = min(d, sdBox2(c - vec2f(-1.42, 0.0), vec2f(0.38, 1.12)) - 0.06);
  // recessed rune channel on front & back faces + inner astrolabe teeth
  d = max(d, -sdBox2(vec2f(c.x, abs(c.y) - 1.40), vec2f(0.62, 0.14)));
  let a = atan2(q.y, q.x);
  let tooth = abs(fract(a * 56.0 / TAU) - 0.5);
  if (tooth < 0.22 && q.y > -8.0) { d = min(d, sdBox2(c - vec2f(-1.82, 0.0), vec2f(0.22, 0.42)) - 0.03); }
  // 28 radial voussoir stone joints
  let sg = abs(fract(a * 28.0 / TAU) - 0.5);
  d += (1.0 - smoothstep(0.0, 0.028, sg)) * 0.055;
  // massive buttress piers where the ring enters the seabed
  let pier = sdBox(vec3f(abs(p.x) - 14.8, p.y - 2.2, p.z - 40.0), vec3f(2.6, 2.8, 2.4)) - 0.08;
  d = min(d, pier);
  let jag = 0.52 * sin(q.x * 2.1) * sin(q.y * 1.7 + 2.0) * sin(q.z * 2.9) + 0.15 * sin(a * 37.0);
  d = max(d, -(length(q - vec3f(-11.4, 11.4, 0.3)) - 2.95 + jag));
  return d;
}

// toppled column, drums and blocks strewn along the avenue
fn sdDebris(p: vec3f) -> f32 {
  let bd = sdBox(p - vec3f(0.0, 1.0, 62.0), vec3f(19.0, 2.6, 23.0));
  if (bd > 2.0) { return bd; }
  var q = p - vec3f(7.5, 0.5, 74.0);
  var r2 = rot(1.25) * q.xz; q = vec3f(r2.x, q.y, r2.y);
  r2 = rot(-0.04) * q.xy; q = vec3f(r2.x, r2.y, q.z);
  var d = sdColumn(vec3f(q.y, q.x + 5.5, q.z), 0.95, 11.5, 9.2);
  q = p - vec3f(-5.5, 0.45, 66.0);
  r2 = rot(0.5) * q.xz; q = vec3f(r2.x, q.y, r2.y);
  var dr1 = sdCyl(vec3f(q.y, q.x, q.z), 0.92, 1.1) - 0.02;
  dr1 += 0.04 * pow(0.5 + 0.5 * cos(atan2(q.z, q.y) * 20.0), 0.7);
  d = min(d, dr1);
  q = p - vec3f(-3.2, 0.25, 69.5);
  r2 = rot(0.35) * q.xy; q = vec3f(r2.x, r2.y, q.z);
  d = min(d, sdCyl(q, 0.92, 0.55) - 0.02);
  q = p - vec3f(-13.5, 0.7, 45.5);
  r2 = rot(0.7) * q.xz; q = vec3f(r2.x, q.y, r2.y);
  r2 = rot(0.35) * q.yz; q = vec3f(q.x, r2.x, r2.y);
  d = min(d, sdBox(q, vec3f(2.3, 1.2, 1.5)) - 0.06);
  q = p - vec3f(13.0, 0.3, 50.0);
  r2 = rot(-0.4) * q.xz; q = vec3f(r2.x, q.y, r2.y);
  d = min(d, sdBox(q, vec3f(1.2, 0.7, 0.9)) - 0.05);
  return d;
}

// a stepped ziggurat with cornice ledges, corner buttresses, stepped stair treads & summit shrine
fn sdZiggurat(p0: vec3f) -> f32 {
  var p = p0 - vec3f(-88.0, -2.0, -58.0);
  let bd = length(p - vec3f(0.0, 18.0, 0.0)) - 54.0;
  if (bd > 2.0) { return bd; }
  let r2 = rot(0.45) * p.xz; p = vec3f(r2.x, p.y, r2.y);
  let sh = 5.5;
  let lv = clamp(floor(p.y / sh), 0.0, 6.0);
  let w = 34.0 - lv * 4.2;
  let ap = abs(p);
  var d = sdBox(p - vec3f(0.0, (lv + 0.5) * sh, 0.0), vec3f(w, sh * 0.5, w));
  d = min(d, sdBox(p - vec3f(0.0, (lv - 0.5) * sh, 0.0), vec3f(w + 4.2, sh * 0.5, w + 4.2)));
  // cornice lip on each terrace + recessed wall niches
  d = min(d, sdBox(p - vec3f(0.0, (lv + 0.94) * sh, 0.0), vec3f(w + 0.45, 0.28, w + 0.45)));
  let niche = abs(fract(min(ap.x, ap.z) / 4.2) - 0.5);
  if (niche < 0.24 && max(ap.x, ap.z) > w - 0.5 && fract(p.y / sh) > 0.15 && fract(p.y / sh) < 0.78) {
    d = max(d, max(ap.x, ap.z) - (w - 0.35));
  }
  // summit cella temple with cornice and doorway
  d = min(d, sdBox(p - vec3f(0.0, 41.5, 0.0), vec3f(5.2, 3.0, 5.2)));
  d = min(d, sdBox(p - vec3f(0.0, 44.7, 0.0), vec3f(5.7, 0.35, 5.7)));
  d = max(d, -sdBox(p - vec3f(0.0, 41.0, 5.0), vec3f(1.5, 2.2, 1.8)));
  // central monumental staircase with flanked balustrades and carved treads
  let ps = vec3f(ap.x, p.y, p.z);
  let slope = (p.y * 0.764 + p.z - 36.5) * 0.79 + 0.09 * sin(p.y * 9.5);
  let stair = max(sdBox(ps - vec3f(0.0, 19.0, 20.0), vec3f(3.0, 20.0, 18.0)), slope);
  let rail = max(sdBox(ps - vec3f(3.35, 19.4, 20.0), vec3f(0.45, 20.2, 18.0)), (p.y * 0.764 + p.z - 37.3) * 0.79);
  d = min(d, min(stair, rail));
  return (d - 0.16 * sin(p.x * 0.9) * sin(p.y * 1.3 + 1.0) * sin(p.z * 0.8) - 0.05) * 0.88;
}

// ---------- the Watcher: a 42 m bronze-and-stone colossus ----------
fn sdColossus(pw: vec3f) -> vec2f {
  let S = 3.8;
  let p = pw / S;
  let bd = sdCapsule(p, vec3f(0.0, 0.2, 0.3), vec3f(0.0, 9.6, 0.3), 3.7) * S;
  if (bd > 2.0) { return vec2f(bd, 4.0); }
  // moulded ashlar pedestal with base/cornice ledges and recessed relief panels
  var dped = sdBox(p - vec3f(0.0, -0.45, 0.0), vec3f(2.88, 0.45, 2.88)) - 0.025;
  dped = min(dped, sdBox(p - vec3f(0.0, -0.02, 0.0), vec3f(3.08, 0.08, 3.08)) - 0.015);
  dped = min(dped, sdBox(p - vec3f(0.0, -1.0, 0.0), vec3f(3.52, 0.32, 3.52)) - 0.02);
  dped = max(dped, -sdBox(vec3f(p.x, p.y + 0.45, abs(p.z) - 2.90), vec3f(2.25, 0.24, 0.09)));
  dped = max(dped, -sdBox(vec3f(abs(p.x) - 2.90, p.y + 0.45, p.z), vec3f(0.09, 0.24, 2.25)));
  // pleated chiton robe + heroic anatomical cuirass & draped mantle
  let a = atan2(p.z, p.x);
  let ty = clamp(p.y / 5.9, 0.0, 1.0);
  let foldv = (0.082 * sin(a * 15.0 + sin(p.y * 1.3) * 1.4) + 0.028 * sin(a * 31.0 - p.y * 2.1)) * (1.0 - ty * 0.70);
  let rr = mix(1.9, 1.02, ty * (0.45 + 0.55 * ty)) + foldv;
  let pe = vec2f(p.x, p.z * 1.22);
  var b = max(length(pe) - rr, abs(p.y - 2.95) - 2.95) * 0.80;
  // sculpted torso: pectorals, ribcage & draped cloak over the back and left shoulder
  b = smin(b, sdEll(p - vec3f(0.0, 6.35, 0.0), vec3f(1.30, 1.48, 0.82)), 0.45);
  b = smin(b, sdEll(vec3f(abs(p.x) - 0.44, p.y - 6.72, p.z - 0.52), vec3f(0.46, 0.36, 0.32)), 0.18);
  var cloak = sdEll(p - vec3f(0.15, 6.45, -0.48), vec3f(1.62, 2.05, 0.62));
  cloak += 0.04 * sin(p.x * 6.5 + p.y * 1.8);
  b = smin(b, cloak, 0.38);
  b = smin(b, sdCapsule(p, vec3f(-1.38, 7.25, 0.0), vec3f(1.38, 7.25, 0.0), 0.48), 0.32);
  b = smin(b, sdCapsule(p, vec3f(0.0, 7.4, 0.0), vec3f(0.0, 8.2, 0.05), 0.35), 0.20);
  // ornamented girdle belt & clasp
  b = min(b, length(vec2f(length(pe) - rr - 0.03, p.y - 5.05)) - 0.12);
  b = min(b, sdBox(p - vec3f(0.0, 5.05, 0.88), vec3f(0.24, 0.20, 0.12)) - 0.02);
  let hd = sdHead(p - vec3f(0.0, 8.72, 0.0));
  b = smin(b, hd, 0.10);
  // arms: the right one grips the trident (with bracer), the left forearm is broken off in antiquity
  b = smin(b, sdCapsule(p, vec3f(-1.6, 7.2, 0.0), vec3f(-2.05, 5.75, 0.45), 0.42), 0.24);
  b = smin(b, sdCapsule(p, vec3f(-2.05, 5.75, 0.45), vec3f(-2.0, 6.2, 1.7), 0.33), 0.18);
  b = min(b, max(abs(length(vec2f(p.x + 2.02, p.y - 6.02)) - 0.36) - 0.035, abs(p.z - 1.22) - 0.26));
  // articulated fist & curled fingers gripping the trident shaft
  var fist = sdBox(p - vec3f(-2.0, 6.24, 1.82), vec3f(0.24, 0.26, 0.25)) - 0.06;
  let knuckle = 0.028 * sin((p.y - 6.0) * 28.0) * step(abs(p.y - 6.24), 0.24);
  fist = min(fist + knuckle, sdCapsule(p, vec3f(-1.78, 6.38, 1.68), vec3f(-1.82, 6.46, 2.02), 0.085));
  b = smin(b, fist, 0.08);
  b = smin(b, sdCapsule(p, vec3f(1.6, 7.2, 0.0), vec3f(2.1, 5.8, 0.3), 0.42), 0.24);
  var fa = sdCapsule(p, vec3f(2.1, 5.8, 0.3), vec3f(2.3, 6.5, 1.9), 0.33);
  fa = max(fa, p.z - 1.0 + 0.14 * sin(p.x * 9.0) * sin(p.y * 7.0));
  b = smin(b, fa, 0.18);
  var res = opU(vec2f(dped * S, 3.0), vec2f(b * 0.80 * S, 4.0));
  // radiant solar-sea crown
  let ph = p - vec3f(0.0, 8.72, 0.0);
  var g = max(abs(length(ph.xz) - 0.58) - 0.05, abs(ph.y - 0.40) - 0.10);
  g = min(g, length(vec2f(length(ph.xz) - 0.60, ph.y - 0.32)) - 0.035);
  let sec = TAU / 9.0;
  let ia = round(atan2(ph.z, ph.x) / sec) * sec;
  let cs = cos(ia); let sn = sin(ia);
  let pk = vec3f(cs * ph.x + sn * ph.z, ph.y, -sn * ph.x + cs * ph.z);
  g = min(g, sdCapsule(pk, vec3f(0.58, 0.45, 0.0), vec3f(0.96, 1.32, 0.0), 0.052 - 0.034 * clamp((pk.y - 0.45) / 0.87, 0.0, 1.0)));
  // royal barbed trident with smooth tapered shaft & ornamental collars (free of periodic beading)
  let pt = p - vec3f(-2.0, 0.0, 1.85);
  let shR = mix(0.112, 0.088, clamp(pt.y / 9.9, 0.0, 1.0));
  g = min(g, sdCapsule(pt, vec3f(0.0, 0.0, 0.0), vec3f(0.0, 9.9, 0.0), shR));
  g = min(g, length(vec2f(length(pt.xz) - 0.145, pt.y - 5.88)) - 0.045);
  g = min(g, length(vec2f(length(pt.xz) - 0.16, pt.y - 9.65)) - 0.065);
  g = min(g, sdCapsule(pt, vec3f(-0.68, 9.9, 0.0), vec3f(0.68, 9.9, 0.0), 0.095 - 0.02 * abs(pt.x)));
  let sxp = vec3f(abs(pt.x) - 0.66, pt.y, pt.z);
  g = min(g, sdCapsule(sxp, vec3f(0.0, 9.9, 0.0), vec3f(0.05, 10.92, 0.0), 0.085 - 0.055 * clamp((pt.y - 9.9) / 1.02, 0.0, 1.0)));
  g = min(g, sdCapsule(sxp, vec3f(0.04, 10.65, 0.0), vec3f(-0.14, 10.42, 0.0), 0.038));      // outer barbs
  g = min(g, sdCapsule(pt, vec3f(0.0, 9.9, 0.0), vec3f(0.0, 11.22, 0.0), 0.095 - 0.062 * clamp((pt.y - 9.9) / 1.32, 0.0, 1.0)));
  g = min(g, sdCapsule(vec3f(abs(pt.x), pt.y, pt.z), vec3f(0.02, 10.92, 0.0), vec3f(0.16, 10.66, 0.0), 0.040));  // central barb
  res = opU(res, vec2f(g * 0.80 * S, 7.0));
  return res;
}

// ---------- the whole world; returns (distance, material) ----------
// everything that stands on the sea bed, except the natural rock that is blended into it
fn objects(p: vec3f, pf: vec3f, ha: f32) -> vec2f {
  var res = vec2f(sdCoral(p, ha), 9.0);
  res = opU(res, sdTholos(pf));
  res = opU(res, vec2f(sdAvenue(pf), 3.0));
  res = opU(res, vec2f(sdGate(pf), 6.0));
  res = opU(res, vec2f(min(min(sdDebris(pf), sdZiggurat(pf)), sdFallenHead(pf)), 3.0));
  res = opU(res, sdColossus(pf - vec3f(0.0, 4.9, -52.0)));
  res = opU(res, vec2f(sdCrystals(pf), 8.0));
  res = opU(res, vec2f(sdWreck(pf), 10.0));
  res = opU(res, vec2f(sdWhaleTail(pf), 11.0));
  return res;
}
fn rockA(p: vec3f) -> f32 {
  let w = (p - RMIN) / RSIZE;
  if (any(w < vec3f(0.006)) || any(w > vec3f(0.994))) { return 60.0; }
  return textureSampleLevel(rockTex, lin, w.xzy, 0.0).r;
}
@fragment fn fsBakeRock(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let pf = vec3f(RMIN.x + fc.x * 0.5, u.camPos.y - FLOOR, RMIN.z + fc.y * 0.5);
  return vec4f(clamp(min(sdArch(pf), sdCaveRock(pf)), -6.0, 40.0), 0.0, 0.0, 1.0);
}
// sea bed and natural rock from the bakes, the built things exactly
fn map(p: vec3f) -> vec2f {
  let tr = terrA(p);
  return opU(vec2f(smin(tr.x, rockA(p), 2.2), 1.0), objects(p, p - vec3f(0.0, FLOOR, 0.0), tr.y));
}
// the exact model, for normals (uses baked hTex so boulders and reef shelves are included everywhere)
fn mapN(p: vec3f) -> vec2f {
  let pf = p - vec3f(0.0, FLOOR, 0.0);
  let tr = terrA(p);
  return opU(vec2f(smin(tr.x, min(sdArch(pf), sdCaveRock(pf)), 2.2), 1.0), objects(p, pf, tr.y));
}

// the same field, read from the baked volume wherever the nearest surface is more than a voxel or two away:
// most march steps then cost one texture fetch, and the full model is only evaluated close to what it describes
fn coarse(p: vec3f) -> f32 {
  let w = (p - VMIN) / VSIZE;
  if (any(w < vec3f(0.004)) || any(w > vec3f(0.996))) { return 60.0; }
  return textureSampleLevel(sdfTex, lin, w.xzy, 0.0).r - 1.3;
}
fn mapA(p: vec3f) -> vec2f {
  let tr = terrA(p);
  let pf = p - vec3f(0.0, FLOOR, 0.0);
  var rk = rockA(p);
  // refine the last 0.9 m around the arch & cave massif analytically so craggy rock edges are never voxel-rounded
  if (rk < 0.95) { rk = min(sdArch(pf), sdCaveRock(pf)); }
  let d1 = smin(tr.x, rk, 2.2);
  let dO = coarse(p);
  if (dO > 0.9) { return vec2f(min(d1, dO), 1.0); }
  return opU(vec2f(d1, 1.0), objects(p, pf, tr.y));
}
@fragment fn fsBake(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let p = vec3f(VMIN.x + fc.x * VOX, u.camPos.y, VMIN.z + fc.y * VOX);
  return vec4f(clamp(objects(p, p - vec3f(0.0, FLOOR, 0.0), terrA(p).y).x, -8.0, 90.0), 0.0, 0.0, 1.0);
}

// on the open sea bed, away from rock and from anything built, the baked slope is the normal
fn calcNormal(p: vec3f, t: f32, m: f32) -> vec3f {
  if (m < 1.5 && p.y < -11.0 && rockA(p) > 3.3) {
    let s = textureSampleLevel(hTex, lin, p.xz / 480.0 + 0.5, 0.0);
    return normalize(vec3f(-s.g, 1.0, -s.b));
  }
  let e = vec2f(1.0, -1.0) * 0.5773 * clamp(0.00038 * t, 0.0012, 0.045);
  return normalize(e.xyy * mapN(p + e.xyy).x + e.yyx * mapN(p + e.yyx).x + e.yxy * mapN(p + e.yxy).x + e.xxx * mapN(p + e.xxx).x);
}
// penumbrae are estimated only from the sea bed, the rock and built surfaces that are actually near the ray:
// the conservative distances of the volume and of the bounding shapes would cast soft shadows of their own
fn softShadow(ro: vec3f, n: i32) -> f32 {
  var res = 1.0; var t = 0.14;
  let tmax = min(75.0, (-12.5 - ro.y) / SUN.y);      // nothing stands above this, and the bed bake ends there
  for (var i = 0; i < n; i++) {
    let p = ro + SUN * t;
    let tr = terrA(p);
    let d1 = smin(tr.x, rockA(p), 2.8);
    let dO = coarse(p);
    var h = min(d1, dO); var pen = d1;
    if (dO <= 0.9) {
      let o = objects(p, p - vec3f(0.0, FLOOR, 0.0), tr.y).x;
      h = min(d1, o);
      if (o < 1.8) { pen = min(pen, o); }
    }
    // contact-hardening penumbra: crisp near the caster base, gently diffused across long throws
    let kPen = mix(13.0, 6.5, clamp(t / 24.0, 0.0, 1.0));
    res = min(res, kPen * pen / max(t, 0.22));
    t += clamp(h, 0.14, 4.8);
    if (res < 0.008 || t > tmax) { break; }
  }
  res = clamp(res, 0.0, 1.0);
  return res * res * (3.0 - 2.0 * res);
}
// occlusion wants true distances: the height above the bed, the rock field undone from its step factor
fn calcAO(p: vec3f, n: vec3f) -> f32 {
  var occ = 0.0; var sca = 1.0;
  let steps = array<f32, 5>(0.035, 0.12, 0.30, 0.68, 1.35);
  for (var i = 0; i < 5; i++) {
    let h = steps[i];
    let q = p + n * h;
    let tr = terrA(q);
    var d = min(tr.y * 0.94, rockA(q) * 1.45);
    if (coarse(q) <= 2.8) { d = min(d, objects(q, q - vec3f(0.0, FLOOR, 0.0), tr.y).x); }
    occ += max(h - d, 0.0) / max(h, 0.08) * 0.22 * sca;
    sca *= 0.74;
  }
  return clamp(1.0 - 0.78 * occ, 0.08, 1.0);
}

// ---------- water optics ----------
fn sunAt(depth: f32) -> vec3f { return SUNE * exp(-KD * (depth / SUN.y)); }
fn ambAt(depth: f32) -> vec3f { return AMBE * exp(-KD * depth); }
fn hg(c: f32, g: f32) -> f32 { let g2 = g * g; return (1.0 - g2) / pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5); }
// two-term hydrosol phase function: strong forward Mie peak for Tyndall beams + broad Rayleigh-like water scatter
fn waterPhase(cosTheta: f32) -> f32 { return 0.58 * hg(cosTheta, 0.78) + 0.42 * (0.55 + 0.45 * cosTheta * cosTheta); }
// directional open-water equilibrium radiance: luminous turquoise overhead, rich cobalt horizontally, dark indigo into the abyss
fn waterVeil(rd: vec3f, depth: f32) -> vec3f {
  let pitch = mix(0.36, 1.52, smoothstep(-0.60, 0.68, rd.y));
  let ph = waterPhase(dot(rd, SUN));
  return SIG_S * (ambAt(depth) * pitch + sunAt(depth) * (0.46 * ph * mix(0.55, 1.25, smoothstep(-0.3, 0.5, rd.y)))) / EXT;
}
// The refraction pattern of the wavy surface is drawn once per frame into two tiling textures (sharp for surfaces, soft for
// the water volume). The same pattern lights the sea bed and the shafts above it, so the caustics sit at the feet of the beams.
fn swell(q: vec2f) -> f32 { return 0.48 + 2.55 * textureSampleLevel(cauLo, rep, mat2x2f(0.62, 0.78, -0.78, 0.62) * q / 86.0 + vec2f(0.31, 0.17), 0.0).r; }
fn shafts(q: vec2f) -> f32 {
  let lo = textureSampleLevel(cauLo, rep, q / 27.0, 0.0).r;
  let md = textureSampleLevel(cauLo, rep, mat2x2f(0.80, -0.60, 0.60, 0.80) * q / 15.0 + vec2f(0.19, 0.47), 0.0).r;
  return 0.18 + (2.8 * lo + 1.5 * md) * swell(q);
}
fn causticDepth(q: vec2f, depth: f32) -> vec3f {
  let a = q / 11.5;
  // chromatic dispersion widens slightly with depth while small-angle scattering softens crisp filaments
  let disp = (0.0022 + 0.0018 * clamp(depth / 55.0, 0.0, 1.0)) * vec2f(1.0, 0.58);
  let c1 = vec3f(textureSampleLevel(cauTex, rep, a + disp, 0.0).r, textureSampleLevel(cauTex, rep, a, 0.0).r, textureSampleLevel(cauTex, rep, a - disp, 0.0).r);
  let c2 = textureSampleLevel(cauTex, rep, mat2x2f(0.80, -0.60, 0.60, 0.80) * q / 18.5 + vec2f(0.53, 0.11), 0.0).r;
  let sharp = 0.64 * c1 + 0.36 * c2;
  let soft = vec3f(textureSampleLevel(cauLo, rep, a, 0.0).r);
  let c = mix(sharp, soft, smoothstep(32.0, 88.0, depth) * 0.68);
  return (0.34 + 2.85 * c + 2.65 * c * c) * mix(0.72, swell(q), 0.48);
}
fn caustic(q: vec2f) -> vec3f { return causticDepth(q, 42.0); }
fn shadowMap(q: vec2f, sl: f32) -> f32 {
  let uv = (q - u.smap.xy) * u.smap.w + 0.5;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) { return 1.0; }
  let th = textureSampleLevel(smapTex, lin, uv, 0.0).r;
  return smoothstep(-1.1, 0.25, th - sl);
}
// multi-directional wind chop + ocean swell + capillary ripples
fn waveH(q: vec2f, time: f32) -> f32 {
  let w1 = snoise(q * 0.055 + vec2f(time * 0.048, time * 0.032)) * 0.78;
  let w2 = snoise(q * 0.16 - vec2f(time * 0.072, -time * 0.054)) * 0.31;
  let ph1 = dot(q, vec2f(0.34, 0.19)) - time * 1.15 + 0.8 * w1;
  let ph2 = dot(q, vec2f(-0.21, 0.41)) - time * 1.42 + 0.7 * w2;
  let chop = 0.14 * pow(0.5 + 0.5 * sin(ph1), 1.6) + 0.09 * pow(0.5 + 0.5 * sin(ph2), 1.6);
  let cap = snoise(q * 0.62 + vec2f(-time * 0.14, time * 0.17)) * 0.055 + snoise(q * 1.45 - vec2f(time * 0.24, time * 0.19)) * 0.022;
  return w1 + w2 + chop + cap;
}
// the sea surface seen from below: Snell's window with chromatic rim, sun glitter, subsurface foam & liquid-mercury TIR
fn surfaceCol(ps: vec3f, rd: vec3f, time: f32) -> vec3f {
  let dist = length(ps - u.camPos.xyz);
  let e = mix(0.14, 0.55, clamp(dist / 120.0, 0.0, 1.0));
  let h0 = waveH(ps.xz, time);
  let hx = waveH(ps.xz + vec2f(e, 0.0), time);
  let hz = waveH(ps.xz + vec2f(0.0, e), time);
  var n = normalize(vec3f(-(hx - h0) / e * 0.62, 1.0, -(hz - h0) / e * 0.62));
  // fine capillary normal detail inside Snell's window
  let capG = textureSampleLevel(nTex, rep, vec3f(ps.x * 0.35 + time * 0.18, time * 0.09, ps.z * 0.35 - time * 0.15), 0.0).yzw;
  n = normalize(n + vec3f(capG.x, 0.0, capG.z) * (0.08 * (1.0 - smoothstep(25.0, 110.0, dist))));
  let ci = clamp(dot(rd, n), 0.0, 1.0);
  let sin2 = 1.0 - ci * ci;
  // dispersion across Snell's critical-angle rim (n_R = 1.331, n_G = 1.334, n_B = 1.339)
  let win = vec3f(smoothstep(0.0, 0.13, 1.0 - 1.7716 * sin2),
                  smoothstep(0.0, 0.13, 1.0 - 1.7796 * sin2),
                  smoothstep(0.0, 0.13, 1.0 - 1.7929 * sin2));
  // total internal reflection mirrors the underwater light field & distant sandy floor glow
  let refl = reflect(rd, -n);
  var tir = waterVeil(vec3f(refl.x, - abs(refl.y) * 0.65, refl.z), 8.0) * 1.15;
  tir += vec3f(0.10, 0.22, 0.26) * pow(1.0 - ci, 3.0) * (0.65 + 0.35 * h0);
  // refracted sky dome + crisp solar disc + dancing wave-facet sun glitter
  let r = normalize(refract(rd, -n, 1.333) + vec3f(0.0, 1e-4, 0.0));
  let fr = 0.02 + 0.98 * pow(1.0 - ci, 5.0);
  let sd = max(dot(r, SUNAIR), 0.0);
  var sky = mix(vec3f(0.78, 0.91, 1.0), vec3f(0.22, 0.52, 0.96), pow(clamp(r.y, 0.0, 1.0), 0.65)) * 2.75;
  sky += vec3f(1.0, 0.95, 0.84) * (pow(sd, 1100.0) * 190.0 + pow(sd, 70.0) * 7.5 + pow(sd, 7.0) * 1.35);
  // aerated whitecap micro-bubble foam patches backlit by the sun on steep wave crests
  let foamNoise = fbm3(vec3f(ps.x * 0.55 + time * 0.08, 2.0, ps.z * 0.55 - time * 0.06));
  let foam = smoothstep(0.56, 0.88, h0 + 0.45 * foamNoise) * smoothstep(0.42, 0.75, foamNoise);
  var surf = mix(tir, mix(sky, tir, fr), win);
  surf = mix(surf, vec3f(1.45, 1.55, 1.60), foam * 0.55);
  return surf;
}

// ---------- materials ----------
fn bumpN(p: vec3f, n: vec3f, sc: f32, st: f32) -> vec3f {
  let g = textureSampleLevel(nTex, rep, p * (sc * 0.0625), 0.0).yzw;
  return normalize(n - st * (g - n * dot(g, n)));
}
fn glyph(q: vec2f) -> f32 {
  let id = floor(q); let f = fract(q) - 0.5; let h = hash21(id + 17.0);
  if (h < 0.14) { return 0.0; }
  let ax = abs(f);
  var d = 9.0;
  if (h > 0.28) { d = min(d, max(ax.x - 0.032, ax.y - 0.33)); }
  if (fract(h * 7.3) > 0.42) { d = min(d, max(ax.y - 0.032, ax.x - 0.30)); }
  if (fract(h * 13.7) > 0.48) { d = min(d, abs(length(f) - 0.24) - 0.030); }
  if (fract(h * 23.1) > 0.62) { d = min(d, abs(length(f - vec2f(0.0, 0.14)) - 0.11) - 0.026); }
  if (fract(h * 31.9) > 0.58) { d = min(d, max(abs(ax.x + ax.y - 0.26) - 0.030, max(ax.x, ax.y) - 0.30)); }
  if (fract(h * 43.3) > 0.72) { d = min(d, length(f) - 0.065); }
  return 1.0 - smoothstep(0.0, 0.025, d);
}
// 3D ashlar stone block joints & per-stone tone variation; returns (joint mask 0..1, block hash 0..1)
fn masonry(p: vec3f, sc: vec3f) -> vec2f {
  let row = floor(p.y * sc.y);
  let shift = 0.5 * (row - floor(row * 0.5) * 2.0);
  let u = vec3f(p.x * sc.x + shift, p.y * sc.y, p.z * sc.z + shift);
  let id = floor(u);
  let f = abs(fract(u) - 0.5);
  let j = smoothstep(0.44, 0.495, max(f.y, min(f.x, f.z) * 0.96));
  return vec2f(j, hash31(id + 13.7));
}
// domain-warped, intermittent geological fracture seams (avoids uniform cellular Voronoi look)
fn crackle(p0: vec3f) -> f32 {
  let mask = smoothstep(0.36, 0.68, fbm3(p0 * 0.55 + vec3f(11.3)));
  if (mask < 0.01) { return 0.0; }
  let warp = textureSampleLevel(nTex, rep, p0 * 0.085, 0.0).yzw;
  let p = p0 * vec3f(1.0, 1.85, 1.0) + warp * 0.65;
  let ip = floor(p); let fp = fract(p);
  var f1 = 9.0; var f2 = 9.0;
  for (var k = -1; k <= 1; k++) { for (var j = -1; j <= 1; j++) { for (var i = -1; i <= 1; i++) {
    let g = vec3f(f32(i), f32(j), f32(k));
    let c = ip + g;
    let d = length(g + vec3f(hash31(c), hash31(c + 17.3), hash31(c + 41.7)) - fp);
    if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) { f2 = d; }
  } } }
  return (1.0 - smoothstep(0.0, 0.045, f2 - f1)) * mask;
}
fn weather(alb0: vec3f, n: vec3f, nz: f32, nz2: f32, hgt: f32, streak: f32) -> vec3f {
  var a = mix(alb0 * 0.58, alb0, smoothstep(0.28, 0.62, nz));
  a = mix(a, a * vec3f(0.62, 0.80, 0.72), streak);
  let algae = smoothstep(0.46, 0.70, nz2) * (1.0 - smoothstep(1.0, 16.0, hgt)) * 0.6;
  a = mix(a, vec3f(0.22, 0.34, 0.20), algae);
  let dep = smoothstep(0.72, 0.95, n.y) * smoothstep(0.30, 0.55, nz);
  return mix(a, vec3f(0.74, 0.68, 0.54), dep * 0.65);
}

// asymmetric current ripples with Y-bifurcations; returns (crest height 0..1, grad x, grad z)
fn sandRipples(q: vec2f) -> vec3f {
  let warp = vec2f(snoise(q * 0.055 + 1.3), snoise(q * 0.055 + 11.7)) * 1.35;
  let w = q + warp;
  // two slightly inclined wave trains interfere to form natural Y-junction dislocations
  let p1 = w.x * 5.2 + w.y * 1.15 + 1.2 * sin(w.y * 0.65);
  let p2 = w.x * 4.55 - w.y * 1.45 + 1.1 * sin(w.y * 0.52 + 2.1);
  let b = 0.5 + 0.5 * snoise(q * 0.085 - 3.4);
  let s1 = sin(p1 + 0.36 * sin(p1));
  let s2 = sin(p2 + 0.36 * sin(p2));
  let c1 = cos(p1 + 0.36 * sin(p1)) * (1.0 + 0.36 * cos(p1));
  let c2 = cos(p2 + 0.36 * sin(p2)) * (1.0 + 0.36 * cos(p2));
  let s = mix(s1, s2, b);
  let h = pow(clamp(0.5 + 0.5 * s, 0.0, 1.0), 1.65);
  let dh = 0.825 * pow(clamp(0.5 + 0.5 * s, 1e-3, 1.0), 0.65);
  let gx = dh * mix(c1 * 5.2, c2 * 4.55, b);
  let gz = dh * mix(c1 * 1.15, -c2 * 1.45, b);
  // secondary fine cross-ripples in the troughs
  let f = sin(w.x * 1.7 - w.y * 13.5 + 2.0 * snoise(q * 0.4)) * (1.0 - h) * 0.14;
  return vec3f(clamp(h + f * 0.5, 0.0, 1.0), gx, gz + cos(w.x * 1.7 - w.y * 13.5) * (1.0 - h) * 0.9);
}
// Voronoi rubble pebbles & shell fragments; returns (pebble dome 0..1, grad x, grad z, random id)
fn pebbleCell(q: vec2f) -> vec4f {
  let ip = floor(q); let fp = fract(q);
  var best = 9.0; var v = vec2f(0.0); var hid = 0.0;
  for (var j = -1; j <= 1; j++) { for (var i = -1; i <= 1; i++) {
    let g = vec2f(f32(i), f32(j));
    let c = ip + g;
    let h = hash21(c + 19.7);
    let o = g + 0.18 + 0.64 * vec2f(h, fract(h * 43.7)) - fp;
    let d2 = dot(o, o);
    if (d2 < best) { best = d2; v = o; hid = h; }
  } }
  let r = sqrt(best);
  let rad = 0.24 + 0.22 * fract(hid * 17.3);
  let dome = clamp(1.0 - (r * r) / (rad * rad), 0.0, 1.0);
  return vec4f(dome, v.x * 2.2 * dome, v.y * 2.2 * dome, hid);
}

fn shade(pos: vec3f, n0: vec3f, rd: vec3f, m: f32, t: f32, time: f32) -> vec3f {
  var n = n0;
  var alb = vec3f(0.5);
  var emi = vec3f(0.0);
  var spec = 0.03; var gloss = 14.0; var cav = 1.0; var sss = vec3f(0.0);
  let pf = pos - vec3f(0.0, FLOOR, 0.0);
  let nz = fbm3(pos * 0.33);
  let nz2 = fbm3(pos * 1.6 + vec3f(5.0));
  let streak = smoothstep(0.5, 0.75, fbm3(vec3f(pos.x * 0.9, pos.y * 0.07, pos.z * 0.9)));
  let detail = 1.0 - smoothstep(55.0, 145.0, t);
  let nearD = 1.0 - smoothstep(14.0, 42.0, t);
  if (m < 1.5) {
    let aux = textureSampleLevel(auxTex, lin, pos.xz / 480.0 + 0.5, 0.0);
    let slopeRock = 1.0 - smoothstep(0.56, 0.86, n0.y);
    let rock = clamp(max(slopeRock, aux.g), 0.0, 1.0);
    let scree = clamp(max(aux.b, slopeRock * (1.0 - slopeRock) * 2.2) * (1.0 - rock * 0.85), 0.0, 1.0);

    // 1) rippled carbonate sand with coarse organic detritus in troughs & sparkling grains on crests
    let rp = sandRipples(pos.xz);
    let ripFade = (1.0 - rock) * (1.0 - scree * 0.65) * (0.42 + 0.58 * smoothstep(-0.25, 0.45, snoise(pos.xz * 0.024 + 4.0)));
    var ns = normalize(n0 + vec3f(-rp.y, 0.0, -rp.z) * (0.175 * detail * ripFade));
    ns = bumpN(pos * vec3f(1.0, 0.3, 1.0), ns, 9.5, 0.06 * nearD);
    let grain = hash21(floor(pos.xz * 55.0));
    var sand = mix(vec3f(0.53, 0.47, 0.37), vec3f(0.76, 0.69, 0.55), rp.x);
    sand *= (0.84 + 0.26 * nz2) * (0.93 + 0.14 * grain * nearD);
    var sandCav = mix(0.80, 1.04, rp.x);

    // 2) coral-rubble & white shell-hash apron around outcrops and talus slopes
    if (scree > 0.02 && detail > 0.01) {
      let pb1 = pebbleCell(pos.xz * 3.4);
      let pb2 = pebbleCell(pos.xz * 9.2 + 5.7);
      let pbH = max(pb1.x, pb2.x * 0.65);
      ns = normalize(ns + vec3f(pb1.y + pb2.y * 0.5, 0.0, pb1.z + pb2.z * 0.5) * (0.32 * scree * detail));
      let isShell = step(0.80, fract(pb1.w * 61.3));
      let rubCol = mix(mix(vec3f(0.42, 0.39, 0.34), vec3f(0.58, 0.53, 0.44), pb1.w), vec3f(0.86, 0.82, 0.74), isShell * pb1.x);
      let mRub = scree * smoothstep(0.08, 0.48, pbH + 0.25 * scree);
      sand = mix(sand, rubCol, mRub);
      sandCav = mix(sandCav, 0.58 + 0.46 * pbH, scree * 0.85);
    }

    // 3) half-buried ancient flagstones along the processional avenue and sanctuary plaza
    let inAve = (1.0 - smoothstep(6.8, 9.6, abs(pos.x))) * smoothstep(25.0, 31.0, pos.z) * (1.0 - smoothstep(106.0, 116.0, pos.z));
    let rPlz = length(pos.xz);
    let inPlz = smoothstep(26.2, 27.6, rPlz) * (1.0 - smoothstep(32.5, 35.5, rPlz));
    let paveZone = max(inAve, inPlz) * (1.0 - rock);
    if (paveZone > 0.01) {
      let row = floor(pos.z / 2.2);
      let stuv = vec2f(pos.x / 2.8 + 0.5 * (row - floor(row * 0.5) * 2.0), pos.z / 2.2);
      let sid = floor(stuv);
      let sf = abs(fract(stuv) - 0.5);
      let sh = hash21(sid + 71.0);
      let joint = smoothstep(0.42, 0.49, max(sf.x * 1.12, sf.y));
      let slabTop = 0.22 + 0.24 * (sh - 0.5) - 0.16 * joint;
      let exposePave = paveZone * smoothstep(-0.04, 0.22, slabTop - pf.y + 0.48 * (snoise(pos.xz * 0.11 + 3.0) - 0.38)) * step(0.28, sh);
      if (exposePave > 0.01) {
        let jg = vec2f(sign(fract(stuv.x) - 0.5) * smoothstep(0.40, 0.49, sf.x * 1.12), sign(fract(stuv.y) - 0.5) * smoothstep(0.40, 0.49, sf.y));
        let np = bumpN(pos, normalize(n0 + vec3f(jg.x, 0.0, jg.y) * (0.45 * detail)), 2.4, 0.18 * detail);
        ns = normalize(mix(ns, np, exposePave));
        var pcol = weather(vec3f(0.68, 0.65, 0.58) * (0.88 + 0.22 * sh), n0, nz, nz2, 1.5, streak);
        pcol *= (1.0 - 0.45 * joint) * (1.0 - 0.35 * crackle(pos * 0.55) * detail);
        sand = mix(sand, pcol, exposePave);
        sandCav = mix(sandCav, 1.0 - 0.48 * joint, exposePave);
      }
    }

    // 4) stratified reef & canyon rock with fracture crevices, coralline crust, sponges & sediment dusting
    let strata = sin(pos.y * 2.3 + pos.x * 0.22 + 3.2 * nz);
    var nr = bumpN(vec3f(pos.x * 0.85, pos.y * 1.9, pos.z * 0.85), n0, 0.95, 0.52 * detail);
    nr = bumpN(pos, nr, 3.6, 0.24 * nearD);
    let crk = crackle(pos * 0.48) * detail;
    n = normalize(mix(ns, nr, rock));
    var rk = mix(vec3f(0.21, 0.22, 0.23), vec3f(0.48, 0.45, 0.39), clamp(nz + 0.18 * strata, 0.0, 1.0));
    rk *= 1.0 - 0.52 * crk;
    // mossy turf algae in sheltered crevices, pink-violet coralline algae on sunlit crests, warm encrusting sponges
    rk = mix(rk, vec3f(0.15, 0.28, 0.17), smoothstep(0.40, 0.70, nz2) * 0.62);
    let coralline = smoothstep(0.54, 0.78, fbm3(pos * 0.75 + vec3f(40.0))) * smoothstep(0.1, 0.7, n0.y);
    rk = mix(rk, vec3f(0.56, 0.26, 0.36), coralline * 0.65);
    let sponge = smoothstep(0.72, 0.84, fbm3(pos * 1.35 + vec3f(19.0))) * (1.0 - smoothstep(0.65, 0.9, n0.y));
    rk = mix(rk, vec3f(0.78, 0.36, 0.12), sponge * 0.55);
    // thin pelagic carbonate silt settled on flat ledges
    let dust = smoothstep(0.74, 0.96, n.y) * (0.45 + 0.55 * nz);
    rk = mix(rk, vec3f(0.68, 0.63, 0.51), dust * 0.58);
    let rkCav = (1.0 - 0.55 * crk) * (0.85 + 0.15 * strata);

    alb = mix(sand, rk, rock);
    cav = mix(sandCav, rkCav, rock);
    spec = mix(0.05 + 0.06 * grain * nearD, 0.09, rock);
    gloss = mix(22.0, 18.0, rock);
    let dc = length(pos - CAVE_C);
    if (dc < 14.0 && rock > 0.35) {
      let v = 1.0 - abs(fbm3(pos * 0.55 + vec3f(3.0)) * 2.0 - 1.0);
      emi = PURPLE * pow(v, 52.0) * 0.52 * smoothstep(0.48, 0.68, nz) * (1.0 - smoothstep(7.5, 13.5, dc));
    }
  } else if (m < 3.5) {
    // carved travertine / marble masonry: ashlar joints, marine pitting, coralline & silt encrustation
    n = bumpN(pos, n0, 2.2, 0.18 * detail);
    n = bumpN(pos, n, 8.5, 0.11 * nearD);
    let ms = masonry(pos, vec3f(0.42, 0.78, 0.42));
    let crk = crackle(pos * 0.45) * detail;
    alb = weather(vec3f(0.80, 0.76, 0.68) * (0.90 + 0.18 * ms.y), n0, nz, nz2, pf.y, streak);
    alb = mix(alb, vec3f(0.56, 0.29, 0.35), smoothstep(0.66, 0.84, fbm3(pos * 0.9 + vec3f(22.0))) * (1.0 - smoothstep(2.0, 14.0, pf.y)) * 0.42);
    alb *= (1.0 - 0.38 * crk) * (1.0 - 0.34 * ms.x * detail);
    cav = (1.0 - 0.42 * crk) * (1.0 - 0.38 * ms.x * detail);
    spec = 0.08; gloss = 24.0;
  } else if (m < 4.5) {
    // ancient cast bronze colossus with verdigris patina, bare burnished ridges & calcareous barnacles
    n = bumpN(pos, n0, 1.1, 0.22 * detail);
    n = bumpN(pos, n, 5.5, 0.12 * nearD);
    let pat = clamp(streak * 0.55 + smoothstep(0.38, 0.68, nz) * 0.55, 0.0, 1.0);
    alb = mix(vec3f(0.24, 0.15, 0.075), vec3f(0.10, 0.33, 0.28), pat);
    let barn = smoothstep(0.64, 0.80, fbm3(pos * 2.8 + vec3f(9.0))) * (1.0 - smoothstep(2.0, 24.0, pf.y));
    alb = mix(alb, vec3f(0.62, 0.60, 0.54), barn * 0.55);
    alb = mix(alb, vec3f(0.72, 0.66, 0.52), smoothstep(0.76, 0.96, n0.y) * 0.48);
    cav = 1.0 - 0.28 * pat;
    spec = mix(0.34, 0.12, pat); gloss = mix(38.0, 16.0, pat);
  } else if (m < 5.5) {
    // polished black obsidian-basalt obelisk with glowing Atlantean glyphs
    let po = pf - vec3f(0.0, 3.6, 0.0);
    let pq = rot(0.7854) * po.xz;
    let nq = rot(0.7854) * n0.xz;
    let face = select(pq.x, pq.y, abs(nq.x) > abs(nq.y));
    n = bumpN(pos, n0, 3.0, 0.08 * detail);
    let g = glyph(vec2f(face * 2.1 + 0.5, po.y * 1.25)) * step(abs(face), 0.58) * step(po.y, 10.0) * step(0.4, po.y);
    let pulse = 0.78 + 0.22 * sin(time * 0.65 - po.y * 0.55);
    alb = vec3f(0.055, 0.075, 0.095) * (0.85 + 0.3 * nz2);
    emi = RUNE * (g * 6.5 * pulse + 0.16 * (1.0 - smoothstep(0.0, 0.35, abs(abs(face) - 0.58))) * step(po.y, 10.0));
    spec = 0.36; gloss = 64.0;
  } else if (m < 6.5) {
    let q = gateLocal(pf);
    let cx = length(q.xy) - 15.5;
    n = bumpN(pos, n0, 1.4, 0.22 * detail);
    n = bumpN(pos, n, 6.0, 0.10 * nearD);
    let crk = crackle(pos * 0.38) * detail;
    alb = weather(vec3f(0.42, 0.44, 0.47), n0, nz, nz2, pf.y - 4.0, streak) * (1.0 - 0.36 * crk);
    cav = 1.0 - 0.40 * crk;
    spec = 0.10; gloss = 26.0;
    if (abs(cx) < 0.60 && abs(q.z) > 1.24) {
      let a = atan2(q.y, q.x);
      let g = glyph(vec2f(a * 16.0, cx * 1.2 + 0.5));
      let pulse = 0.72 + 0.28 * sin(time * 0.5 + a * 3.0);
      emi = RUNE * (g * 5.2 * pulse + 0.10);
      alb = vec3f(0.08, 0.12, 0.16);
      spec = 0.28;
    }
  } else if (m < 7.5) {
    // gilded orichalcum crown & trident
    n = bumpN(pos, n0, 2.0, 0.12 * detail);
    let verdigris = smoothstep(0.48, 0.74, nz2) * 0.62;
    alb = mix(vec3f(0.92, 0.64, 0.22), vec3f(0.18, 0.44, 0.36), verdigris);
    spec = mix(0.68, 0.18, verdigris); gloss = mix(56.0, 18.0, verdigris);
  } else if (m < 8.5) {
    // translucent amethyst quartz crystals with internal cleavage planes & rim dispersion
    n = bumpN(pos * vec3f(1.0, 3.0, 1.0), n0, 2.5, 0.07 * detail);
    let fr = pow(1.0 - max(dot(n, -rd), 0.0), 2.4);
    let internal = fbm3(pos * 2.2 + rd * 0.6);
    alb = vec3f(0.12, 0.05, 0.20);
    emi = mix(PURPLE, vec3f(0.38, 0.55, 1.0), fr * 0.45) * (0.32 + 2.4 * fr + 1.1 * smoothstep(0.32, 0.76, internal)) * (0.82 + 0.18 * sin(time * 0.8 + pos.y));
    sss = PURPLE * 0.45;
    spec = 0.75; gloss = 88.0;
  } else if (m < 9.5) {
    // living reef corals & sponges: velvety calcareous corallites, pale growth tips & warm subsurface glow
    let h = hash21(floor(pos.xz / 4.2) + 3.0);
    let k = fract(h * 91.0);
    n = bumpN(pos, n0, 9.5, 0.44 * detail);
    n = bumpN(pos, n, 24.0, 0.22 * nearD);
    let polyp = fbm3(pos * 14.0);
    alb = vec3f(0.86, 0.30, 0.38);
    if (k > 0.80) { alb = vec3f(0.82, 0.68, 0.18); } else if (k > 0.60) { alb = vec3f(0.52, 0.30, 0.78); }
    else if (k > 0.40) { alb = vec3f(0.90, 0.42, 0.14); } else if (k > 0.20) { alb = vec3f(0.18, 0.72, 0.62); }
    let tip = smoothstep(0.42, 0.92, n0.y);
    alb = mix(alb * 0.62, mix(alb, vec3f(0.96, 0.92, 0.84), 0.34), tip) * (0.68 + 0.45 * nz2) * (0.82 + 0.32 * polyp);
    cav = 0.70 + 0.30 * polyp;
    sss = alb * 0.55;
    spec = 0.04; gloss = 10.0;
  } else if (m < 10.5) {
    // waterlogged oak hull timbers, caulked seams, rust streaks & marine fouling
    let q = wreckLocal(pf);
    n = bumpN(vec3f(q.x * 0.5, q.y * 3.5, q.z * 3.5), n0, 2.8, 0.32 * detail);
    let seam = smoothstep(0.42, 0.495, abs(fract(q.y * 2.4 + 0.012 * q.x * q.x) - 0.5));
    let grain = fbm3(vec3f(q.x * 0.45, q.y * 7.5, q.z * 7.5));
    alb = mix(vec3f(0.32, 0.21, 0.12), vec3f(0.13, 0.09, 0.055), nz) * (0.72 + 0.55 * grain) * (1.0 - 0.55 * seam);
    alb = mix(alb, vec3f(0.16, 0.32, 0.19), smoothstep(0.40, 0.68, nz2) * (1.0 - smoothstep(0.0, 9.0, q.y)) * 0.65);
    alb = mix(alb, vec3f(0.70, 0.65, 0.52), smoothstep(0.76, 0.96, n0.y) * 0.48);
    cav = 1.0 - 0.48 * seam;
    spec = 0.07; gloss = 16.0;
  } else {
    // dressed columnar basalt of the colossal whale fluke
    n = bumpN(pos, n0, 1.3, 0.26 * detail);
    n = bumpN(pos, n, 6.5, 0.12 * nearD);
    let crk = crackle(pos * 0.34) * detail;
    alb = weather(vec3f(0.32, 0.35, 0.39), n0, nz, nz2, pf.y - 8.0, streak) * (1.0 - 0.42 * crk);
    cav = 1.0 - 0.45 * crk;
    spec = 0.14; gloss = 30.0;
  }
  let depth = max(-pos.y, 0.0);
  let sl = depth / SUN.y;
  let qs = pos.xz + SUN.xz * sl;
  let sunL = sunAt(depth);
  let cSky = caveSky(pos);
  let amb = ambAt(depth) * cSky;
  let ndl = max(dot(n, SUN), 0.0);
  var sh = 0.0;
  if (ndl > 0.0) {
    sh = softShadow(pos + n0 * 0.06, i32(u.quality.z)) * mix(0.25, 1.0, shadowMap(qs, sl));
  }
  // the kelp canopy is not in the distance field: dapple the ground under it
  let dk = length(pos.xz - vec2f(112.0, 28.0));
  sh *= 1.0 - 0.52 * (1.0 - smoothstep(30.0, 50.0, dk)) * smoothstep(-0.3, 0.5, snoise(pos.xz * 0.13 + vec2f(time * 0.05, 0.0)));
  // 3D directional caustic projection: crispest on upward sun-facing surfaces, naturally attenuated on steep flanks
  let cauProj = smoothstep(0.04, 0.58, max(dot(n0, SUN), 0.0)) * 0.94;
  let ca = mix(vec3f(1.0), causticDepth(qs, depth), cauProj);
  let ao = calcAO(pos, n0) * cav;
  var lit = sunL * ndl * sh * ca * 0.68;
  // hemispherical sky-water downwelling + omnidirectional water scatter fill + rim scatter on silhouettes
  let rimS = pow(1.0 - max(dot(n, -rd), 0.0), 2.5) * 0.28;
  lit += amb * (0.48 + 0.52 * clamp(n.y * 0.5 + 0.5, 0.0, 1.0) + rimS) * ao * 0.58;
  lit += vec3f(0.82, 0.73, 0.56) * sunL * clamp(0.5 - 0.5 * n.y, 0.0, 1.0) * ao * 0.10 * cSky;
  lit += sss * sunL * (0.28 + 0.72 * sh) * pow(clamp(dot(rd, SUN) * 0.5 + 0.5, 0.0, 1.0), 1.6);
  // the obelisk and amethyst cavern as local volumetric-matched point lights
  let pl = (OB_A + OB_B) * 0.5 - pos;
  let dl = length(pl);
  lit += RUNE * max(dot(n, pl / dl), 0.0) * ao * 64.0 / (28.0 + dl * dl);
  let pcv = CAVE_C - pos;
  let dcv = length(pcv);
  if (dcv < 30.0) {
    let vis = smoothstep(-0.4, 1.2, mapA(pos + pcv * 0.5).x);
    lit += mix(PURPLE, vec3f(0.28, 0.52, 0.95), 0.25) * (0.18 + 0.82 * max(dot(n, pcv / dcv), 0.0)) * ao * vis * (1.0 - smoothstep(18.0, 30.0, dcv)) * 68.0 / (26.0 + dcv * dcv);
  }
  var col = alb * lit + emi;
  let hv = normalize(SUN - rd);
  col += sunL * sh * ca * spec * pow(max(dot(n, hv), 0.0), gloss) * 0.44;
  col += amb * spec * pow(1.0 - max(dot(n, -rd), 0.0), 3.5) * ao * 0.55;
  return col;
}

fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }

struct FOut { @location(0) col: vec4f, @builtin(frag_depth) depth: f32 };
@fragment fn fs(@builtin(position) fc: vec4f) -> FOut {
  let px = fc.xy + u.jitter.xy;
  let ndc = vec2f(px.x * u.res.z * 2.0 - 1.0, 1.0 - px.y * u.res.w * 2.0);
  let ro = u.camPos.xyz;
  let rd = normalize(u.camFwd.xyz + u.camRight.xyz * (ndc.x * u.camRight.w) + u.camUp.xyz * (ndc.y * u.camUp.w));
  let time = u.camPos.w;

  var tSurf = 1e5;
  if (rd.y > 0.0005) { tSurf = -ro.y / rd.y; }
  let tLim = min(TMAX, tSurf);
  var t = 0.05; var m = 0.0; var hit = false;
  let steps = i32(u.quality.x);
  for (var i = 0; i < steps; i++) {
    let h = mapA(ro + rd * t);
    if (h.x < 0.0007 * t + 0.0015) { hit = true; m = h.y; break; }
    t += h.x * 0.88;
    if (t > tLim) { break; }
  }
  if (!hit && t < tLim) { hit = true; m = map(ro + rd * t).y; }      // out of steps along a silhouette: shade where the ray stopped
  var col = vec3f(0.0);
  var tEnd = tLim;
  if (hit && t < tLim) {
    let pos = ro + rd * t;
    col = shade(pos, calcNormal(pos, t, m), rd, m, t, time);
    tEnd = t;
  } else if (tSurf < TMAX) {
    col = surfaceCol(ro + rd * tSurf, rd, time);
  } else {
    let dEnd = max(-(ro.y + rd.y * TMAX * 0.65), 2.0);
    col = waterVeil(rd, dEnd);
  }
  col *= exp(-EXT * tEnd);

  // single + multiple scattering along the view ray: crisp Tyndall sunbeams, monument shadow shafts & depth turbidity
  let nv = i32(u.quality.y);
  let k = 0.015;
  let c = 1.0 - exp(-k * tEnd);
  let jit = fract(ign(fc.xy) + u.camFwd.w * 0.61803399);
  let ph = waterPhase(dot(rd, SUN));
  let pitchAmb = mix(0.45, 1.35, smoothstep(-0.60, 0.68, rd.y));
  var scat = vec3f(0.0);
  for (var i = 0; i < nv; i++) {
    let x = (f32(i) + jit) / f32(nv);
    let s = -log(1.0 - x * c) / k;
    let ds = c / (f32(nv) * k * (1.0 - x * c));
    let ps = ro + rd * s;
    let dp = max(-ps.y, 0.0);
    let sl = dp / SUN.y;
    let qs = ps.xz + SUN.xz * sl;
    // hydrosol density rises slightly in the sunlit surface layer and near benthic nepheloid layer
    let turb = 1.0 + 0.30 * exp(-dp * 0.08) + 0.16 * exp(-max(ps.y - FLOOR, 0.0) * 0.25);
    var li = sunAt(dp) * (shadowMap(qs, sl) * shafts(qs) * ph) + ambAt(dp) * pitchAmb * caveSky(ps);
    li *= SIG_S * turb;
    let pa = ps - OB_A; let ba = OB_B - OB_A;
    let dq = pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    li += RUNE * (0.05 / (1.5 + dot(dq, dq)));
    let dv = ps - CAVE_C;
    let d2 = dot(dv, dv);
    li += PURPLE * (0.010 / (1.0 + 0.03 * d2)) * (1.0 - smoothstep(110.0, 300.0, d2));
    scat += exp(-EXT * s) * li * ds;
  }
  col += scat;
  var o: FOut;
  o.col = vec4f(col, tEnd);
  o.depth = ZA * (1.0 - ZNEAR / max(tEnd * dot(rd, u.camFwd.xyz), 0.11));
  return o;
}

// sun-space depth of the first occluder under each point of the sea surface
@fragment fn fsShadow(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let uv = fc.xy / u.misc.x;
  let q = u.smap.xy + (uv - 0.5) * u.smap.z;
  let ro = vec3f(q.x, 0.0, q.y);
  var t = 3.0;
  for (var i = 0; i < 200; i++) {
    let h = mapA(ro - SUN * t).x;
    if (h < 0.03) { break; }
    t += h * 0.9;
    if (t > 150.0) { break; }
  }
  return vec4f(t, 0.0, 0.0, 1.0);
}
`;

/* =====================================================================================
   WGSL — rasterised life: fish, mantas, the leviathan, kelp, drifting particles
   (appended to the scene module, so it shares the water optics and the shadow map)
   ===================================================================================== */
const WGSL_LIFE = /* wgsl */`
fn toClip(wp: vec3f) -> vec4f {
  let v = wp - u.camPos.xyz;
  let z = dot(v, u.camFwd.xyz);
  let x = dot(v, u.camRight.xyz) / u.camRight.w;
  let y = dot(v, u.camUp.xyz) / u.camUp.w;
  return vec4f(x - u.jitter.x * 2.0 * u.res.z * z, y + u.jitter.y * 2.0 * u.res.w * z, ZA * (z - ZNEAR), z);
}
fn sunLight(wpos: vec3f, time: f32) -> vec3f {
  let depth = max(-wpos.y, 0.0);
  let sl = depth / SUN.y;

struct LIn { @location(0) pos: vec3f, @location(1) nrm: vec3f, @location(2) uvp: vec3f, @location(3) ia: vec4f, @location(4) ib: vec4f };

fn pathPos(ia: vec4f, ib: vec4f, t: f32) -> vec3f {

}

struct KIn { @location(0) st: vec2f, @location(3) ia: vec4f, @location(4) ib: vec4f };
struct KOut { @builtin(position) clip: vec4f, @location(0) wpos: vec3f, @location(1) nrm: vec3f, @location(2) uv: vec3f, @location(3) seed: f32, @location(4) kind: f32 };
// ribbons: ia = root, height; ib = seed, half width, phase, kind (0 giant kelp, 1 sea grass / red algae, 2 sea fan, 3 reef anemone / hydroid)
fn kelpPos(ia: vec4f, ib: vec4f, tt: f32, t: f32) -> vec3f {
  let h = ia.w; let s = ib.x * 50.0;
  let k = pow(tt, 1.4);
  var off = vec2f(0.85, 0.4) * (h * 0.13 * k) * (0.7 + 0.3 * sin(t * 0.21 + ib.z));
  let a1 = t * 0.55 + ib.z + tt * 2.6;
  off += vec2f(sin(a1), cos(a1 * 0.83 + s)) * (h * 0.03 * k + 0.2 * tt);
  off += vec2f(cos(tt * 9.0 + s), sin(tt * 9.0 + s)) * 0.3 * tt;
  return ia.xyz + vec3f(off.x, h * tt * (1.0 - 0.05 * k), off.y);
}
// grass leans with the surge, which travels across the meadow as a wave
fn grassPos(ia: vec4f, ib: vec4f, tt: f32, t: f32) -> vec3f {
  let h = ia.w; let s = ib.x * 50.0;
  let ph = t * 1.15 + ia.x * 0.21 + ia.z * 0.17;
  let bend = (0.22 + 0.21 * sin(ph) + 0.07 * sin(ph * 2.3 + s)) * h;
  let off = (vec2f(0.8, 0.6) * bend + vec2f(cos(s * 7.0), sin(s * 7.0)) * 0.32 * h) * tt * tt;
  return ia.xyz + vec3f(off.x, h * tt * (1.0 - 0.18 * tt * tt), off.y);
}

struct PIn { @builtin(vertex_index) vi: u32, @location(3) ia: vec4f, @location(4) ib: vec4f };
