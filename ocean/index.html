<script>
'use strict';
/* =====================================================================================
   WGSL — shared header
   ===================================================================================== */
const WGSL_COMMON = /* wgsl */`
struct U {
  camPos: vec4f,    // xyz, w = time
  camRight: vec4f,  // xyz, w = tan(fov/2) * aspect
  camUp: vec4f,     // xyz, w = tan(fov/2)
  camFwd: vec4f,    // xyz, w = frame index
  pPos: vec4f, pRight: vec4f, pUp: vec4f, pFwd: vec4f,   // previous frame camera
  res: vec4f,       // render w, h, 1/w, 1/h
  jitter: vec4f,    // xy sub-pixel jitter, z history blend, w neighbourhood clamp on/off
  quality: vec4f,   // x march steps, y volume samples, z shadow steps, w exposure
  smap: vec4f,      // xz centre, extent, 1/extent
  misc: vec4f,      // x shadow map size, yz canvas size, w cinema mode
};
@group(0) @binding(0) var<uniform> u: U;

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}
`;

/* =====================================================================================
   WGSL — the world: noise, signed distance modelling, water optics, shading
   ===================================================================================== */
const WGSL_SCENE = /* wgsl */`
@group(0) @binding(1) var smapTex: texture_2d<f32>;
@group(0) @binding(2) var lin: sampler;
@group(0) @binding(3) var sdfTex: texture_3d<f32>;    // baked distance to everything but the sea bed
@group(0) @binding(4) var hTex: texture_2d<f32>;      // baked sea bed: height above FLOOR, slope x, slope z, step factor
@group(0) @binding(5) var nTex: texture_3d<f32>;      // tiling fractal noise and its gradient
@group(0) @binding(6) var rep: sampler;
@group(0) @binding(7) var rockTex: texture_3d<f32>;
@group(0) @binding(8) var cauTex: texture_2d<f32>;    // this frame's caustic pattern
@group(0) @binding(9) var cauLo: texture_2d<f32>;     // the same, blurred
@group(0) @binding(10) var auxTex: texture_2d<f32>;   // height of the boulders above the bare sea bed (and the bakes' scratch input)   // baked distance to the natural rock (arch, cave massif), half-metre voxels

const PI = 3.14159265;
const VOX = 1.25;                                 // the baked distance volume: 384 x 96 x 384 voxels
const VMIN = vec3f(-240.0, -118.0, -240.0);
const VSIZE = vec3f(480.0, 120.0, 480.0);
const RMIN = vec3f(-172.0, -54.0, -36.0);         // the rock volume: 284 x 88 x 260 voxels
const RSIZE = vec3f(142.0, 44.0, 130.0);
const TAU = 6.2831853;
const FLOOR = -50.0;
const TMAX = 320.0;
const SUN = vec3f(0.4389, 0.8778, 0.1931);         // towards the sun, under water
const SUNAIR = vec3f(0.5837, 0.7703, 0.2568);    // the same ray above the surface
const EXT = vec3f(0.020, 0.0078, 0.0058);         // beam extinction per metre
const SIG_S = vec3f(0.0007, 0.0017, 0.0027);      // scattering per metre
const KD = vec3f(0.024, 0.0095, 0.0080);          // downwelling attenuation per metre
const SUNE = vec3f(7.4, 7.0, 6.3);
const AMBE = vec3f(0.46, 0.90, 1.28);
const RUNE = vec3f(0.30, 1.00, 0.86);
const OB_A = vec3f(0.0, -45.0, 0.0);              // obelisk axis (glow)
const OB_B = vec3f(0.0, -34.0, 0.0);
const PURPLE = vec3f(0.62, 0.22, 1.0);
const ZNEAR = 0.1;
const ZA = 1.0001667;                             // far / (far - near), far = 600
const CAVE_C = vec3f(-125.0, -44.0, 5.0);         // heart of the glowing cave

// ---------- hashes and noise ----------
fn hash21(p: vec2f) -> f32 {
  var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
fn hash31(p: vec3f) -> f32 {
  var p3 = fract(p * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
fn mod289v3(x: vec3f) -> vec3f { return x - floor(x * (1.0 / 289.0)) * 289.0; }
fn mod289v2(x: vec2f) -> vec2f { return x - floor(x * (1.0 / 289.0)) * 289.0; }
fn permute(x: vec3f) -> vec3f { return mod289v3(((x * 34.0) + 1.0) * x); }
// 2D simplex noise, -1..1
fn snoise(v: vec2f) -> f32 {
  let C = vec4f(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  var i = floor(v + dot(v, C.yy));
  let x0 = v - i + dot(i, C.xx);
  let i1 = select(vec2f(0.0, 1.0), vec2f(1.0, 0.0), x0.x > x0.y);
  let x1 = x0 + C.xx - i1;
  let x2 = x0 + C.zz;
  i = mod289v2(i);
  let p = permute(permute(i.y + vec3f(0.0, i1.y, 1.0)) + i.x + vec3f(0.0, i1.x, 1.0));
  var m = max(vec3f(0.5) - vec3f(dot(x0, x0), dot(x1, x1), dot(x2, x2)), vec3f(0.0));
  m = m * m; m = m * m;
  let x = 2.0 * fract(p * C.www) - 1.0;
  let h = abs(x) - 0.5;
  let a0 = x - floor(x + 0.5);
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  let g = vec3f(a0.x * x0.x + h.x * x0.y, a0.y * x1.x + h.y * x1.y, a0.z * x2.x + h.z * x2.y);
  return 130.0 * dot(m, g);
}
fn vnoise3(p: vec3f) -> f32 {
  let i = floor(p); let f = fract(p);
  let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash31(i), hash31(i + vec3f(1, 0, 0)), w.x), mix(hash31(i + vec3f(0, 1, 0)), hash31(i + vec3f(1, 1, 0)), w.x), w.y),
             mix(mix(hash31(i + vec3f(0, 0, 1)), hash31(i + vec3f(1, 0, 1)), w.x), mix(hash31(i + vec3f(0, 1, 1)), hash31(i + vec3f(1, 1, 1)), w.x), w.y), w.z);
}
// four octaves of value noise with a period of 16; baked once into nTex together with its gradient
fn vnoiseP(p: vec3f, per: f32) -> f32 {
  let i = floor(p); let f = fract(p);
  let w = f * f * (3.0 - 2.0 * f);
  let a = i - floor(i / per) * per;
  let b = (i + 1.0) - floor((i + 1.0) / per) * per;
  return mix(mix(mix(hash31(vec3f(a.x, a.y, a.z)), hash31(vec3f(b.x, a.y, a.z)), w.x), mix(hash31(vec3f(a.x, b.y, a.z)), hash31(vec3f(b.x, b.y, a.z)), w.x), w.y),
             mix(mix(hash31(vec3f(a.x, a.y, b.z)), hash31(vec3f(b.x, a.y, b.z)), w.x), mix(hash31(vec3f(a.x, b.y, b.z)), hash31(vec3f(b.x, b.y, b.z)), w.x), w.y), w.z);
}
fn fbmP(p: vec3f) -> f32 {
  var f = 0.0; var a = 0.5; var q = p; var per = 16.0;
  for (var i = 0; i < 4; i++) { f += a * vnoiseP(q, per); q = q * 2.0 + vec3f(3.0, 9.0, 5.0); per *= 2.0; a *= 0.5; }
  return f;
}
@fragment fn fsNoise(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let q = vec3f(fc.xy, u.camPos.y) * 0.125;
  let e = 0.03;
  return vec4f(fbmP(q), (fbmP(q + vec3f(e, 0.0, 0.0)) - fbmP(q - vec3f(e, 0.0, 0.0))) / (2.0 * e),
               (fbmP(q + vec3f(0.0, e, 0.0)) - fbmP(q - vec3f(0.0, e, 0.0))) / (2.0 * e), (fbmP(q + vec3f(0.0, 0.0, e)) - fbmP(q - vec3f(0.0, 0.0, e))) / (2.0 * e));
}
fn fbm3(p: vec3f) -> f32 { return textureSampleLevel(nTex, rep, p * 0.0625, 0.0).r; }

// ---------- distance primitives ----------
fn rot(a: f32) -> mat2x2f { let c = cos(a); let s = sin(a); return mat2x2f(c, s, -s, c); }
fn sdBox(p: vec3f, b: vec3f) -> f32 { let q = abs(p) - b; return length(max(q, vec3f(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0); }
fn sdBox2(p: vec2f, b: vec2f) -> f32 { let q = abs(p) - b; return length(max(q, vec2f(0.0))) + min(max(q.x, q.y), 0.0); }
fn sdCyl(p: vec3f, r: f32, h: f32) -> f32 { let d = vec2f(length(p.xz) - r, abs(p.y) - h); return min(max(d.x, d.y), 0.0) + length(max(d, vec2f(0.0))); }
fn sdCapsule(p: vec3f, a: vec3f, b: vec3f, r: f32) -> f32 { let pa = p - a; let ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)) - r; }
fn sdEll(p: vec3f, r: vec3f) -> f32 { let k0 = length(p / r); let k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
fn smin(a: f32, b: f32, k: f32) -> f32 { let h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
fn smax(a: f32, b: f32, k: f32) -> f32 { return -smin(-a, -b, k); }
fn opU(a: vec2f, b: vec2f) -> vec2f { if (a.x < b.x) { return a; } return b; }

// ---------- sea bed ----------
// 0 where the sea bed is kept open and sandy, 1 where the reef ridges rise
fn zoneMask(q: vec2f) -> f32 {
  var f = smoothstep(55.0, 140.0, length(q));
  f *= mix(1.0, smoothstep(15.0, 46.0, abs(q.x)), smoothstep(-25.0, 25.0, q.y));
  f *= smoothstep(34.0, 62.0, length(q - vec2f(112.0, 28.0)));     // kelp forest
  f *= smoothstep(22.0, 46.0, length(q - vec2f(66.0, -70.0)));     // wreck
  f *= smoothstep(16.0, 38.0, length(q - vec2f(100.0, -30.0)));    // whale tail
  f *= smoothstep(14.0, 34.0, length(q - vec2f(22.0, -98.0)));     // fallen head
  f *= smoothstep(22.0, 46.0, length(q - vec2f(-62.0, 62.0)));     // rock arch
  f *= smoothstep(46.0, 78.0, length(q - vec2f(-125.0, 5.0)));     // cave
  return f;
}
fn trench(q: vec2f) -> f32 { let d = (q.x - 172.0 - 16.0 * sin(q.y * 0.017)) / 20.0; return exp(-d * d); }
fn terrainH(q: vec2f) -> f32 {
  let farM = zoneMask(q);
  let dunes = snoise(q * 0.012) * 3.0 + snoise(q * 0.035 + 7.3);
  let rg = 1.0 - abs(snoise(q * 0.0065 + 3.1));
  var h = FLOOR + dunes * (0.22 + 0.78 * farM);
  h += (rg * rg * 26.0 + 5.0 * farM) * farM;
  h += snoise(q * 0.09) * 1.6 * farM * rg;
  return h - 64.0 * trench(q);
}
// (distance, height above the sea bed)
fn sdTerrain(p: vec3f) -> vec2f {
  if (p.y > -11.0) { return vec2f(p.y + 12.0, 50.0); }
  let ha = p.y - terrainH(p.xz);
  return vec2f(ha * mix(0.55, 0.33, trench(p.xz)), ha);
}

// the baked copy of the same sea bed: one fetch instead of four noise evaluations
fn terrA(p: vec3f) -> vec2f {
  if (p.y > -11.0) { return vec2f(p.y + 12.0, 50.0); }
  let s = textureSampleLevel(hTex, lin, p.xz / 480.0 + 0.5, 0.0);
  let ha = p.y - FLOOR - s.r;
  return vec2f(ha * s.a, ha);
}
// The bake runs in three passes. Boulders are drawn as quads into a height layer, keeping the highest;
struct RIn { @builtin(vertex_index) vi: u32, @location(3) ia: vec4f, @location(4) ib: vec4f };
struct ROut { @builtin(position) clip: vec4f, @location(0) lp: vec2f, @location(1) hs: vec2f };
@vertex fn vsRockH(v: RIn) -> ROut {
  let c = array<vec2f, 6>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0))[v.vi] * 1.4;
  let q = v.ia.xy + c * v.ia.z;
  var o: ROut;
  o.clip = vec4f(q.x / 240.0, -q.y / 240.0, 0.0, 1.0);
  o.lp = c; o.hs = vec2f(v.ia.w, v.ib.x);
  return o;
}
@fragment fn fsRockH(i: ROut) -> @location(0) vec4f {
  let n1 = snoise(i.lp * 1.7 + i.hs.y * 17.0); let n2 = snoise(i.lp * 4.3 + i.hs.y * 31.0);
  let rr = length(i.lp) * (1.0 + 0.28 * n1);
  return vec4f(i.hs.x * (1.0 - smoothstep(0.45, 1.0, rr)) * (0.72 + 0.28 * (1.0 - min(rr * rr, 1.0)) + 0.16 * n2 + 0.1 * n1), 0.0, 0.0, 1.0);
}
// then the sea bed is added (the sum is stored as a coarse part and a fine remainder, to keep full precision in half floats);
@fragment fn fsHeightRaw(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let h = terrainH((fc.xy / 2048.0 - 0.5) * 480.0) - FLOOR + textureLoad(auxTex, vec2i(fc.xy), 0).r;
  let c = floor(h * 8.0 + 0.5) / 8.0;
  return vec4f(c, h - c, 0.0, 1.0);
}
fn hraw(ip: vec2i) -> f32 { let s = textureLoad(auxTex, clamp(ip, vec2i(0), vec2i(2047)), 0); return s.r + s.g; }
// and last the slopes and the step factor: how much of the height above the bed is safe to march at once
// (most of it over the open sand, less on the reef ridges, in the trench and on the flanks of boulders).
@fragment fn fsHeight(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let ip = vec2i(fc.xy);
  let d = 480.0 / 2048.0;
  let h = hraw(ip);
  let sx = (hraw(ip + vec2i(1, 0)) - hraw(ip - vec2i(1, 0))) / (2.0 * d);
  let sz = (hraw(ip + vec2i(0, 1)) - hraw(ip - vec2i(0, 1))) / (2.0 * d);
  var s2 = sx * sx + sz * sz;
  for (var k = 0; k < 4; k++) {
    let g = (hraw(ip + array<vec2i, 4>(vec2i(3, 0), vec2i(-3, 0), vec2i(0, 3), vec2i(0, -3))[k]) - h) / (3.0 * d);
    s2 = max(s2, g * g);
  }
  let q = (fc.xy / 2048.0 - 0.5) * 480.0;
  let k0 = mix(mix(0.85, 0.55, min(zoneMask(q) * 4.0, 1.0)), 0.33, trench(q));
  return vec4f(h, sx, sz, min(k0, 0.95 / sqrt(1.0 + s2)));
}

// ---------- natural rock ----------
fn rockDisp(p: vec3f) -> f32 {
  return (vnoise3(p * 0.16) - 0.5) * 4.5 + (vnoise3(p * 0.5 + 7.0) - 0.5) * 1.5 + 0.22 * sin(p.y * 1.9 + 3.0 * vnoise3(p * 0.3));
}
fn sdArch(p0: vec3f) -> f32 {
  var p = p0 - vec3f(-62.0, 0.0, 62.0);
  let bd = length(p - vec3f(0.0, 8.0, 0.0)) - 31.0;
  if (bd > 3.0) { return bd; }
  let r2 = rot(-0.785) * p.xz; p = vec3f(r2.x, p.y, r2.y);
  let a = atan2(p.y - 1.0, p.x);
  let c = vec2f(length(p.xy - vec2f(0.0, 1.0)) - 15.0, p.z * 0.75);
  var d = length(c) - (4.6 + 1.2 * sin(a * 3.0 + 1.0));
  d = smin(d, sdEll(p - vec3f(-18.0, 1.0, 3.0), vec3f(9.0, 7.0, 8.0)), 3.0);
  d = smin(d, sdEll(p - vec3f(19.0, 0.0, -4.0), vec3f(10.0, 6.0, 9.0)), 3.0);
  return (d + rockDisp(p0)) * 0.6;
}
fn caveVoid(p: vec3f) -> f32 {
  var c = length((p - vec3f(0.0, 6.0, 0.0)) * vec3f(1.0, 1.3, 1.0)) - 15.0;
  c = smin(c, sdCapsule(p, vec3f(8.0, 4.5, 0.0), vec3f(52.0, 4.0, 5.0), 6.0), 4.0);
  return smin(c, sdCapsule(p, vec3f(-3.0, 13.0, -2.0), vec3f(11.5, 42.0, 4.3), 5.0), 3.0);
}
// a rock massif with a chamber, a tunnel towards the ruins and a skylight aligned with the sun
fn sdCaveRock(p0: vec3f) -> f32 {
  let p = p0 - vec3f(-125.0, 0.0, 5.0);
  let bd = sdEll(p - vec3f(4.0, 4.0, 3.0), vec3f(50.0, 34.0, 44.0));
  if (bd > 3.0) { return bd; }
  var d = sdEll(p - vec3f(0.0, 3.0, 0.0), vec3f(40.0, 27.0, 34.0));
  d = smin(d, sdEll(p - vec3f(26.0, 1.0, 20.0), vec3f(18.0, 13.0, 16.0)), 6.0);
  let nd = rockDisp(p0);
  d += nd;
  return smax(d, -(caveVoid(p) - nd * 0.35), 2.5) * 0.6;
}
// how much open-water light reaches a point in or near the cave (1 outside)
fn caveSky(pos: vec3f) -> f32 {
  let p = pos - vec3f(-125.0, FLOOR, 5.0);
  if (dot(p, p) > 3600.0 || caveVoid(p) > 6.0) { return 1.0; }
  return mix(0.06, 1.0, max(smoothstep(18.0, 46.0, p.x), smoothstep(18.0, 32.0, p.y)));
}
fn sdCrystal(p: vec3f, r: f32, h: f32) -> f32 {
  let q = abs(p.xz);
  let hex = max(q.x * 0.866 + q.y * 0.5, q.y);
  return max(hex - r * min(1.0, (h - p.y) / (r * 1.6)), -p.y - 2.0) * 0.6;
}
fn sdCrystals(p0: vec3f) -> f32 {
  let p = p0 - vec3f(-125.0, 0.0, 5.0);
  let bd = length(p - vec3f(0.0, 5.0, 0.0)) - 18.0;
  if (bd > 2.0) { return bd; }
  let sec = TAU / 7.0;
  let id = round((atan2(p.z, p.x) - sec * 0.5) / sec);
  let ang = id * sec + sec * 0.5;
  let h = hash21(vec2f(id, 5.0));
  let ca = cos(ang); let sa = sin(ang);
  let pc = vec3f(ca * p.x + sa * p.z - (9.5 + 2.5 * h), p.y + 0.5, -sa * p.x + ca * p.z);
  var q = pc;
  var r2 = rot(0.3 - 0.5 * h) * q.xy; q = vec3f(r2.x, r2.y, q.z);
  var d = sdCrystal(q, 0.8 + 0.5 * h, 4.5 + 4.0 * h);
  q = pc - vec3f(0.9, 0.0, 1.1);
  r2 = rot(-0.5) * q.xy; q = vec3f(r2.x, r2.y, q.z);
  r2 = rot(0.4) * q.yz; q = vec3f(q.x, r2.x, r2.y);
  d = min(d, sdCrystal(q, 0.5, 3.0 + 2.0 * h));
  q = pc - vec3f(-0.5, 0.0, -1.2);
  r2 = rot(-0.45) * q.yz; q = vec3f(q.x, r2.x, r2.y);
  d = min(d, sdCrystal(q, 0.45, 2.6));
  q = p - vec3f(-2.0, -0.5, 1.5);
  r2 = rot(0.15) * q.xy; q = vec3f(r2.x, r2.y, q.z);
  d = min(d, sdCrystal(q, 1.5, 8.5));
  q = p - vec3f(-1.0, -0.5, 3.0);
  r2 = rot(-0.55) * q.yz; q = vec3f(q.x, r2.x, r2.y);
  d = min(d, sdCrystal(q, 0.9, 5.5));
  return d;
}
// coral heads scattered over the reef zones, one per 5 m cell at most, seated on the sea bed
fn reefZone(c: vec2f) -> f32 {
  var dz = min(length(c - vec2f(-62.0, 62.0)) - 42.0, length(c - vec2f(66.0, -70.0)) - 40.0);
  dz = min(dz, min(length(c - vec2f(100.0, -30.0)) - 30.0, length(c - vec2f(118.0, 30.0)) - 50.0));
  return min(dz, length(c - vec2f(-78.0, 8.0)) - 24.0);
}
fn coralAt(p: vec3f, ha: f32, id: vec2f) -> f32 {
  let c = (id + 0.5) * 5.0;
  let h = hash21(id + 3.0);
  if (h > 0.34 || reefZone(c) > 0.0) { return 9.0; }
  let f = p.xz - c;
  let r = 0.45 + 1.25 * fract(h * 37.0) * fract(h * 37.0);
  let o = (vec2f(fract(h * 113.0), fract(h * 271.0)) - 0.5) * (1.9 - r) * 1.4;
  let q = vec3f(f.x - o.x, ha - r * 0.3, f.y - o.y);
  if (fract(h * 53.0) > 0.5) {
    return (length(q * vec3f(1.0, 1.3, 1.0)) - r + 0.07 * r * sin(q.x * 8.0 / r) * sin(q.y * 8.0 / r + 1.0) * sin(q.z * 8.0 / r)) * 0.6;
  }
  let sec = TAU / 6.0;
  let ia = round(atan2(q.z, q.x) / sec) * sec;
  let cs = cos(ia); let sn = sin(ia);
  let pk = vec3f(cs * q.x + sn * q.z, q.y + r * 0.3, -sn * q.x + cs * q.z);
  var d = min(sdCapsule(pk, vec3f(0.2 * r, 0.0, 0.0), vec3f(0.8 * r, 1.5 * r, 0.0), 0.2 * r),
              sdCapsule(pk, vec3f(0.0), vec3f(0.0, 1.9 * r, 0.0), 0.22 * r));
  d = min(d, length(pk - vec3f(0.8 * r, 1.5 * r, 0.0)) - 0.3 * r);
  return d * 0.6;
}
// the four nearest cells are evaluated so that the field stays a true distance (ambient occlusion relies on it)
fn sdCoral(p: vec3f, ha: f32) -> f32 {
  if (ha > 4.5) { return ha * 0.5; }
  let dz = reefZone(p.xz);
  if (dz > 4.0) { return dz - 1.9; }
  let i0 = floor(p.xz / 5.0 - 0.5);
  var d = min(coralAt(p, ha, i0), coralAt(p, ha, i0 + vec2f(1.0, 0.0)));
  d = min(d, min(coralAt(p, ha, i0 + vec2f(0.0, 1.0)), coralAt(p, ha, i0 + vec2f(1.0, 1.0))));
  return min(d, 3.1);
}

// ---------- wreck ----------
fn wreckLocal(p0: vec3f) -> vec3f {
  var p = p0 - vec3f(66.0, -0.8, -70.0);
  let r1 = rot(0.9) * p.xz; p = vec3f(r1.x, p.y, r1.y);
  let r2 = rot(0.28) * p.yz;
  return vec3f(p.x, r2.x, r2.y);
}
fn sdWreck(p0: vec3f) -> f32 {
  let p = wreckLocal(p0);
  let bd = sdBox(p - vec3f(-2.0, 10.0, 2.0), vec3f(25.0, 14.0, 11.0));
  if (bd > 2.0) { return bd; }
  let k = clamp(1.0 - p.x * p.x / 324.0, 0.0, 1.0);
  let wx = max(4.4 * sqrt(k) * (0.75 + 0.25 * k), 0.35);
  let deckY = 5.4 + 0.010 * p.x * p.x + 2.4 * smoothstep(8.0, 10.0, p.x);
  let dh = (length(vec2f(p.z / wx, min(p.y - 5.6, 0.0) / 5.6)) - 1.0) * min(wx, 4.4);
  let ends = abs(p.x) - 17.9;
  let hole = sin(p.x * 0.55 + 1.3) * sin(p.y * 0.8 + 0.5) * sin(p.z * 0.3 + p.x * 0.21);
  var d = max(max(max(abs(dh) - 0.13, p.y - deckY), (hole - 0.25) * 1.5), ends);
  let rx = abs(p.x - round(p.x / 1.7) * 1.7) - 0.14;
  d = min(d, max(max(max(abs(dh + 0.22) - 0.2, rx), p.y - deckY + 0.3), ends + 0.8));
  d = min(d, sdBox(p - vec3f(0.0, 0.1, 0.0), vec3f(17.6, 0.45, 0.28)));
  let hole2 = sin(p.x * 0.4 + 2.0) * sin(p.z * 0.9 + 1.0);
  d = min(d, max(max(max(dh, abs(p.y - deckY + 0.5) - 0.1), (hole2 - 0.45) * 1.5), ends));
  d = min(d, sdCapsule(p, vec3f(1.5, 1.0, 0.0), vec3f(2.2, 21.0, 0.0), 0.42));
  d = min(d, sdCapsule(p, vec3f(2.0, 15.5, -5.0), vec3f(2.0, 15.0, 5.0), 0.2));
  d = min(d, sdCyl(p - vec3f(2.05, 17.2, 0.0), 0.95, 0.12));
  d = min(d, sdCapsule(p, vec3f(-8.5, 1.0, 0.0), vec3f(-8.8, 12.5, 0.0), 0.36));
  d = min(d, sdCapsule(p, vec3f(9.0, 7.5, 0.5), vec3f(20.0, 5.5, 10.5), 0.3));
  d = min(d, sdCapsule(p, vec3f(-17.0, 6.2, 0.0), vec3f(-24.5, 9.2, 0.0), 0.24));
  return d * 0.6;
}

// ---------- colossal sculpture ----------
// a 26 m whale fluke of dressed basalt rising from the sand
fn sdWhaleTail(p0: vec3f) -> f32 {
  var p = p0 - vec3f(100.0, 0.0, -30.0);
  let bd = length(p - vec3f(0.0, 12.0, 0.0)) - 20.0;
  if (bd > 2.0) { return bd; }
  let r1 = rot(-0.5) * p.xz;
  let q = vec3f(r1.x, p.y, r1.y - 0.012 * p.y * p.y);
  let ty = clamp(q.y / 19.0, 0.0, 1.0);
  var d = max(length(vec2f(q.x * 1.35, q.z)) - mix(4.6, 1.1, pow(ty, 0.6)), q.y - 20.0) * 0.7;
  let rf = rot(-0.42) * (vec2f(abs(q.x), q.y - 20.2) - vec2f(5.6, 1.2));
  d = smin(d, sdEll(vec3f(rf.x, rf.y, q.z + 0.02 * rf.x * rf.x), vec3f(6.6, 2.5, 0.5)), 1.6);
  d = smax(d, -(length(vec3f(q.x, q.y - 23.8, q.z)) - 1.5), 0.8);
  return d + 0.03 * smoothstep(0.9, 1.0, fract(q.y * 0.55));
}
// head of a bearded god; q is relative to the centre of the skull, about 1.7 units tall
fn sdHead(q: vec3f) -> f32 {
  var hd = sdEll(q - vec3f(0.0, 0.0, 0.08), vec3f(0.52, 0.66, 0.6));
  hd = smin(hd, sdEll(q - vec3f(0.0, -0.52, 0.4), vec3f(0.36, 0.52, 0.3)), 0.2);        // beard
  hd = smin(hd, sdCapsule(q, vec3f(0.0, 0.14, 0.66), vec3f(0.0, -0.10, 0.77), 0.07), 0.08);
  hd = smin(hd, sdCapsule(q, vec3f(-0.3, 0.20, 0.57), vec3f(0.3, 0.20, 0.57), 0.085), 0.1);
  hd = smax(hd, -sdEll(vec3f(abs(q.x) - 0.2, q.y - 0.07, q.z - 0.67), vec3f(0.13, 0.07, 0.11)), 0.05);
  hd = smin(hd, sdEll(q - vec3f(0.0, -0.17, -0.22), vec3f(0.64, 0.86, 0.6)), 0.15);     // hair
  return hd;
}
fn sdFallenHead(p0: vec3f) -> f32 {
  var p = p0 - vec3f(22.0, 2.5, -98.0);
  let S = 10.0;
  let bd = length(p) - 1.15 * S;
  if (bd > 2.0) { return bd; }
  var r2 = rot(0.3) * p.xz; p = vec3f(r2.x, p.y, r2.y);
  r2 = rot(0.35) * p.xy; p = vec3f(r2.x, r2.y, p.z);
  r2 = rot(0.85) * p.yz; p = vec3f(p.x, r2.x, r2.y);
  let q = p / S;
  var d = sdHead(q);
  d = smin(d, sdCapsule(q, vec3f(0.0, -0.5, -0.05), vec3f(0.0, -1.15, -0.1), 0.36), 0.15);
  d = smin(d, sdCapsule(q, vec3f(-0.13, -0.24, 0.66), vec3f(0.13, -0.24, 0.66), 0.045), 0.05);
  d = smin(d, length(vec3f(abs(q.x) - 0.2, q.y - 0.07, q.z - 0.6)) - 0.075, 0.02);
  d += 0.012 * sin(q.x * 23.0 + sin(q.y * 9.0) * 2.0) * (1.0 - smoothstep(-0.3, 0.2, q.z));
  return d * S * 0.85;
}

// ---------- architecture ----------
// a fluted column standing on y = 0; the shaft is broken off above 'cutY'
fn sdColumn(p: vec3f, r: f32, h: f32, cutY: f32) -> f32 {
  let rr = length(p.xz);
  let a = atan2(p.z, p.x);
  let hs = h - r * 0.9;
  let ty = clamp(p.y / hs, 0.0, 1.0);
  let rs = r * (1.0 - 0.17 * ty * ty) - 0.05 * r * (0.5 + 0.5 * cos(a * 20.0));
  var d = max(rr - rs + 0.02 * smoothstep(0.95, 1.0, fract(p.y / (r * 1.9))), abs(p.y - hs * 0.5) - hs * 0.5);
  d = min(d, sdCyl(p - vec3f(0.0, r * 0.18, 0.0), r * 1.34, r * 0.18) - 0.03);
  d = min(d, sdCyl(p - vec3f(0.0, r * 0.50, 0.0), r * 1.17, r * 0.12) - 0.05);
  let ey = p.y - hs;
  let er = r * 0.84 + clamp(ey, 0.0, r * 0.45) * 0.95;
  d = min(d, max(rr - er, abs(ey - r * 0.225) - r * 0.225));
  d = min(d, sdBox(p - vec3f(0.0, hs + r * 0.67, 0.0), vec3f(r * 1.42, r * 0.22, r * 1.42)) - 0.02);
  let jag = 0.35 * sin(p.x * 3.1 + 1.0) * sin(p.z * 2.7) + p.x * 0.3;
  return max(d, p.y + jag - cutY);
}

fn ruinMask(a: f32) -> f32 { return sin(a + 0.9) + 0.6 * sin(a * 2.0 + 4.0) + 0.45; }

// round sanctuary: stepped platform, ring of columns, broken entablature, obelisk at the heart
fn sdTholos(p: vec3f) -> vec2f {
  let rr = length(p.xz);
  let bd = max(rr - 29.0, p.y - 22.0);
  if (bd > 2.0) { return vec2f(bd, 3.0); }
  let q = vec2f(rr, p.y);
  var d = sdBox2(q - vec2f(0.0, 0.2), vec2f(27.0, 0.5));
  d = min(d, sdBox2(q - vec2f(0.0, 0.9), vec2f(25.0, 0.5)));
  d = min(d, sdBox2(q - vec2f(0.0, 1.6), vec2f(23.0, 0.5)));
  d -= 0.05;
  // columns
  let sector = TAU / 20.0;
  let a = atan2(p.z, p.x);
  let id = round(a / sector);
  let ang = id * sector;
  let ca = cos(ang); let sa = sin(ang);
  let pc = vec3f(ca * p.x + sa * p.z - 19.0, p.y - 2.1, -sa * p.x + ca * p.z);
  var cutY = 100.0;
  let mk = ruinMask(ang);
  if (mk < 0.12) { cutY = 1.5 + 9.0 * hash21(vec2f(id, 3.7)); }
  d = min(d, sdColumn(pc, 1.05, 14.0, cutY));
  // entablature and cornice
  let q2 = vec2f(rr - 19.0, p.y - 17.3);
  var de = sdBox2(q2, vec2f(1.45, 1.1)) - 0.06;
  de = min(de, sdBox2(q2 - vec2f(0.0, 1.35), vec2f(1.95, 0.22)) - 0.04);
  de = max(de, -sdBox2(vec2f(abs(q2.x) - 1.5, q2.y + 0.25), vec2f(0.12, 0.12)));
  let jag = 0.6 * sin(p.y * 2.3 + a * 40.0);
  de = max(de, -(ruinMask(a) * 8.0 + jag));
  d = min(d, de);
  // fallen blocks of the entablature
  var pb = p - vec3f(-21.5, 2.7, 5.0);
  var pr = rot(0.5) * pb.xz; pb = vec3f(pr.x, pb.y, pr.y);
  pr = rot(0.22) * pb.xy; pb = vec3f(pr.x, pr.y, pb.z);
  d = min(d, sdBox(pb, vec3f(2.6, 1.0, 1.4)) - 0.06);
  pb = p - vec3f(-15.0, 2.6, -8.5);
  pr = rot(-0.9) * pb.xz; pb = vec3f(pr.x, pb.y, pr.y);
  pr = rot(-0.3) * pb.yz; pb = vec3f(pb.x, pr.x, pr.y);
  d = min(d, sdBox(pb, vec3f(2.2, 1.0, 1.3)) - 0.06);
  var res = vec2f(d, 3.0);
  // altar and obelisk
  var da = sdCyl(p - vec3f(0.0, 2.5, 0.0), 4.2, 0.4) - 0.05;
  da = min(da, sdCyl(p - vec3f(0.0, 3.2, 0.0), 3.2, 0.4) - 0.05);
  res = opU(res, vec2f(da, 3.0));
  let po = p - vec3f(0.0, 3.6, 0.0);
  let pq = rot(0.7854) * po.xz;
  let wy = mix(1.15, 0.72, clamp(po.y / 10.5, 0.0, 1.0)) - max(po.y - 10.5, 0.0) * 0.5;
  let dob = max(max(abs(pq.x), abs(pq.y)) - wy, abs(po.y - 6.0) - 6.0) * 0.8;
  res = opU(res, vec2f(dob, 5.0));
  return res;
}

// processional avenue
fn sdAvenue(p: vec3f) -> f32 {
  let bd = max(max(abs(p.z - 86.0) - 34.0, abs(abs(p.x) - 11.0) - 2.6), p.y - 14.5);
  if (bd > 2.0) { return bd; }
  let iz = clamp(round((p.z - 56.0) / 8.5), 0.0, 7.0);
  let sx = sign(p.x);
  let h = hash21(vec2f(iz * 1.7 + 0.3, sx * 3.0 + 7.0));
  var cutY = 100.0;
  if (h < 0.42) { cutY = 1.6 + h * 19.0; }
  let pc = vec3f(abs(p.x) - 11.0, p.y, p.z - (56.0 + iz * 8.5));
  var d = sdBox(pc, vec3f(1.75, 1.0, 1.75)) - 0.05;
  d = min(d, sdColumn(pc - vec3f(0.0, 1.0, 0.0), 0.95, 11.5, cutY));
  return d;
}

// the Tide Gate: a colossal standing ring, half sunk into the sand
fn gateLocal(p: vec3f) -> vec3f {
  var q = p - vec3f(0.0, 11.5, 40.0);
  let r = rot(0.06) * q.xy;
  return vec3f(r.x, r.y, q.z);
}
fn sdGate(p: vec3f) -> f32 {
  let q = gateLocal(p);
  let bd = length(q) - 19.5;
  if (bd > 2.0) { return bd; }
  let c = vec2f(length(q.xy) - 15.5, q.z);
  var d = sdBox2(c, vec2f(1.7, 1.35)) - 0.18;
  d = max(d, -sdBox2(vec2f(c.x, abs(c.y) - 1.55), vec2f(0.55, 0.16)));
  let a = atan2(q.y, q.x);
  let sg = abs(fract(a * 14.0 / TAU) - 0.5);
  d += (1.0 - smoothstep(0.0, 0.035, sg)) * 0.07;
  let jag = 0.5 * sin(q.x * 2.1) * sin(q.y * 1.7 + 2.0) * sin(q.z * 2.9);
  d = max(d, -(length(q - vec3f(-11.4, 11.4, 0.3)) - 2.9 + jag));
  return d;
}

// toppled column, drums and blocks strewn along the avenue
fn sdDebris(p: vec3f) -> f32 {
  let bd = sdBox(p - vec3f(0.0, 1.0, 62.0), vec3f(19.0, 2.6, 23.0));
  if (bd > 2.0) { return bd; }
  var q = p - vec3f(7.5, 0.5, 74.0);
  var r2 = rot(1.25) * q.xz; q = vec3f(r2.x, q.y, r2.y);
  r2 = rot(-0.04) * q.xy; q = vec3f(r2.x, r2.y, q.z);
  var d = sdColumn(vec3f(q.y, q.x + 5.5, q.z), 0.95, 11.5, 9.2);
  q = p - vec3f(-5.5, 0.45, 66.0);
  r2 = rot(0.5) * q.xz; q = vec3f(r2.x, q.y, r2.y);
  d = min(d, sdCyl(vec3f(q.y, q.x, q.z), 0.92, 1.1) - 0.03);
  q = p - vec3f(-3.2, 0.25, 69.5);
  r2 = rot(0.35) * q.xy; q = vec3f(r2.x, r2.y, q.z);
  d = min(d, sdCyl(q, 0.92, 0.55) - 0.03);
  q = p - vec3f(-13.5, 0.7, 45.5);
  r2 = rot(0.7) * q.xz; q = vec3f(r2.x, q.y, r2.y);
  r2 = rot(0.35) * q.yz; q = vec3f(q.x, r2.x, r2.y);
  d = min(d, sdBox(q, vec3f(2.3, 1.2, 1.5)) - 0.15);
  q = p - vec3f(13.0, 0.3, 50.0);
  r2 = rot(-0.4) * q.xz; q = vec3f(r2.x, q.y, r2.y);
  d = min(d, sdBox(q, vec3f(1.2, 0.7, 0.9)) - 0.1);
  return d;
}

// a stepped pyramid half swallowed by the reef, far behind the sanctuary
fn sdZiggurat(p0: vec3f) -> f32 {
  var p = p0 - vec3f(-88.0, -2.0, -58.0);
  let bd = length(p - vec3f(0.0, 18.0, 0.0)) - 54.0;
  if (bd > 2.0) { return bd; }
  let r2 = rot(0.45) * p.xz; p = vec3f(r2.x, p.y, r2.y);
  let sh = 5.5;
  let lv = clamp(floor(p.y / sh), 0.0, 6.0);
  let w = 34.0 - lv * 4.2;
  var d = sdBox(p - vec3f(0.0, (lv + 0.5) * sh, 0.0), vec3f(w, sh * 0.5, w));
  d = min(d, sdBox(p - vec3f(0.0, (lv - 0.5) * sh, 0.0), vec3f(w + 4.2, sh * 0.5, w + 4.2)));
  d = min(d, sdBox(p - vec3f(0.0, 41.5, 0.0), vec3f(5.0, 3.0, 5.0)));
  d = max(d, -sdBox(p - vec3f(0.0, 41.0, 5.0), vec3f(1.6, 2.2, 1.5)));
  // central stair
  let ps = vec3f(abs(p.x), p.y, p.z);
  d = min(d, max(sdBox(ps - vec3f(0.0, 19.0, 20.0), vec3f(3.2, 20.0, 18.0)), (p.y * 0.764 + p.z - 36.5) * 0.79));
  return d - 0.25 * sin(p.x * 0.9) * sin(p.y * 1.3 + 1.0) * sin(p.z * 0.8) - 0.1;
}

// ---------- the Watcher: a 42 m colossus ----------
fn sdColossus(pw: vec3f) -> vec2f {
  let S = 3.8;
  let p = pw / S;
  let bd = sdCapsule(p, vec3f(0.0, 0.2, 0.3), vec3f(0.0, 9.6, 0.3), 3.7) * S;
  if (bd > 2.0) { return vec2f(bd, 4.0); }
  // pedestal
  var dped = sdBox(p - vec3f(0.0, -0.45, 0.0), vec3f(2.9, 0.45, 2.9)) - 0.03;
  dped = min(dped, sdBox(p - vec3f(0.0, -1.0, 0.0), vec3f(3.5, 0.3, 3.5)));
  dped = max(dped, -sdBox(vec3f(p.x, p.y + 0.45, abs(p.z) - 2.95), vec3f(2.3, 0.22, 0.08)));
  // robe
  let a = atan2(p.z, p.x);
  let ty = clamp(p.y / 5.9, 0.0, 1.0);
  let foldv = 0.075 * sin(a * 13.0 + sin(p.y * 1.3) * 1.6) * (1.0 - ty * 0.75);
  let rr = mix(1.9, 1.02, ty * (0.45 + 0.55 * ty)) + foldv;
  let pe = vec2f(p.x, p.z * 1.22);
  var b = max(length(pe) - rr, abs(p.y - 2.95) - 2.95) * 0.82;
  b = smin(b, sdEll(p - vec3f(0.0, 6.35, 0.0), vec3f(1.32, 1.5, 0.84)), 0.5);
  b = smin(b, sdEll(p - vec3f(0.0, 6.5, -0.5), vec3f(1.6, 2.0, 0.62)), 0.45);       // mantle
  b = smin(b, sdCapsule(p, vec3f(-1.35, 7.25, 0.0), vec3f(1.35, 7.25, 0.0), 0.5), 0.35);
  b = smin(b, sdCapsule(p, vec3f(0.0, 7.4, 0.0), vec3f(0.0, 8.2, 0.05), 0.36), 0.22);
  // belt
  b = min(b, length(vec2f(length(pe) - rr - 0.02, p.y - 5.05)) - 0.13);
  let hd = sdHead(p - vec3f(0.0, 8.72, 0.0));
  b = smin(b, hd, 0.12);
  // arms: the right one grips the trident, the left forearm is long gone
  b = smin(b, sdCapsule(p, vec3f(-1.6, 7.2, 0.0), vec3f(-2.05, 5.75, 0.45), 0.42), 0.25);
  b = smin(b, sdCapsule(p, vec3f(-2.05, 5.75, 0.45), vec3f(-2.0, 6.2, 1.7), 0.34), 0.2);
  b = smin(b, length(p - vec3f(-2.0, 6.25, 1.85)) - 0.36, 0.12);
  b = smin(b, sdCapsule(p, vec3f(1.6, 7.2, 0.0), vec3f(2.1, 5.8, 0.3), 0.42), 0.25);
  var fa = sdCapsule(p, vec3f(2.1, 5.8, 0.3), vec3f(2.3, 6.5, 1.9), 0.34);
  fa = max(fa, p.z - 1.0 + 0.14 * sin(p.x * 9.0) * sin(p.y * 7.0));
  b = smin(b, fa, 0.2);
  // masonry courses and weathering
  b += 0.012 * smoothstep(0.93, 1.0, fract(p.y * 1.55));
  b += 0.02 * sin(p.x * 7.0) * sin(p.y * 9.0 + 1.0) * sin(p.z * 8.0);
  var res = opU(vec2f(dped * S, 3.0), vec2f(b * S, 4.0));
  // gilded crown
  let ph = p - vec3f(0.0, 8.72, 0.0);
  var g = max(abs(length(ph.xz) - 0.58) - 0.05, abs(ph.y - 0.4) - 0.1);
  let sec = TAU / 9.0;
  let ia = round(atan2(ph.z, ph.x) / sec) * sec;
  let cs = cos(ia); let sn = sin(ia);
  let pk = vec3f(cs * ph.x + sn * ph.z, ph.y, -sn * ph.x + cs * ph.z);
  g = min(g, sdCapsule(pk, vec3f(0.58, 0.45, 0.0), vec3f(0.95, 1.3, 0.0), 0.05 - 0.03 * clamp((pk.y - 0.45) / 0.85, 0.0, 1.0)));
  // trident
  let pt = p - vec3f(-2.0, 0.0, 1.85);
  g = min(g, sdCapsule(pt, vec3f(0.0, 0.0, 0.0), vec3f(0.0, 9.9, 0.0), 0.11));
  g = min(g, sdCapsule(pt, vec3f(-0.62, 9.9, 0.0), vec3f(0.62, 9.9, 0.0), 0.1));
  g = min(g, sdCapsule(vec3f(abs(pt.x) - 0.62, pt.y, pt.z), vec3f(0.0, 9.9, 0.0), vec3f(0.06, 10.75, 0.0), 0.085));
  g = min(g, sdCapsule(pt, vec3f(0.0, 9.9, 0.0), vec3f(0.0, 11.0, 0.0), 0.095));
  res = opU(res, vec2f(g * S, 7.0));
  return res;
}

// ---------- the whole world; returns (distance, material) ----------
// everything that stands on the sea bed, except the natural rock that is blended into it
fn objects(p: vec3f, pf: vec3f, ha: f32) -> vec2f {
  var res = vec2f(sdCoral(p, ha), 9.0);
  res = opU(res, sdTholos(pf));
  res = opU(res, vec2f(sdAvenue(pf), 3.0));
  res = opU(res, vec2f(sdGate(pf), 6.0));
  res = opU(res, vec2f(min(min(sdDebris(pf), sdZiggurat(pf)), sdFallenHead(pf)), 3.0));
  res = opU(res, sdColossus(pf - vec3f(0.0, 4.9, -52.0)));
  res = opU(res, vec2f(sdCrystals(pf), 8.0));
  res = opU(res, vec2f(sdWreck(pf), 10.0));
  res = opU(res, vec2f(sdWhaleTail(pf), 11.0));
  return res;
}
fn rockA(p: vec3f) -> f32 {
  let w = (p - RMIN) / RSIZE;
  if (any(w < vec3f(0.006)) || any(w > vec3f(0.994))) { return 60.0; }
  return textureSampleLevel(rockTex, lin, w.xzy, 0.0).r;
}
@fragment fn fsBakeRock(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let pf = vec3f(RMIN.x + fc.x * 0.5, u.camPos.y - FLOOR, RMIN.z + fc.y * 0.5);
  return vec4f(clamp(min(sdArch(pf), sdCaveRock(pf)), -6.0, 40.0), 0.0, 0.0, 1.0);
}
// sea bed and natural rock from the bakes, the built things exactly
fn map(p: vec3f) -> vec2f {
  let tr = terrA(p);
  return opU(vec2f(smin(tr.x, rockA(p), 2.8), 1.0), objects(p, p - vec3f(0.0, FLOOR, 0.0), tr.y));
}
// the exact model, for normals
fn mapN(p: vec3f) -> vec2f {
  let pf = p - vec3f(0.0, FLOOR, 0.0);
  let tr = sdTerrain(p);
  return opU(vec2f(smin(tr.x, min(sdArch(pf), sdCaveRock(pf)), 2.8), 1.0), objects(p, pf, tr.y));
}

// the same field, read from the baked volume wherever the nearest surface is more than a voxel or two away:
// most march steps then cost one texture fetch, and the full model is only evaluated close to what it describes
fn coarse(p: vec3f) -> f32 {
  let w = (p - VMIN) / VSIZE;
  if (any(w < vec3f(0.004)) || any(w > vec3f(0.996))) { return 60.0; }
  return textureSampleLevel(sdfTex, lin, w.xzy, 0.0).r - 1.3;
}
fn mapA(p: vec3f) -> vec2f {
  let tr = terrA(p);
  let d1 = smin(tr.x, rockA(p), 2.8);
  let dO = coarse(p);
  if (dO > 0.9) { return vec2f(min(d1, dO), 1.0); }
  return opU(vec2f(d1, 1.0), objects(p, p - vec3f(0.0, FLOOR, 0.0), tr.y));
}
@fragment fn fsBake(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let p = vec3f(VMIN.x + fc.x * VOX, u.camPos.y, VMIN.z + fc.y * VOX);
  return vec4f(clamp(objects(p, p - vec3f(0.0, FLOOR, 0.0), sdTerrain(p).y).x, -8.0, 90.0), 0.0, 0.0, 1.0);
}

// on the open sea bed, away from rock and from anything built, the baked slope is the normal
fn calcNormal(p: vec3f, t: f32, m: f32) -> vec3f {
  if (m < 1.5 && p.y < -11.0 && rockA(p) > 3.3) {
    let s = textureSampleLevel(hTex, lin, p.xz / 480.0 + 0.5, 0.0);
    return normalize(vec3f(-s.g, 1.0, -s.b));
  }
  let e = vec2f(1.0, -1.0) * 0.5773 * clamp(0.0012 * t, 0.003, 0.15);
  return normalize(e.xyy * mapN(p + e.xyy).x + e.yyx * mapN(p + e.yyx).x + e.yxy * mapN(p + e.yxy).x + e.xxx * mapN(p + e.xxx).x);
}
// penumbrae are estimated only from the sea bed, the rock and built surfaces that are actually near the ray:
// the conservative distances of the volume and of the bounding shapes would cast soft shadows of their own
fn softShadow(ro: vec3f, n: i32) -> f32 {
  var res = 1.0; var t = 0.2;
  let tmax = min(70.0, (-12.5 - ro.y) / SUN.y);      // nothing stands above this, and the bed bake ends there
  for (var i = 0; i < n; i++) {
    let p = ro + SUN * t;
    let tr = terrA(p);
    let d1 = smin(tr.x, rockA(p), 2.8);
    let dO = coarse(p);
    var h = min(d1, dO); var pen = d1;
    if (dO <= 0.9) {
      let o = objects(p, p - vec3f(0.0, FLOOR, 0.0), tr.y).x;
      h = min(d1, o);
      if (o < 1.6) { pen = min(pen, o); }
    }
    res = min(res, 7.0 * pen / t);
    t += clamp(h, 0.2, 5.0);
    if (res < 0.01 || t > tmax) { break; }
  }
  res = clamp(res, 0.0, 1.0);
  return res * res * (3.0 - 2.0 * res);
}
// occlusion wants true distances: the height above the bed, the rock field undone from its step factor
fn calcAO(p: vec3f, n: vec3f) -> f32 {
  var occ = 0.0; var sca = 1.0;
  for (var i = 0; i < 5; i++) {
    let h = 0.06 + 0.42 * f32(i) * f32(i) * 0.25 + 0.3 * f32(i);
    let q = p + n * h;
    let tr = terrA(q);
    var d = min(tr.y * 0.92, rockA(q) * 1.45);
    if (coarse(q) <= 2.8) { d = min(d, objects(q, q - vec3f(0.0, FLOOR, 0.0), tr.y).x); }
    occ += max(h - d, 0.0) * sca;
    sca *= 0.72;
  }
  return clamp(1.0 - 0.5 * occ, 0.0, 1.0);
}

// ---------- water optics ----------
fn sunAt(depth: f32) -> vec3f { return SUNE * exp(-KD * (depth / SUN.y)); }
fn ambAt(depth: f32) -> vec3f { return AMBE * exp(-KD * depth); }
// The refraction pattern of the wavy surface is drawn once per frame into two tiling textures (sharp for surfaces, soft for
// the water volume). The same pattern lights the sea bed and the shafts above it, so the caustics sit at the feet of the beams.
fn swell(q: vec2f) -> f32 { return 0.45 + 2.75 * textureSampleLevel(cauLo, rep, mat2x2f(0.62, 0.78, -0.78, 0.62) * q / 83.0 + vec2f(0.31, 0.17), 0.0).r; }
fn shafts(q: vec2f) -> f32 { return 0.22 + 3.6 * textureSampleLevel(cauLo, rep, q / 29.0, 0.0).r * swell(q); }
fn caustic(q: vec2f) -> vec3f {
  let a = q / 12.0;
  let o = vec2f(0.0028, 0.0016);                    // the three colours focus a few centimetres apart
  let c1 = vec3f(textureSampleLevel(cauTex, rep, a + o, 0.0).r, textureSampleLevel(cauTex, rep, a, 0.0).r, textureSampleLevel(cauTex, rep, a - o, 0.0).r);
  let c2 = textureSampleLevel(cauTex, rep, mat2x2f(0.80, -0.60, 0.60, 0.80) * q / 19.0 + vec2f(0.53, 0.11), 0.0).r;
  let c = 0.62 * c1 + 0.38 * c2;
  return (0.26 + 3.1 * c + 2.2 * c * c) * mix(0.7, swell(q), 0.5);
}
fn shadowMap(q: vec2f, sl: f32) -> f32 {
  let uv = (q - u.smap.xy) * u.smap.w + 0.5;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) { return 1.0; }
  let th = textureSampleLevel(smapTex, lin, uv, 0.0).r;
  return smoothstep(-1.2, 0.2, th - sl);
}
fn waveH(q: vec2f, time: f32) -> f32 {
  return snoise(q * 0.07 + vec2f(time * 0.05, time * 0.035)) * 0.7 + snoise(q * 0.19 - vec2f(time * 0.07, -time * 0.05)) * 0.28
       + snoise(q * 0.47 + vec2f(-time * 0.09, time * 0.11)) * 0.09;
}
// the sea surface seen from below: Snell's window with total internal reflection outside it
fn surfaceCol(ps: vec3f, rd: vec3f, time: f32) -> vec3f {
  let e = 0.35;
  let h0 = waveH(ps.xz, time);
  let n = normalize(vec3f(-(waveH(ps.xz + vec2f(e, 0.0), time) - h0) / e * 0.55, 1.0, -(waveH(ps.xz + vec2f(0.0, e), time) - h0) / e * 0.55));
  let ci = clamp(dot(rd, n), 0.0, 1.0);
  let kk = 1.0 - 1.7689 * (1.0 - ci * ci);
  let win = smoothstep(0.0, 0.16, kk);
  let tir = ambAt(6.0) * 0.20 + vec3f(0.0, 0.03, 0.05);
  let r = normalize(refract(rd, -n, 1.33) + vec3f(0.0, 1e-4, 0.0));
  let fr = 0.02 + 0.98 * pow(1.0 - ci, 5.0);
  let sd = max(dot(r, SUNAIR), 0.0);
  var sky = mix(vec3f(0.72, 0.88, 1.0), vec3f(0.30, 0.58, 0.98), clamp(r.y, 0.0, 1.0)) * 2.6;
  sky += vec3f(1.0, 0.95, 0.85) * (pow(sd, 900.0) * 160.0 + pow(sd, 60.0) * 6.0 + pow(sd, 8.0) * 1.2);
  return mix(tir, mix(sky, tir, fr), win);
}

// ---------- materials ----------
fn bumpN(p: vec3f, n: vec3f, sc: f32, st: f32) -> vec3f {
  let g = textureSampleLevel(nTex, rep, p * (sc * 0.0625), 0.0).yzw;
  return normalize(n - st * (g - n * dot(g, n)));
}
fn glyph(q: vec2f) -> f32 {
  let id = floor(q); let f = fract(q) - 0.5; let h = hash21(id + 17.0);
  let ax = abs(f);
  var g = 0.0;
  if (h > 0.25) { g = max(g, step(ax.x, 0.05) * step(ax.y, 0.34)); }
  if (fract(h * 7.0) > 0.4) { g = max(g, step(ax.y, 0.05) * step(ax.x, 0.34)); }
  if (fract(h * 13.0) > 0.5) { g = max(g, step(abs(length(f) - 0.25), 0.04)); }
  if (fract(h * 29.0) > 0.6) { g = max(g, step(abs(ax.x - ax.y), 0.05) * step(max(ax.x, ax.y), 0.34)); }
  return g;
}
fn crackle(p: vec3f) -> f32 {
  let ip = floor(p); let fp = fract(p);
  var f1 = 9.0; var f2 = 9.0;
  for (var k = -1; k <= 1; k++) { for (var j = -1; j <= 1; j++) { for (var i = -1; i <= 1; i++) {
    let g = vec3f(f32(i), f32(j), f32(k));
    let c = ip + g;
    let d = length(g + vec3f(hash31(c), hash31(c + 17.3), hash31(c + 41.7)) - fp);
    if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) { f2 = d; }
  } } }
  return 1.0 - smoothstep(0.0, 0.06, f2 - f1);
}
fn weather(alb0: vec3f, n: vec3f, nz: f32, nz2: f32, hgt: f32, streak: f32) -> vec3f {
  var a = mix(alb0 * 0.58, alb0, smoothstep(0.28, 0.62, nz));
  a = mix(a, a * vec3f(0.62, 0.80, 0.72), streak);
  let algae = smoothstep(0.46, 0.70, nz2) * (1.0 - smoothstep(1.0, 16.0, hgt)) * 0.6;
  a = mix(a, vec3f(0.22, 0.34, 0.20), algae);
  let dep = smoothstep(0.72, 0.95, n.y) * smoothstep(0.30, 0.55, nz);
  return mix(a, vec3f(0.74, 0.68, 0.54), dep * 0.65);
}

fn shade(pos: vec3f, n0: vec3f, rd: vec3f, m: f32, t: f32, time: f32) -> vec3f {
  var n = n0;
  var alb = vec3f(0.5);
  var emi = vec3f(0.0);
  var spec = 0.03; var gloss = 14.0;
  let pf = pos - vec3f(0.0, FLOOR, 0.0);
  let nz = fbm3(pos * 0.33);
  let nz2 = fbm3(pos * 1.6 + vec3f(5.0));
  let streak = smoothstep(0.5, 0.75, fbm3(vec3f(pos.x * 0.9, pos.y * 0.07, pos.z * 0.9)));
  let detail = 1.0 - smoothstep(60.0, 140.0, t);
  if (m < 1.5) {
    let rock = max(1.0 - smoothstep(0.60, 0.86, n0.y), smoothstep(0.05, 0.3, textureSampleLevel(auxTex, lin, pos.xz / 480.0 + 0.5, 0.0).r));
    let w = pos.xz + 1.6 * vec2f(snoise(pos.xz * 0.05), snoise(pos.xz * 0.05 + 9.0));
    let ph = w.x * 4.6 + sin(w.y * 0.9) * 1.5;
    let rg = cos(ph) * 0.30 * detail * (0.4 + 0.6 * smoothstep(-0.2, 0.5, snoise(pos.xz * 0.02 + 4.0)));
    let ns = normalize(n0 + vec3f(rg, 0.0, rg * 0.35));
    let nr = bumpN(pos, n0, 0.8, 0.55 * detail);
    n = normalize(mix(ns, nr, rock));
    let sand = vec3f(0.69, 0.62, 0.49) * (0.80 + 0.3 * nz2) * (0.92 + 0.08 * sin(ph)) * (0.9 + 0.2 * hash21(floor(pos.xz * 30.0)) * detail);
    var rk = mix(vec3f(0.27, 0.26, 0.25), vec3f(0.50, 0.47, 0.41), nz);
    rk = mix(rk, vec3f(0.20, 0.32, 0.19), smoothstep(0.42, 0.72, nz2) * 0.6);
    rk = mix(rk, vec3f(0.55, 0.30, 0.34), smoothstep(0.62, 0.8, fbm3(pos * 0.6 + vec3f(40.0))) * 0.5);
    alb = mix(sand, rk, rock);
    let dc = length(pos - CAVE_C);
    if (dc < 26.0) {
      let v = 1.0 - abs(fbm3(pos * 0.45 + vec3f(3.0)) * 2.0 - 1.0);
      emi = PURPLE * pow(v, 40.0) * 2.0 * smoothstep(0.42, 0.6, nz) * (1.0 - smoothstep(15.0, 25.0, dc)) * (0.7 + 0.3 * sin(time * 0.7 + pos.y * 0.6));
    }
  } else if (m < 3.5) {
    n = bumpN(pos, n0, 2.2, 0.16 * detail);
    alb = weather(vec3f(0.80, 0.77, 0.70), n0, nz, nz2, pf.y, streak);
    alb *= 1.0 - 0.4 * crackle(pos * 0.4) * detail;
    spec = 0.05;
  } else if (m < 4.5) {
    n = bumpN(pos, n0, 0.9, 0.25 * detail);
    let pat = clamp(streak * 0.55 + smoothstep(0.42, 0.7, nz) * 0.5, 0.0, 1.0);
    alb = mix(vec3f(0.22, 0.15, 0.075), vec3f(0.11, 0.31, 0.27), pat);
    alb = mix(alb, vec3f(0.50, 0.55, 0.50), smoothstep(0.58, 0.78, nz2) * 0.3);
    alb = mix(alb, vec3f(0.74, 0.68, 0.54), smoothstep(0.75, 0.95, n0.y) * 0.5);
    spec = 0.22; gloss = 22.0;
  } else if (m < 5.5) {
    let po = pf - vec3f(0.0, 3.6, 0.0);
    let pq = rot(0.7854) * po.xz;
    let nq = rot(0.7854) * n0.xz;
    let face = select(pq.x, pq.y, abs(nq.x) > abs(nq.y));
    let g = glyph(vec2f(face * 1.7 + 0.5, po.y * 1.05)) * step(abs(face), 0.6) * step(po.y, 10.2);
    let pulse = 0.75 + 0.25 * sin(time * 0.6 - po.y * 0.5);
    alb = vec3f(0.07, 0.09, 0.11);
    emi = RUNE * (g * 7.0 * pulse + 0.25);
    spec = 0.25; gloss = 50.0;
  } else if (m < 6.5) {
    let q = gateLocal(pf);
    let cx = length(q.xy) - 15.5;
    n = bumpN(pos, n0, 1.2, 0.22 * detail);
    alb = weather(vec3f(0.40, 0.42, 0.44), n0, nz, nz2, pf.y - 4.0, streak);
    if (abs(cx) < 0.5 && abs(q.z) > 1.35) {
      let a = atan2(q.y, q.x);
      let g = glyph(vec2f(a * 13.0, cx * 1.1 + 0.5));
      let pulse = 0.7 + 0.3 * sin(time * 0.5 + a * 3.0);
      emi = RUNE * (g * 5.0 * pulse + 0.12);
      alb *= 0.4;
    }
  } else if (m < 7.5) {
    n = bumpN(pos, n0, 1.4, 0.15 * detail);
    alb = mix(vec3f(0.85, 0.58, 0.20), vec3f(0.22, 0.42, 0.36), smoothstep(0.45, 0.7, nz2) * 0.7);
    spec = 0.5; gloss = 36.0;
  } else if (m < 8.5) {
    let fr = pow(1.0 - max(dot(n0, -rd), 0.0), 2.0);
    alb = vec3f(0.10, 0.04, 0.16);
    emi = PURPLE * (0.35 + 2.2 * fr + 0.9 * smoothstep(0.35, 0.75, nz2)) * (0.8 + 0.2 * sin(time * 0.8 + pos.y));
    spec = 0.6; gloss = 60.0;
  } else if (m < 9.5) {
    let h = hash21(floor(pos.xz / 5.0) + 3.0);
    let k = fract(h * 91.0);
    n = bumpN(pos, n0, 5.0, 0.3 * detail);
    alb = vec3f(0.95, 0.38, 0.45);
    if (k > 0.8) { alb = vec3f(0.85, 0.85, 0.30); } else if (k > 0.6) { alb = vec3f(0.62, 0.38, 0.92); }
    else if (k > 0.4) { alb = vec3f(1.0, 0.52, 0.16); } else if (k > 0.2) { alb = vec3f(0.30, 0.80, 0.72); }
    alb *= 0.55 + 0.6 * nz2;
  } else if (m < 10.5) {
    let q = wreckLocal(pf);
    n = bumpN(pos, n0, 3.0, 0.3 * detail);
    let seam = smoothstep(0.40, 0.5, abs(fract(q.y * 1.6 + 0.15 * sin(q.x * 0.3)) - 0.5));
    alb = mix(vec3f(0.34, 0.24, 0.15), vec3f(0.17, 0.12, 0.08), nz) * (1.0 - 0.5 * seam);
    alb *= 0.75 + 0.5 * fbm3(vec3f(q.x * 0.5, q.y * 6.0, q.z * 6.0));
    alb = mix(alb, vec3f(0.20, 0.34, 0.22), smoothstep(0.42, 0.7, nz2) * 0.6);
    alb = mix(alb, vec3f(0.74, 0.68, 0.54), smoothstep(0.75, 0.95, n0.y) * 0.5);
  } else {
    n = bumpN(pos, n0, 1.0, 0.3 * detail);
    alb = weather(vec3f(0.36, 0.38, 0.41), n0, nz, nz2, pf.y - 8.0, streak);
    alb *= 1.0 - 0.45 * crackle(pos * 0.3) * detail;
    spec = 0.08;
  }
  let depth = max(-pos.y, 0.0);
  let sl = depth / SUN.y;
  let qs = pos.xz + SUN.xz * sl;
  let sunL = sunAt(depth);
  let amb = ambAt(depth) * caveSky(pos);
  let ndl = max(dot(n, SUN), 0.0);
  var sh = 0.0;
  if (ndl > 0.0) { sh = softShadow(pos + n0 * 0.06, i32(u.quality.z)); }
  // the kelp canopy is not in the distance field: dapple the ground under it
  let dk = length(pos.xz - vec2f(112.0, 28.0));
  sh *= 1.0 - 0.5 * (1.0 - smoothstep(30.0, 50.0, dk)) * smoothstep(-0.3, 0.5, snoise(pos.xz * 0.13 + vec2f(time * 0.05, 0.0)));
  let ca = mix(vec3f(1.0), caustic(qs), 0.9);
  let ao = calcAO(pos, n0);
  var lit = sunL * ndl * sh * ca * 0.66;
  lit += amb * (0.50 + 0.50 * n.y) * ao * 0.50;
  lit += vec3f(0.80, 0.72, 0.56) * sunL * (0.5 - 0.5 * n.y) * ao * 0.085 * caveSky(pos);       // light bounced off the sand
  lit += amb * 0.06 * ao;
  // the obelisk as a light source
  let pl = (OB_A + OB_B) * 0.5 - pos;
  let dl = length(pl);
  lit += RUNE * max(dot(n, pl / dl), 0.0) * ao * 60.0 / (30.0 + dl * dl);
  let pcv = CAVE_C - pos;
  let dcv = length(pcv);
  if (dcv < 34.0) {
    let vis = smoothstep(-0.4, 1.2, mapA(pos + pcv * 0.5).x);
    lit += PURPLE * (0.25 + 0.75 * max(dot(n, pcv / dcv), 0.0)) * ao * vis * (1.0 - smoothstep(22.0, 34.0, dcv)) * 110.0 / (30.0 + dcv * dcv);
  }
  var col = alb * lit + emi;
  let hv = normalize(SUN - rd);
  col += sunL * sh * ca * spec * pow(max(dot(n, hv), 0.0), gloss) * 0.35;
  col += amb * spec * pow(1.0 - max(dot(n, -rd), 0.0), 3.0) * ao * 0.6;
  return col;
}

fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }
fn hg(c: f32, g: f32) -> f32 { let g2 = g * g; return (1.0 - g2) / pow(1.0 + g2 - 2.0 * g * c, 1.5); }

struct FOut { @location(0) col: vec4f, @builtin(frag_depth) depth: f32 };
@fragment fn fs(@builtin(position) fc: vec4f) -> FOut {
  let px = fc.xy + u.jitter.xy;
  let ndc = vec2f(px.x * u.res.z * 2.0 - 1.0, 1.0 - px.y * u.res.w * 2.0);
  let ro = u.camPos.xyz;
  let rd = normalize(u.camFwd.xyz + u.camRight.xyz * (ndc.x * u.camRight.w) + u.camUp.xyz * (ndc.y * u.camUp.w));
  let time = u.camPos.w;

  var tSurf = 1e5;
  if (rd.y > 0.0005) { tSurf = -ro.y / rd.y; }
  let tLim = min(TMAX, tSurf);
  var t = 0.05; var m = 0.0; var hit = false;
  let steps = i32(u.quality.x);
  for (var i = 0; i < steps; i++) {
    let h = mapA(ro + rd * t);
    if (h.x < 0.0007 * t + 0.0015) { hit = true; m = h.y; break; }
    t += h.x * 0.88;
    if (t > tLim) { break; }
  }
  if (!hit && t < tLim) { hit = true; m = map(ro + rd * t).y; }      // out of steps along a silhouette: shade where the ray stopped
  var col = vec3f(0.0);
  var tEnd = tLim;
  if (hit && t < tLim) {
    let pos = ro + rd * t;
    col = shade(pos, calcNormal(pos, t, m), rd, m, t, time);
    tEnd = t;
  } else if (tSurf < TMAX) {
    col = surfaceCol(ro + rd * tSurf, rd, time);
  } else {
    let dEnd = max(-(ro.y + rd.y * TMAX), 0.0);
    col = SIG_S * (ambAt(dEnd) + sunAt(dEnd) * 0.6) / EXT;
  }
  col *= exp(-EXT * tEnd);

  // single scattering along the view ray: shadowed, caustic-modulated sunlight plus ambient and rune glow
  let nv = i32(u.quality.y);
  let k = 0.014;
  let c = 1.0 - exp(-k * tEnd);
  let jit = fract(ign(fc.xy) + u.camFwd.w * 0.61803399);
  let ph = 0.5 * hg(dot(rd, SUN), 0.6) + 0.5;
  var scat = vec3f(0.0);
  for (var i = 0; i < nv; i++) {
    let x = (f32(i) + jit) / f32(nv);
    let s = -log(1.0 - x * c) / k;
    let ds = c / (f32(nv) * k * (1.0 - x * c));
    let ps = ro + rd * s;
    let dp = max(-ps.y, 0.0);
    let sl = dp / SUN.y;
    let qs = ps.xz + SUN.xz * sl;
    var li = sunAt(dp) * (shadowMap(qs, sl) * shafts(qs) * ph) + ambAt(dp) * caveSky(ps);
    li *= SIG_S;
    let pa = ps - OB_A; let ba = OB_B - OB_A;
    let dq = pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    li += RUNE * (0.05 / (1.5 + dot(dq, dq)));
    let dv = ps - CAVE_C;
    let d2 = dot(dv, dv);
    li += PURPLE * (0.010 / (1.0 + 0.03 * d2)) * (1.0 - smoothstep(110.0, 300.0, d2));
    scat += exp(-EXT * s) * li * ds;
  }
  col += scat;
  var o: FOut;
  o.col = vec4f(col, tEnd);
  o.depth = ZA * (1.0 - ZNEAR / max(tEnd * dot(rd, u.camFwd.xyz), 0.11));
  return o;
}

// sun-space depth of the first occluder under each point of the sea surface
@fragment fn fsShadow(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let uv = fc.xy / u.misc.x;
  let q = u.smap.xy + (uv - 0.5) * u.smap.z;
  let ro = vec3f(q.x, 0.0, q.y);
  var t = 3.0;
  for (var i = 0; i < 200; i++) {
    let h = mapA(ro - SUN * t).x;
    if (h < 0.03) { break; }
    t += h * 0.9;
    if (t > 150.0) { break; }
  }
  return vec4f(t, 0.0, 0.0, 1.0);
}
`;

/* =====================================================================================
   WGSL — rasterised life: fish, mantas, the leviathan, kelp, drifting particles
   (appended to the scene module, so it shares the water optics and the shadow map)
   ===================================================================================== */
const WGSL_LIFE = /* wgsl */`
fn toClip(wp: vec3f) -> vec4f {
  let v = wp - u.camPos.xyz;
  let z = dot(v, u.camFwd.xyz);
  let x = dot(v, u.camRight.xyz) / u.camRight.w;
  let y = dot(v, u.camUp.xyz) / u.camUp.w;
  return vec4f(x - u.jitter.x * 2.0 * u.res.z * z, y + u.jitter.y * 2.0 * u.res.w * z, ZA * (z - ZNEAR), z);
}
fn sunLight(wpos: vec3f, time: f32) -> vec3f {
  let depth = max(-wpos.y, 0.0);
  let sl = depth / SUN.y;
  let qs = wpos.xz + SUN.xz * sl;
  return sunAt(depth) * shadowMap(qs, sl) * mix(vec3f(1.0), caustic(qs), 0.7);
}
// extinction plus the in-scattering of a uniform medium between the eye and the surface
fn fogged(col: vec3f, wpos: vec3f) -> vec4f {
  let v = wpos - u.camPos.xyz;
  let t = length(v);
  let dm = max(-(u.camPos.y + wpos.y) * 0.5, 0.0);
  let ph = 0.5 * hg(dot(v / t, SUN), 0.6) + 0.5;
  let tr = exp(-EXT * t);
  return vec4f(col * tr + SIG_S * (ambAt(dm) + sunAt(dm) * (0.8 * ph)) / EXT * (1.0 - tr), t);
}

struct LIn { @location(0) pos: vec3f, @location(1) nrm: vec3f, @location(2) uvp: vec3f, @location(3) ia: vec4f, @location(4) ib: vec4f };
struct LOut { @builtin(position) clip: vec4f, @location(0) wpos: vec3f, @location(1) nrm: vec3f, @location(2) lp: vec3f, @location(3) info: vec4f };
// every animal follows a closed loop: ia = centre, radius; ib = phase, angular speed, size, school id + seed
fn pathPos(ia: vec4f, ib: vec4f, t: f32) -> vec3f {
  let sid = floor(ib.w);
  let ang = ib.x + ib.y * t;
  let e = 0.6 + 0.4 * fract(sid * 0.37);
  let p = ia.xyz + vec3f(cos(ang) * ia.w, sin(ang * 2.0 + sid * 1.7) * ia.w * 0.10, sin(ang) * ia.w * e);
  let s = fract(ib.w) * 100.0;
  return p + vec3f(sin(t * 0.31 + s), 0.5 * sin(t * 0.23 + s * 1.7), cos(t * 0.27 + s * 2.3)) * min(ia.w * 0.05, 1.0);
}
@vertex fn vsLife(v: LIn) -> LOut {
  let t = u.camPos.w;
  let p0 = pathPos(v.ia, v.ib, t);
  let size = v.ib.z; let part = v.uvp.z;
  var fw = normalize(pathPos(v.ia, v.ib, t + 0.25) - p0);
  if (part > 39.5) { fw = normalize(vec3f(fw.x * 0.3, 1.0, fw.z * 0.3)); }           // jellyfish drift bell-up
  let rt = normalize(cross(fw, select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), part > 39.5)));
  let up = cross(rt, fw);
  var lp = v.pos; var n = v.nrm;
  let s = fract(v.ib.w) * 100.0;
  let k = 0.5 - lp.x;
  if (part < 9.5) {
    lp.z += 0.10 * k * k * sin(t * 7.0 / (0.5 + size) + s + lp.x * 5.0);
  } else if (part < 19.5) {
    let sp = abs(lp.z) / 0.62;
    let a = t * 1.5 + s - sp * 1.6;
    let A = 0.2 * pow(sp, 1.5);
    lp.y += A * sin(a);
    let dy = (0.3 * sqrt(sp) * sin(a) - 1.6 * A * cos(a)) / 0.62 * sign(lp.z);
    n = normalize(vec3f(n.x, n.y, n.z - dy * n.y));
  } else if (part < 29.5) {
    lp.y += 0.05 * k * k * sin(t * 0.9 + s + lp.x * 4.0);
  } else if (part < 39.5) {
    if (part > 30.5) { lp.y += max(abs(lp.z) - 0.3, 0.0) * 0.5 * sin(t * 1.5 + s + select(0.0, 1.2, lp.x < 0.0)); }      // flippers
  } else {
    let pulse = sin(t * 1.7 + s);
    if (part < 40.5) {
      let sq = 1.0 - 0.17 * pulse * (1.0 - lp.x * 2.0);
      lp = vec3f(lp.x + 0.04 * pulse, lp.y * sq, lp.z * sq);
    } else {
      let d = -lp.x;
      let a = t * 1.3 + s + d * 4.0 + v.uvp.y * 6.0 - pulse * 0.6;
      lp = vec3f(lp.x + 0.04 * pulse, lp.y * (1.0 - 0.17 * pulse) + 0.07 * d * sin(a), lp.z * (1.0 - 0.17 * pulse) + 0.07 * d * cos(a * 0.9));
    }
  }
  var o: LOut;
  o.wpos = p0 + (fw * lp.x + up * lp.y + rt * lp.z) * size;
  o.nrm = fw * n.x + up * n.y + rt * n.z;
  o.lp = v.pos;
  o.info = vec4f(part, s, floor(v.ib.w), v.uvp.y);
  o.clip = toClip(o.wpos);
  return o;
}
@fragment fn fsLife(i: LOut) -> @location(0) vec4f {
  let time = u.camPos.w;
  let rd = normalize(i.wpos - u.camPos.xyz);
  var n = normalize(i.nrm);
  if (dot(n, rd) > 0.0) { n = -n; }
  let part = i.info.x; let lp = i.lp;
  var alb = vec3f(0.5); var spec = 0.35;
  if (part < 9.5) {
    let kind = i32(i.info.z) % 6;
    var back = vec3f(0.08, 0.20, 0.34); var side = vec3f(0.74, 0.82, 0.88); var acc = vec3f(0.98, 0.82, 0.18);
    if (kind == 1) { back = vec3f(0.98, 0.42, 0.06); side = back; acc = vec3f(0.95); }
    else if (kind == 2) { back = vec3f(0.98, 0.80, 0.10); side = back; acc = vec3f(0.12, 0.2, 0.6); }
    else if (kind == 3) { back = vec3f(0.05, 0.20, 0.70); side = vec3f(0.14, 0.45, 0.95); }
    else if (kind == 4) { back = vec3f(0.92, 0.28, 0.36); side = vec3f(1.0, 0.56, 0.52); acc = vec3f(0.6, 0.3, 0.9); }
    else if (kind == 5) { back = vec3f(0.16, 0.20, 0.24); side = vec3f(0.42, 0.47, 0.52); acc = vec3f(0.30, 0.34, 0.38); }        // sharks
    let v = clamp(lp.y / 0.26 + 0.5, 0.0, 1.0);
    alb = mix(side, back, smoothstep(0.5, 0.82, v));
    alb = mix(vec3f(0.92), alb, smoothstep(0.02, 0.36, v));
    if (kind == 1) { alb = mix(alb, acc, smoothstep(0.38, 0.42, abs(fract(lp.x * 2.6 + 0.2) - 0.5))); }
    else { alb = mix(alb, acc, (1.0 - smoothstep(0.01, 0.035, abs(lp.y - 0.015))) * step(lp.x, 0.3)); }
    if (part > 0.5) { alb = mix(alb, acc, 0.55); }
    alb *= 1.0 - (1.0 - smoothstep(0.018, 0.03, length(lp.xy - vec2f(0.385, 0.035))));
    spec = 0.6;
  } else if (part < 19.5) {
    let sp = abs(lp.z) / 0.62;
    if (i.info.w > 0.5) {
      alb = vec3f(0.05, 0.065, 0.09);
      alb = mix(alb, vec3f(0.7), (1.0 - smoothstep(0.03, 0.06, length(vec2f(lp.x - 0.12, sp - 0.22) * vec2f(1.0, 0.35)))));
    } else {
      alb = vec3f(0.84, 0.86, 0.88);
      alb *= 1.0 - 0.8 * smoothstep(0.62, 0.7, snoise(vec2f(lp.x, lp.z) * 14.0 + i.info.y)) * (1.0 - smoothstep(-0.1, 0.1, lp.x));
      alb = mix(alb, vec3f(0.1), smoothstep(0.8, 1.0, sp));
    }
  } else if (part < 29.5) {
    let v = clamp(lp.y / 0.2 + 0.5, 0.0, 1.0);
    alb = mix(vec3f(0.42, 0.47, 0.52), vec3f(0.07, 0.10, 0.14), smoothstep(0.2, 0.6, v));
    alb *= 0.75 + 0.5 * snoise(lp.xy * 9.0) * snoise(lp.xz * 23.0);
    spec = 0.15;
  } else if (part < 39.5) {
    // sea turtle: scutes on the carapace, pale plastron, mottled head and flippers
    let sc = lp.xz * vec2f(6.0, 7.5) + vec2f(0.0, 0.5 * floor(lp.x * 6.0));
    let line = smoothstep(0.36, 0.48, max(abs(fract(sc.x) - 0.5), abs(fract(sc.y) - 0.5)));
    alb = mix(vec3f(0.34, 0.27, 0.11), vec3f(0.15, 0.13, 0.06), 0.5 + 0.5 * snoise(lp.xz * 9.0 + i.info.y)) * (1.0 - 0.55 * line);
    if (lp.y < -0.01) { alb = vec3f(0.72, 0.66, 0.44); }
    if (part > 30.5 || lp.x > 0.5) { alb = mix(vec3f(0.11, 0.11, 0.07), vec3f(0.55, 0.50, 0.32), smoothstep(0.25, 0.4, abs(snoise(lp.xz * 14.0)))); }
    spec = 0.25;
  } else {
    // jellyfish are drawn additively: a glassy bell that shows mostly at its rim, with dimmer tentacles
    let rim = pow(1.0 - abs(dot(n, rd)), 2.0);
    let tint = mix(vec3f(0.55, 0.80, 1.0), vec3f(1.0, 0.55, 0.85), fract(i.info.y * 0.37));
    let glow = select(0.10 + 0.9 * rim + 0.25 * smoothstep(0.7, 1.0, sin(atan2(lp.z, lp.y) * 8.0)) * (1.0 - smoothstep(0.0, 0.35, lp.x)), 0.22, part > 40.5);
    let li = ambAt(max(-i.wpos.y, 0.0)) * 0.9 + sunLight(i.wpos, time) * 0.5;
    return vec4f(tint * glow * li * exp(-EXT * length(i.wpos - u.camPos.xyz)), 0.0);
  }
  let sunL = sunLight(i.wpos, time);
  let amb = ambAt(max(-i.wpos.y, 0.0));
  var lit = sunL * (0.2 + 0.8 * max(dot(n, SUN), 0.0)) * 0.7 + amb * (0.55 + 0.45 * n.y) * 0.8;
  lit += vec3f(0.80, 0.72, 0.56) * sunAt(50.0) * (0.5 - 0.5 * n.y) * 0.08;
  var col = alb * lit + sunL * spec * pow(max(dot(n, normalize(SUN - rd)), 0.0), 24.0) * 0.4;
  return fogged(col, i.wpos);
}

struct KIn { @location(0) st: vec2f, @location(3) ia: vec4f, @location(4) ib: vec4f };
struct KOut { @builtin(position) clip: vec4f, @location(0) wpos: vec3f, @location(1) nrm: vec3f, @location(2) uv: vec3f, @location(3) seed: f32, @location(4) kind: f32 };
// ribbons: ia = root, height; ib = seed, half width, phase, kind (0 kelp frond, 1 blade of sea grass or red algae, 2 sea fan)
fn kelpPos(ia: vec4f, ib: vec4f, tt: f32, t: f32) -> vec3f {
  let h = ia.w; let s = ib.x * 50.0;
  let k = pow(tt, 1.4);
  var off = vec2f(0.85, 0.4) * (h * 0.13 * k) * (0.7 + 0.3 * sin(t * 0.21 + ib.z));
  let a1 = t * 0.55 + ib.z + tt * 2.6;
  off += vec2f(sin(a1), cos(a1 * 0.83 + s)) * (h * 0.03 * k + 0.2 * tt);
  off += vec2f(cos(tt * 9.0 + s), sin(tt * 9.0 + s)) * 0.3 * tt;
  return ia.xyz + vec3f(off.x, h * tt * (1.0 - 0.05 * k), off.y);
}
// grass leans with the surge, which travels across the meadow as a wave
fn grassPos(ia: vec4f, ib: vec4f, tt: f32, t: f32) -> vec3f {
  let h = ia.w; let s = ib.x * 50.0;
  let ph = t * 1.1 + ia.x * 0.21 + ia.z * 0.17;
  let bend = (0.22 + 0.2 * sin(ph) + 0.07 * sin(ph * 2.3 + s)) * h;
  let off = (vec2f(0.8, 0.6) * bend + vec2f(cos(s * 7.0), sin(s * 7.0)) * 0.3 * h) * tt * tt;
  return ia.xyz + vec3f(off.x, h * tt * (1.0 - 0.18 * tt * tt), off.y);
}
@vertex fn vsKelp(v: KIn) -> KOut {
  let t = u.camPos.w;
  let tt = v.st.y; let kind = v.ib.w;
  var c = vec3f(0.0); var tg = vec3f(0.0, 1.0, 0.0); var sd = vec3f(1.0, 0.0, 0.0); var w = v.ib.y;
  if (kind < 0.5) {
    c = kelpPos(v.ia, v.ib, tt, t);
    tg = normalize(kelpPos(v.ia, v.ib, tt + 0.02, t) - c);
    let tw = v.ib.x * 50.0 + tt * 4.5 + 0.5 * sin(t * 0.4 + v.ib.z + tt * 3.0);
    let s0 = vec3f(cos(tw), 0.0, sin(tw));
    sd = normalize(s0 - tg * dot(s0, tg));
    w = v.ib.y * (0.45 + 0.55 * sin(PI * min(tt * 1.1, 1.0))) * (1.0 - smoothstep(0.9, 1.0, tt));
  } else if (kind < 1.5) {
    c = grassPos(v.ia, v.ib, tt, t);
    tg = normalize(grassPos(v.ia, v.ib, tt + 0.05, t) - c);
    let a = v.ib.x * 350.0;
    sd = vec3f(-sin(a), 0.0, cos(a));
    // far blades are kept half a pixel wide so that the meadow does not sparkle
    w = max(v.ib.y * (1.0 - tt * tt * tt), length(c - u.camPos.xyz) * u.camUp.w * u.res.w * (1.0 - tt));
  } else {
    let a = v.ib.x * 19.0;
    sd = vec3f(cos(a), 0.0, sin(a));
    c = v.ia.xyz + vec3f(0.0, v.ia.w * tt, 0.0) + vec3f(-sin(a), 0.0, cos(a)) * (0.07 * v.ia.w * sin(t * 0.8 + v.ib.z + v.ia.x * 0.2) * tt * tt);
  }
  var o: KOut;
  o.wpos = c + sd * (v.st.x * w);
  o.nrm = cross(tg, sd);
  o.uv = vec3f(v.st.x, tt * v.ia.w, tt);
  o.seed = v.ib.x; o.kind = kind;
  o.clip = toClip(o.wpos);
  return o;
}
@fragment fn fsKelp(i: KOut) -> @location(0) vec4f {
  let x = i.uv.x; let ax = abs(x); let y = i.uv.y; let tt = i.uv.z;
  var alb = vec3f(0.0); var thru = vec3f(0.40, 0.36, 0.05); var shade = mix(0.4, 1.0, tt);
  if (i.kind < 0.5) {
    let fy = fract(y / 1.15 + select(0.0, 0.5, x > 0.0) + i.seed * 7.0);
    let hw = 0.36 * pow(max(sin(PI * pow(ax, 0.75)), 0.0), 0.8) + 0.03 * sin(ax * 30.0 + y * 3.0);
    let stipe = ax < 0.07;

    alb = mix(vec3f(0.06, 0.09, 0.015), vec3f(0.24, 0.20, 0.035), 0.5 + 0.5 * sin(y * 2.3 + i.seed * 40.0 + ax * 3.0));
    alb *= 0.7 + 0.6 * snoise(vec2f(x * 3.0 + i.seed * 20.0, y * 5.0)) * snoise(vec2f(x * 9.0, y * 1.3));
    alb *= 0.8 + 0.4 * smoothstep(0.0, 0.3, abs(abs(fy - 0.5) - 0.02));       // midrib
    if (stipe) { alb = vec3f(0.10, 0.08, 0.03); }
  } else if (i.kind < 1.5) {

const WGSL_TAA = /* wgsl */`

          textureSampleLevel(hist, lin, t12, 0.0).rgb * m + textureSampleLevel(hist, lin, vec2f(t3.x, t12.y), 0.0).rgb * d +

const WGSL_FINAL = /* wgsl */`

@group(0) @binding(5) var b3: texture_2d<f32>;

}
`;

  if (document.pointerLockElement !== canvas) return;
  cam.yaw += e.movementX * 0.0022;
  cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch - e.movementY * 0.0022));
});
function basis(yaw, pitch) {
  const cp = Math.cos(pitch), f = [Math.sin(yaw) * cp, Math.sin(pitch), -Math.cos(yaw) * cp];
  const r = [Math.cos(yaw), 0, Math.sin(yaw)];
  const up = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  return { f, r, up };
}
function updateCamera(dt) {
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 2.2);
    const k = fly.t * fly.t * (3 - 2 * fly.t), s = fly.s;
    for (let i = 0; i < 3; i++) cam.pos[i] = fly.p0[i] + (s.pos[i] - fly.p0[i]) * k;
    cam.yaw = fly.y0 + (s.yaw - fly.y0) * k; cam.pitch = fly.pi0 + (s.pitch - fly.pi0) * k;
    cam.vel = [0, 0, 0];
    if (fly.t >= 1) fly = null;
    return;
  }
  const { f, r } = basis(cam.yaw, cam.pitch);
  const ax = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0), az = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
  const ay = (keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0);
  const sp = keys.has('ShiftLeft') || keys.has('ShiftRight') ? 26 : 8;
  const want = [(f[0] * az + r[0] * ax) * sp, (f[1] * az + ay) * sp, (f[2] * az + r[2] * ax) * sp];
  const k = 1 - Math.exp(-dt * 4);
  for (let i = 0; i < 3; i++) { cam.vel[i] += (want[i] - cam.vel[i]) * k; cam.pos[i] += cam.vel[i] * dt; }
  const lim = Math.hypot(cam.pos[0], cam.pos[2]);
  if (lim > 230) { cam.pos[0] *= 230 / lim; cam.pos[2] *= 230 / lim; }
  cam.pos[1] = Math.min(-1.5, Math.max(groundH(cam.pos[0], cam.pos[2]) + 1.4, cam.pos[1]));
}

// ---------- frame ----------
const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
let prev = null, last = performance.now(), ema = 16.7, slow = 0, fast = 0, holdUntil = 0, raisedAt = -1e9, backoff = 6000, statT = 0;
const photoN = +(Q.get('photo') || 0);
let skipFrame = false;
document.addEventListener('visibilitychange', () => { skipFrame = true; });
window.__dbg = () => ({ tier, scale: SCALES[scaleIdx], ms: +ema.toFixed(1), rw, rh, pos: cam.pos.map(v => +v.toFixed(1)), frame });

function adapt(dtMs, now) {
  if (skipFrame) { skipFrame = false; return; }      // the first frame after the tab was hidden says nothing
  ema += (Math.min(dtMs, 400) - ema) * 0.08;
  if (CAP || frozen || cine || now < holdUntil) return;
  if (ema > 19.5) { slow++; fast = 0; } else if (ema < 17.3) { fast++; slow = 0; } else { slow = 0; fast = 0; }
  if (slow > (ema > 33 ? 8 : 30)) {
    if (now - raisedAt < 4000) backoff = Math.min(backoff * 2, 120000);
    // sharpness first: below 80 % the quality tier gives way before the resolution does
    if (scaleIdx > 2 || (scaleIdx > 0 && tier === 0)) scaleIdx = Math.max(tier === 0 ? 0 : 2, scaleIdx - (ema > 33 ? 2 : 1)); else if (tier > 0) { tier--; autoTier = tier; allocShadow(); }
    slow = 0; holdUntil = now + 700;
  } else if (fast > 150 && now - raisedAt > backoff) {
    if (scaleIdx < SCALES.length - 1) scaleIdx++; else if (tier < 2) { tier++; autoTier = tier; allocShadow(); scaleIdx = 2; }
    fast = 0; raisedAt = now; holdUntil = now + 1200;
  }
}

function render(now) {
  const dtMs = now - last; last = now;
  const dt = Math.min(dtMs / 1000, 0.1);
  adapt(dtMs, now);
  allocShadow(); allocTargets(false);
  if (!CAP) { updateCamera(dt); updateAudio(); }
  if (!frozen && !CAP) time += dt;
  const moved = prev && (Math.abs(prev.yaw - cam.yaw) + Math.abs(prev.pitch - cam.pitch) + Math.hypot(...cam.pos.map((v, i) => v - prev.pos[i])) > 1e-5);
  if (moved) accum = 0;
  const still = frozen || CAP;
  const { f, r, up } = basis(cam.yaw, cam.pitch);
  const th = 0.6, ta = th * cw / ch;
  if (!prev) prev = { pos: [...cam.pos], f, r, up, yaw: cam.yaw, pitch: cam.pitch };
  const q = Q.has('q') ? { ...TIERS[tier], ...Object.fromEntries(Q.get('q').split(',').map(s => s.split(':')).map(([k, v]) => [k, +v])) } : TIERS[tier];
  const j = (frame % 16) + 1;
  ud.set([...cam.pos, time, ...r, ta, ...up, th, ...f, frame % 4096], 0);
  ud.set([...prev.pos, 0, ...prev.r, ta, ...prev.up, th, ...prev.f, 0], 16);
  ud.set([rw, rh, 1 / rw, 1 / rh], 32);
  const alpha = !histValid ? 1 : still ? 1 / (accum + 1) : 0.1;
  ud.set([halton(still ? accum + 1 : j, 2) - 0.5, halton(still ? accum + 1 : j, 3) - 0.5, alpha, still ? 0 : 1], 36);
  ud.set([q.steps, q.vol, q.sh, +(Q.get('exp') || 0.60)], 40);
  // keep the sun-space shadow map centred near the camera
  const snap = SMAP_EXTENT / 8;
  const cx = Math.round(cam.pos[0] / snap) * snap, cz = Math.round(cam.pos[2] / snap) * snap;
  if (smapDirty || Math.abs(cam.pos[0] - smapCenter[0]) > SMAP_EXTENT * 0.2 || Math.abs(cam.pos[2] - smapCenter[1]) > SMAP_EXTENT * 0.2) {
    smapCenter = [cx, cz]; smapDirty = true;
  }
  ud.set([smapCenter[0], smapCenter[1], SMAP_EXTENT, 1 / SMAP_EXTENT], 44);
  ud.set([smapSize, cw, ch, cine || Q.has('dof') ? 1 : 0], 48);
  device.queue.writeBuffer(ubuf, 0, ud);

  const enc = device.createCommandEncoder();
  const pass = (view, p, g) => {
    const rp = enc.beginRenderPass({ colorAttachments: [{ view, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    rp.setPipeline(p); rp.setBindGroup(0, g); rp.draw(3); rp.end();
  };
  if (smapDirty) { pass(smapView, pShadow, BG.shadow); smapDirty = false; histValid = false; }
  pass(cauView, pCau, cauBG[0]); pass(cauLoView, pCauLo, cauBG[1]);
  {
    const rp = enc.beginRenderPass({ colorAttachments: [{ view: BG.V.scene, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }],
      depthStencilAttachment: { view: BG.V.depth, depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' } });
    rp.setPipeline(pScene); rp.setBindGroup(0, BG.main); rp.draw(3); rp.end();
  }
  if (!Q.has('nolife')) {
    const rp = enc.beginRenderPass({ colorAttachments: [{ view: BG.V.scene, loadOp: 'load', storeOp: 'store' }],
      depthStencilAttachment: { view: BG.V.depth, depthLoadOp: 'load', depthStoreOp: 'store' } });
    rp.setPipeline(pLife); rp.setBindGroup(0, BG.main);
    const animals = list => { for (const [m, inst, n] of list) { rp.setVertexBuffer(0, m.vb); rp.setVertexBuffer(1, inst); rp.setIndexBuffer(m.ib, 'uint32'); rp.drawIndexed(m.count, n); } };
    animals([[fishM, fishI, Math.round(fishData.length * q.fish)], [mantaM, mantaI, mantaData.length], [whaleM, whaleI, whaleData.length],
      [fishM, sharkI, sharkData.length], [turtleM, turtleI, turtleData.length]]);
    rp.setPipeline(pKelp);
    rp.setVertexBuffer(0, kelpVB); rp.setVertexBuffer(1, kelpI); rp.setIndexBuffer(kelpIB, 'uint16'); rp.drawIndexed(kelpIdx.length, Math.round(kelpData.length * q.kelp));
    rp.setVertexBuffer(0, floraVB); rp.setVertexBuffer(1, floraI); rp.setIndexBuffer(floraIB, 'uint16'); rp.drawIndexed(floraIdx.length, Math.round(floraData.length * q.kelp));
    rp.setPipeline(pLifeAdd); animals([[jellyM, jellyI, jellyData.length]]);
    rp.setPipeline(pPart);
    rp.setVertexBuffer(0, partI); rp.draw(6, PART_FIXED + q.snow);
    rp.end();
  }
  histIdx = 1 - histIdx;
  pass(BG.V.hist[histIdx], pTaa, BG.taa[histIdx]);
  pass(BG.V.bloom[0], pDown0, BG.down0[histIdx]);
  for (let i = 0; i < 3; i++) pass(BG.V.bloom[i + 1], pDown, BG.down[i]);
  if (OFF && !capTex) capTex = device.createTexture({ size: [cw, ch], format: canvasFormat, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  pass((OFF ? capTex : ctx.getCurrentTexture()).createView(), pFinal, BG.final[histIdx]);
  device.queue.submit([enc.finish()]);

  histValid = true; accum = Math.min(accum + 1, 4096); frame++;
  prev = { pos: [...cam.pos], f, r, up, yaw: cam.yaw, pitch: cam.pitch };

  if (CAP) {
    window.__progress = accum + '/' + photoN;
    if (accum >= Math.max(1, photoN)) {
      readback();
      window.__info = `bake ${window.__bakeMs}ms ${cw}x${ch} render ${rw}x${rh} tier ${tier} adapter ${adapter.info?.vendor || ''} ${adapter.info?.architecture || ''} ${adapter.info?.description || ''}`;
      return;
    }
  } else if (now - statT > 500) {
    statT = now;
    $('stat').textContent = `${Math.round(1000 / ema)} fps · ${rw}×${rh} · ${TIERS[tier].name}` + (frozen ? ` · 定格 ${accum}` : '');
  }
  requestAnimationFrame(render);
}

async function readback() {
  const bpr = Math.ceil(cw * 4 / 256) * 256;
  const buf = device.createBuffer({ size: bpr * ch, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = device.createCommandEncoder();
  enc.copyTextureToBuffer({ texture: capTex }, { buffer: buf, bytesPerRow: bpr }, [cw, ch]);
  device.queue.submit([enc.finish()]);
  await buf.mapAsync(GPUMapMode.READ);
  const src = new Uint8Array(buf.getMappedRange());
  const img = new ImageData(cw, ch);
  for (let y = 0; y < ch; y++) img.data.set(src.subarray(y * bpr, y * bpr + cw * 4), y * cw * 4);
  const c2 = document.createElement('canvas'); c2.width = cw; c2.height = ch;
  c2.getContext('2d').putImageData(img, 0, 0);
  window.__shot = c2.toDataURL('image/png');
  window.__state = 'done';
}
allocShadow(); allocTargets(true);
if (CAP) goSpot(Math.max(0, +Q.get('shot') - 1), true);
if (Q.has('pos')) { const v = Q.get('pos').split(',').map(Number); cam.pos = v.slice(0, 3); cam.yaw = v[3] || 0; cam.pitch = v[4] || 0; }
window.__state = 'running';
requestAnimationFrame(render);
})();
</script>
</body>
</html>
